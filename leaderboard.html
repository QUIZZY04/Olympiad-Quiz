<!DOCTYPE html>
<html>
<head>
<title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #0f0f1b;
    color: white;
}

/* Updated Navigation to match Dashboard Image */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: #1e1e2f;
    border-bottom: 1px solid #2d2d44;
}

nav h2 {
    color: #ffb703;
    font-size: 1.4rem;
    font-weight: 700;
}

nav div {
    display: flex;
    gap: 30px; /* Adjust spacing between links */
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase; /* Matches Dashboard uppercase style */
    transition: 0.3s;
    letter-spacing: 0.5px;
}

nav a:hover {
    color: #ffb703;
}

/* Active tab: Text color only, no background box */
.active {
    color: #ffb703 !important;
    background: transparent !important;
}

/* Leaderboard Table Styles */
.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: #161625;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 15px;
    border: 1px solid #2d2d44;
    text-align: center;
}

th {
    background: #2f2f55;
    color: #ffb703;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 1px;
}

tr:nth-child(even) {
    background: #1e1e2f;
}

/* Rank Styling */
.rank-1 { background: rgba(255, 183, 3, 0.05) !important; }
</style>
</head>

<body>

<nav>
    <h2>🎓 Olympiad Portal</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Take Quiz</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<div class="container">

    <h1>🏆 Global Leaderboard</h1>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Participant</th>
                <th>Class</th>
                <th>Subject</th>
                <th>Score</th>
                <th>Accuracy</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            </tbody>
    </table>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
        messagingSenderId: "341855557503",
        appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            loadLeaderboard();
        }
    });

    async function loadLeaderboard() {
        const leaderboardBody = document.getElementById("leaderboardBody");
        try {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"));
            const querySnapshot = await getDocs(q);

            leaderboardBody.innerHTML = "";
            let rank = 1;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                leaderboardBody.innerHTML += `
                    <tr>
                        <td>${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</td>
                        <td style="font-weight:600">${data.email || data.name || "-"}</td>
                        <td>${data.studentClass || data.class || "-"}</td>
                        <td>${data.subject || "-"}</td>
                        <td>${data.score}/${data.total}</td>
                        <td>${data.accuracy}%</td>
                        <td>${data.date ? data.date.toDate().toLocaleDateString() : "-"}</td>
                    </tr>
                `;
                rank++;
            });

            if (rank === 1) {
                leaderboardBody.innerHTML = "<tr><td colspan='7'>No data available</td></tr>";
            }
        } catch (error) {
            leaderboardBody.innerHTML = "<tr><td colspan='7'>Error loading data</td></tr>";
        }
    }

    window.logout = function() {
        signOut(auth).then(() => {
            window.location.href = "login.html";
        });
    };
</script>

</body>
</html>
