<!DOCTYPE html>
<html>
<head>
<title>Leaderboard - Olympiad Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --amber: #f59e0b; --danger: #ef4444; --brand: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* UNIFIED NAVIGATION */
    .utility-nav { background: #020617; padding: 12px 60px; display: flex; justify-content: flex-end; gap: 40px; border-bottom: 1px solid var(--border); }
    .utility-nav a { color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .utility-nav a.active { color: var(--amber); }
    header.top-bar { background: var(--surface); border-bottom: 2px solid var(--border); padding: 15px 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
    .brand { font-size: 20px; font-weight: 800; color: var(--amber); text-decoration: none; }

    /* TABLE CONTENT */
    .container { max-width: 1100px; margin: 40px auto; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; font-weight: 800; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th { background: #020617; color: var(--amber); padding: 15px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
    td { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; font-size: 14px; }
    tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    .rank-cell { font-weight: 800; }
</style>
</head>
<body>
<nav class="utility-nav">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html" class="active">Leaderboard</a>
    <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
</nav>
<header class="top-bar"><a href="dashboard.html" class="brand">🎓 Olympiad Portal</a></header>
<div class="container">
    <h1>🏆 Global Leaderboard</h1>
    <table>
        <thead><tr><th>Rank</th><th>Participant</th><th>Class</th><th>Subject</th><th>Score</th><th>Accuracy</th><th>Date</th></tr></thead>
        <tbody id="leaderboardBody"></tbody>
    </table>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", authDomain: "olympiad-portal-d2a5e.firebaseapp.com", projectId: "olympiad-portal-d2a5e" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
    async function load(){
        const b = document.getElementById("leaderboardBody");
        const q = query(collection(db, "leaderboard"), orderBy("score", "desc"));
        const s = await getDocs(q); let r = 1;
        s.forEach(d => {
            const data = d.data();
            b.innerHTML += `<tr><td class="rank-cell">${r <= 3 ? ['🥇','🥈','🥉'][r-1] : r}</td><td style="font-weight:700">${data.email || "-"}</td><td>${data.class || "-"}</td><td>${data.subject || "-"}</td><td>${data.score}/${data.total}</td><td>${data.accuracy}%</td><td>${data.date ? data.date.toDate().toLocaleDateString() : "-"}</td></tr>`;
            r++;
        });
    }
    load(); window.logout = () => signOut(auth).then(()=>window.location.href="login.html");
</script>
</body>
</html>
