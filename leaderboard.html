<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #020617;                 
      --surface: #0f172a;            
      --surface-champ: #1e293b;            
      --text: #f8fafc;               
      --muted: #94a3b8;              
      --border: #334155;             
      --amber: #f59e0b;              
      --danger: #ef4444;
      --brand: #38bdf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    nav {
      background: var(--surface); 
      border-bottom: 2px solid var(--border);
      padding: 15px 5%; 
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 1000;
    }

    .brand { font-size: 20px; font-weight: 800; color: var(--amber); text-decoration: none; }
    .nav-links { display: flex; gap: 15px; }
    .nav-links a { color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .nav-links a.active { color: var(--amber); }

    .container { width: 98%; max-width: 1400px; margin: 20px auto; padding: 0 10px; flex: 1; }
    
    h1 { text-align: center; margin-bottom: 20px; font-weight: 800; font-size: 24px; color: var(--text); }

    .selection-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
    .selection-bar select {
      background: var(--surface); color: var(--amber); border: 2px solid var(--amber);
      padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; outline: none;
    }

    .leaderboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .lb-card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
    .weekly-card { border: 2px solid var(--amber); background: var(--surface-champ); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .card-header h2 { font-size: 16px; font-weight: 800; text-transform: uppercase; color: var(--amber); }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 450px; }
    th { color: var(--muted); text-align: center; padding: 12px 5px; font-size: 10px; text-transform: uppercase; background: rgba(0,0,0,0.2); }
    td { padding: 12px 5px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
    
    .rank-circle {
        background: rgba(245, 158, 11, 0.2); color: var(--amber); 
        width: 28px; height: 28px; display: inline-flex; 
        align-items: center; justify-content: center; border-radius: 50%; font-weight: 800;
    }

    @media (max-width: 900px) {
      .leaderboard-grid { grid-template-columns: 1fr; }
      .selection-bar { flex-direction: column; align-items: center; }
    }
    
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 11px; background: #020617; margin-top: 40px; }
  </style>
</head>

<body>

<nav>
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Take Quiz</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🏆 Hall of Fame</h1>

    <div class="selection-bar">
        <select id="gradeSelect">
            <option value="class5">Grade 5</option>
            <option value="class6" selected>Grade 6</option>
            <option value="class7">Grade 7</option>
            <option value="class8">Grade 8</option>
            <option value="class9">Grade 9</option>
            <option value="class10">Grade 10</option>
        </select>

        <select id="subjectSelect">
            <option value="maths">Mathematics</option>
            <option value="science" selected>Science</option>
            <option value="english">English</option>
            <option value="reasoning">Reasoning</option>
        </select>
    </div>

    <div class="leaderboard-grid">
        <div class="lb-card weekly-card">
            <div class="card-header">
                <h2>⭐ Science Weekly Quiz 2</h2>
                <span style="font-size:10px; color:var(--muted);">SESSION: MAR 15</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Time</th></tr>
                    </thead>
                    <tbody id="weeklyBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="lb-card">
            <div class="card-header">
                <h2>📚 Daily Practice</h2>
                <span id="subjectLabel" style="font-size:10px; color:var(--muted); text-transform:uppercase;">SCIENCE</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Accuracy</th></tr>
                    </thead>
                    <tbody id="dailyBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Olympiad Portal</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) window.location.href = "login.html";
  else refreshAll();
});

async function refreshAll() {
    const grade = document.getElementById("gradeSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    document.getElementById("subjectLabel").innerText = subject;
    
    loadWeekly(grade);
    loadDaily(grade, subject);
}

// RESTORED DAILY LOGIC: Uses your 'leaderboard' collection
async function loadDaily(grade, subject) {
    const tbody = document.getElementById("dailyBody");
    try {
        // Query matching your original 'leaderboard' structure
        const q = query(
            collection(db, "leaderboard"), 
            where("class", "==", grade), 
            where("subject", "==", subject),
            orderBy("score", "desc"),
            limit(10)
        );
        const snap = await getDocs(q);
        renderTable(snap, tbody, false);
    } catch (err) {
        console.error("Daily Error:", err);
        tbody.innerHTML = "<tr><td colspan='4'>Error loading data.</td></tr>";
    }
}

async function loadWeekly(grade) {
    const tbody = document.getElementById("weeklyBody");
    const classNum = grade.replace('class', '');
    const sessionId = `2026_03_15_C${classNum}_SCI`;
    try {
        const q = query(
            collection(db, "leaderboard"), 
            where("sessionId", "==", sessionId),
            orderBy("score", "desc"),
            limit(10)
        );
        const snap = await getDocs(q);
        renderTable(snap, tbody, true);
    } catch (err) {
        console.error("Weekly Error:", err);
        tbody.innerHTML = "<tr><td colspan='4'>Error loading data.</td></tr>";
    }
}

function renderTable(snap, tbody, isWeekly) {
    tbody.innerHTML = "";
    if (snap.empty) {
        tbody.innerHTML = "<tr><td colspan='4'>No records found.</td></tr>";
        return;
    }
    let rank = 1;
    snap.forEach((doc) => {
        const data = doc.data();
        const participant = data.userName || data.email || "Student";
        const score = data.score || 0;
        const total = isWeekly ? 50 : (data.total || 30);
        const extra = isWeekly ? 
            (data.timeTaken ? `${Math.floor(data.timeTaken/60)}m ${data.timeTaken%60}s` : "-") : 
            `${data.accuracy || 0}%`;

        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle">${rank}</span></td>
                <td style="font-weight:600; text-align:left;">${participant}</td>
                <td style="color:var(--amber); font-weight:700;">${score}/${total}</td>
                <td>${extra}</td>
            </tr>
        `;
        rank++;
    });
}

document.getElementById("gradeSelect").addEventListener("change", refreshAll);
document.getElementById("subjectSelect").addEventListener("change", refreshAll);

window.logout = function() {
    if(confirm("Are you sure you want to logout?")) {
        signOut(auth).then(() => { window.location.href = "login.html"; });
    }
};
</script>
</body>
</html>
