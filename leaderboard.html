<!DOCTYPE html>
<html>
<head>
<title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: #0f111a; /* Matches the deep dark blue of the dashboard */
    color: white;
}

/* NAVIGATION - MATCHED TO DASHBOARD IMAGE */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 60px;
    background: #161b22; /* Dashboard navbar background color */
    border-bottom: 1px solid #30363d;
}

nav h2 {
    color: #f39c12; /* Brand orange-yellow */
    font-size: 1.3rem;
    font-weight: 800;
}

nav div {
    display: flex;
    gap: 35px; /* Spacing between menu items */
}

nav a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800; /* Extra bold like the dashboard */
    font-size: 13px;
    text-transform: uppercase;
    transition: color 0.2s ease;
}

/* Hover effect */
nav a:hover {
    color: #f39c12;
}

/* THE ACTIVE TAB - Exact color from dashboard image */
.active {
    color: #f39c12 !important; 
    background: transparent !important; /* No box, just text color */
}

/* LOGOUT BUTTON - Matches the specific red-orange in the image */
.logout-btn {
    color: #e74c3c !important;
}

/* LEADERBOARD TABLE STYLING */
.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 40px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #161b22;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

th {
    background: #21262d;
    color: #f39c12;
    padding: 18px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1px;
    border-bottom: 2px solid #30363d;
}

td {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #30363d;
    font-size: 14px;
}

tr:hover {
    background: #1c2128;
}

/* Top 3 Row Styling */
.rank-1 { background: rgba(243, 156, 18, 0.1) !important; }
.rank-2 { background: rgba(255, 255, 255, 0.03) !important; }

</style>
</head>

<body>

<nav>
    <h2>Olympiad Portal</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Take Quiz</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="#" onclick="logout()" class="logout-btn">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🏆 Global Leaderboard</h1>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Participant</th>
                <th>Class</th>
                <th>Subject</th>
                <th>Score</th>
                <th>Accuracy</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
        messagingSenderId: "341855557503",
        appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            loadLeaderboard();
        }
    });

    async function loadLeaderboard() {
        const leaderboardBody = document.getElementById("leaderboardBody");
        try {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"));
            const querySnapshot = await getDocs(q);
            leaderboardBody.innerHTML = "";
            let rank = 1;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const rowClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : '');
                
                leaderboardBody.innerHTML += `
                    <tr class="${rowClass}">
                        <td style="font-weight:bold">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</td>
                        <td style="font-weight:700">${data.email || data.name || "-"}</td>
                        <td>${data.studentClass || data.class || "-"}</td>
                        <td>${data.subject || "-"}</td>
                        <td>${data.score}/${data.total}</td>
                        <td>${data.accuracy}%</td>
                        <td>${data.date ? data.date.toDate().toLocaleDateString() : "-"}</td>
                    </tr>
                `;
                rank++;
            });
        } catch (e) {
            leaderboardBody.innerHTML = "<tr><td colspan='7'>Error loading scores.</td></tr>";
        }
    }

    window.logout = function() {
        signOut(auth).then(() => { window.location.href = "login.html"; });
    };
</script>

</body>
</html>
