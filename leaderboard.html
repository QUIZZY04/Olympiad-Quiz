<div class="container">
    <h1>🏆 Hall of Fame</h1>

    <div class="selection-bar">
        <select id="gradeSelect">
            <option value="all">All Grades (Global)</option> <option value="class1">Grade 1</option>
            <option value="class2">Grade 2</option>
            <option value="class3">Grade 3</option>
            <option value="class4">Grade 4</option>
            <option value="class5">Grade 5</option>
            <option value="class6">Grade 6</option>
            <option value="class7">Grade 7</option>
            <option value="class8">Grade 8</option>
            <option value="class9">Grade 9</option>
            <option value="class10">Grade 10</option>
        </select>

        <select id="subjectSelect">
            <option value="all">All Subjects</option> <option value="maths">Mathematics</option>
            <option value="science">Science</option>
            <option value="english">English</option>
            <option value="reasoning">Reasoning</option>
        </select>
    </div>

    <div class="leaderboard-grid">
        <div class="lb-card weekly-card">
            <div class="card-header">
                <h2>⭐ Science Weekly Quiz 2</h2>
                <span style="font-size:10px; color:var(--muted);">SESSION: MAR 15</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Time</th></tr>
                    </thead>
                    <tbody id="weeklyBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="lb-card">
            <div class="card-header">
                <h2>📚 Daily Practice</h2>
                <span id="subjectLabel" style="font-size:10px; color:var(--muted); text-transform:uppercase;">GLOBAL</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Grade</th></tr> </thead>
                    <tbody id="dailyBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
// ... Firebase Imports and Config remain same as your provided file ...

async function refreshAll() {
    const grade = document.getElementById("gradeSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    document.getElementById("subjectLabel").innerText = (grade === "all" && subject === "all") ? "GLOBAL" : subject;
    
    loadWeekly(grade === "all" ? "class6" : grade); // Default weekly to class6 if all selected
    loadDaily(grade, subject);
}

async function loadDaily(grade, subject) {
    const tbody = document.getElementById("dailyBody");
    tbody.innerHTML = "<tr><td colspan='4'>Searching...</td></tr>";
    
    try {
        let q = collection(db, "leaderboard");

        // DYNAMIC QUERY BUILDING
        if (grade !== "all" && subject !== "all") {
            // Filtered View: Only shows specific grade and subject
            q = query(q, where("studentClass", "==", grade), where("subject", "==", subject), orderBy("score", "desc"), limit(20));
        } else if (grade !== "all") {
            // Grade-only View: Shows all subjects for a specific grade
            q = query(q, where("studentClass", "==", grade), orderBy("score", "desc"), limit(20));
        } else if (subject !== "all") {
            // Subject-only View: Shows all grades for a specific subject
            q = query(q, where("subject", "==", subject), orderBy("score", "desc"), limit(20));
        } else {
            // GLOBAL VIEW: Shows everything in the database
            q = query(q, orderBy("score", "desc"), limit(30));
        }

        let snap = await getDocs(q);

        // FALLBACK FOR OLDER DATA (checks 'class' field if 'studentClass' is empty)
        if (snap.empty && grade !== "all") {
            const qBackup = query(collection(db, "leaderboard"), where("class", "==", grade), orderBy("score", "desc"), limit(20));
            snap = await getDocs(qBackup);
        }

        renderDailyTable(snap, tbody);
    } catch (err) {
        console.error("Daily Error:", err);
        tbody.innerHTML = "<tr><td colspan='4'>Error: Click the new blue link in F12 Console.</td></tr>";
    }
}

function renderDailyTable(snap, tbody) {
    tbody.innerHTML = "";
    if (snap.empty) {
        tbody.innerHTML = "<tr><td colspan='4'>No records found.</td></tr>";
        return;
    }

    let rank = 1;
    snap.forEach((doc) => {
        const data = doc.data();
        const gradeDisplay = (data.studentClass || data.class || "N/A").replace('class', 'G');
        
        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle">${rank}</span></td>
                <td style="font-weight:600; text-align:left;">${data.email || "Student"}</td>
                <td style="color:var(--amber); font-weight:700;">${data.score}/${data.total || 30}</td>
                <td style="text-transform:uppercase; font-size:10px;">${gradeDisplay}</td>
            </tr>
        `;
        rank++;
    });
}
// ... Rest of scripts (loadWeekly, events, logout) remain same as your file ...
</script>
