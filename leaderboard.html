<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #020617;                 
      --surface: #0f172a;            
      --surface-champ: #1e293b;            
      --text: #f8fafc;               
      --muted: #94a3b8;              
      --border: #334155;             
      --amber: #f59e0b;              
      --danger: #ef4444;
      --brand: #38bdf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    nav {
      background: var(--surface); 
      border-bottom: 2px solid var(--border);
      padding: 15px 5%; 
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 1000;
    }
    .brand { font-size: 20px; font-weight: 800; color: var(--amber); text-decoration: none; }
    .nav-links { display: flex; gap: 15px; }
    .nav-links a { color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .nav-links a.active { color: var(--amber); }

    .container { width: 98%; max-width: 1400px; margin: 20px auto; padding: 0 10px; flex: 1; }
    h1 { text-align: center; margin-bottom: 20px; font-weight: 800; font-size: 24px; color: var(--text); }

    /* SEPARATE FILTER STYLING */
    .filter-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    .filter-box {
      background: var(--surface);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-box.weekly-filter { border: 1px solid var(--amber); background: var(--surface-champ); }
    .filter-box h3 { font-size: 11px; text-transform: uppercase; color: var(--amber); letter-spacing: 1px; }
    .filter-row { display: flex; gap: 10px; }
    .filter-row select {
      flex: 1;
      background: #020617;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .leaderboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .lb-card {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .weekly-card { border: 2px solid var(--amber); background: var(--surface-champ); }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;
    }
    .card-header h2 { font-size: 16px; font-weight: 800; text-transform: uppercase; color: var(--amber); }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 450px; }
    th { color: var(--muted); text-align: center; padding: 12px 5px; font-size: 10px; text-transform: uppercase; background: rgba(0,0,0,0.2); }
    td { padding: 12px 5px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
    
    .rank-circle {
        background: rgba(245, 158, 11, 0.2); color: var(--amber); 
        width: 28px; height: 28px; display: inline-flex; 
        align-items: center; justify-content: center; border-radius: 50%; font-weight: 800;
    }

    @media (max-width: 1000px) {
      .leaderboard-grid, .filter-container { grid-template-columns: 1fr; }
    }
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 11px; background: #020617; margin-top: 40px; }
  </style>
</head>
<body>

<nav>
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🏆 Hall of Fame</h1>

    <div class="filter-container">
        <div class="filter-box weekly-filter">
            <h3>Weekly Championship Filters</h3>
            <div class="filter-row">
                <select id="weeklyGrade">
                    <option value="class6">Grade 6</option>
                    <option value="class7">Grade 7</option>
                    <option value="class8">Grade 8</option>
                </select>
                <select id="weeklySession">
                    <option value="2026_03_15">Session: Mar 15</option>
                    <option value="2026_03_08">Session: Mar 08</option>
                </select>
            </div>
        </div>

        <div class="filter-box">
            <h3>Daily Practice Filters</h3>
            <div class="filter-row">
                <select id="dailyGrade">
    <option value="all" selected>All Grades (Global)</option>
    <option value="class1">Grade 1</option>
    <option value="class2">Grade 2</option>
    <option value="class3">Grade 3</option>
    <option value="class4">Grade 4</option>
    <option value="class5">Grade 5</option> <option value="class6">Grade 6</option>
    <option value="class7">Grade 7</option>
</select>
                <select id="dailySubject">
                    <option value="all" selected>All Subjects</option>
                    <option value="maths">Mathematics</option>
                    <option value="science">Science</option>
                </select>
            </div>
        </div>
    </div>

    <div class="leaderboard-grid">
        <div class="lb-card weekly-card">
            <div class="card-header">
                <h2>⭐ Weekly Quiz</h2>
                <span id="weeklyLabel" style="font-size:10px; color:var(--muted);">MAR 15</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Time</th></tr>
                    </thead>
                    <tbody id="weeklyBody"></tbody>
                </table>
            </div>
        </div>

        <div class="lb-card">
            <div class="card-header">
                <h2>📚 Daily Practice</h2>
                <span id="dailyLabel" style="font-size:10px; color:var(--muted); text-transform:uppercase;">GLOBAL</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Rank</th><th>Participant</th><th>Score</th><th>Sub</th><th>Grd</th><th>Date</th></tr>
                    </thead>
                    <tbody id="dailyBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Olympiad Portal</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) window.location.href = "login.html";
  else {
      refreshWeekly();
      refreshDaily();
  }
});

// WEEKLY LOGIC
async function refreshWeekly() {
    const tbody = document.getElementById("weeklyBody");
    const grade = document.getElementById("weeklyGrade").value;
    const sessionDate = document.getElementById("weeklySession").value;
    const classNum = grade.replace('class', '');
    const sessionId = `${sessionDate}_C${classNum}_SCI`;

    tbody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";
    try {
        const q = query(collection(db, "leaderboard"), where("sessionId", "==", sessionId), orderBy("score", "desc"), limit(10));
        const snap = await getDocs(q);
        renderWeekly(snap, tbody);
    } catch (e) { 
        tbody.innerHTML = "<tr><td colspan='4'>Error: Create Index in F12 Console.</td></tr>"; 
    }
}

// DAILY LOGIC
async function refreshDaily() {
    const tbody = document.getElementById("dailyBody");
    const grade = document.getElementById("dailyGrade").value;
    const subject = document.getElementById("dailySubject").value;
    document.getElementById("dailyLabel").innerText = (grade === "all" && subject === "all") ? "GLOBAL" : subject;

    tbody.innerHTML = "<tr><td colspan='6'>Loading...</td></tr>";
    try {
        let q = collection(db, "leaderboard");
        if (grade !== "all" && subject !== "all") {
            q = query(q, where("studentClass", "==", grade), where("subject", "==", subject), orderBy("score", "desc"), limit(20));
        } else if (grade !== "all") {
            q = query(q, where("studentClass", "==", grade), orderBy("score", "desc"), limit(20));
        } else if (subject !== "all") {
            q = query(q, where("subject", "==", subject), orderBy("score", "desc"), limit(20));
        } else {
            q = query(q, orderBy("score", "desc"), limit(30));
        }
        const snap = await getDocs(q);
        renderDaily(snap, tbody);
    } catch (err) { 
        tbody.innerHTML = "<tr><td colspan='6'>Error: Create Index in F12 Console.</td></tr>"; 
    }
}

function renderDaily(snap, tbody) {
    tbody.innerHTML = "";
    if (snap.empty) { tbody.innerHTML = "<tr><td colspan='6'>No records found.</td></tr>"; return; }
    let rank = 1;
    snap.forEach((doc) => {
        const d = doc.data();
        const gradeDisp = (d.studentClass || d.class || "N/A").replace('class', 'G');
        
        let dateStr = "N/A";
        if (d.date && d.date.toDate) {
            dateStr = d.date.toDate().toLocaleDateString('en-GB');
        }

        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle">${rank++}</span></td>
                <td style="font-weight:600; text-align:left;">${d.email || "Student"}</td>
                <td style="color:var(--amber); font-weight:700;">${d.score}/${d.total || 30}</td>
                <td style="text-transform:uppercase; font-size:10px;">${d.subject || "N/A"}</td>
                <td style="font-size:10px;">${gradeDisp}</td>
                <td style="font-size:10px; color:var(--muted);">${dateStr}</td>
            </tr>`;
    });
}

function renderWeekly(snap, tbody) {
    tbody.innerHTML = "";
    if (snap.empty) { tbody.innerHTML = "<tr><td colspan='4'>No records found.</td></tr>"; return; }
    let rank = 1;
    snap.forEach((doc) => {
        const d = doc.data();
        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle">${rank++}</span></td>
                <td style="text-align:left;">${d.email}</td>
                <td style="color:var(--amber); font-weight:700;">${d.score}/50</td>
                <td>${d.timeTaken ? Math.floor(d.timeTaken/60)+'m' : '60m'}</td>
            </tr>`;
    });
}

// Separate Event Listeners
document.getElementById("weeklyGrade").addEventListener("change", refreshWeekly);
document.getElementById("weeklySession").addEventListener("change", refreshWeekly);
document.getElementById("dailyGrade").addEventListener("change", refreshDaily);
document.getElementById("dailySubject").addEventListener("change", refreshDaily);

window.logout = function() {
    if(confirm("Logout?")) signOut(auth).then(() => { window.location.href = "login.html"; });
};
</script>
</body>
</html>
