<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f172a;                 
      --surface: #1e293b;            
      --text: #f8fafc;               
      --muted: #94a3b8;              
      --border: #334155;             
      --brand: #38bdf8;              
      --amber: #f59e0b;              
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body { 
      background-color: var(--bg); 
      min-height: 100vh; 
      color: var(--text);
    }

    /* --- NAVIGATION --- */
    nav {
      background: var(--surface); 
      border-bottom: 2px solid var(--border);
      padding: 15px 60px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand { font-size: 22px; font-weight: 800; color: var(--amber); text-decoration: none; }
    .nav-links { display: flex; gap: 20px; align-items: center; }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--amber) !important; }

    /* --- TABLE CONTAINER --- */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { text-align: center; margin-bottom: 30px; font-weight: 800; }

    /* Fix: Mobile responsiveness wrapper */
    .table-wrapper {
      width: 100%;
      overflow-x: auto; /* Allows horizontal swipe on small screens */
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px; /* Ensures table doesn't squash too much */
    }

    th {
      background: #020617;
      color: var(--amber);
      padding: 15px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }

    td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      white-space: nowrap; /* Prevents text from wrapping into multiple lines */
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tr:hover { background: rgba(56, 189, 248, 0.05); }

    .rank-cell { font-weight: 800; }

    /* --- MOBILE ADJUSTMENTS (Max-width 768px) --- */
    @media (max-width: 768px) {
      nav { padding: 15px 20px; flex-direction: column; gap: 15px; text-align: center; }
      .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
      .nav-links a { font-size: 11px; }
      
      .container { margin: 20px auto; }
      h1 { font-size: 22px; }
      
      /* Optional: Hide less important columns on mobile to save space */
      .hide-mobile { display: none; }
    }

    footer { text-align: center; padding: 20px; background: #020617; color: var(--muted); font-size: 12px; margin-top: 40px; }
  </style>
</head>

<body>

<nav>
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Take Quiz</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🏆 Global Leaderboard</h1>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Participant</th>
                    <th class="hide-mobile">Class</th>
                    <th>Subject</th>
                    <th>Score</th>
                    <th class="hide-mobile">Accuracy</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                </tbody>
        </table>
    </div>
</div>

<footer>&copy; 2026 Olympiad Portal</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) window.location.href = "login.html";
  else loadLeaderboard();
});

async function loadLeaderboard() {
    const leaderboardBody = document.getElementById("leaderboardBody");
    try {
        const q = query(collection(db, "leaderboard"), orderBy("score", "desc"));
        const querySnapshot = await getDocs(q);
        leaderboardBody.innerHTML = "";
        let rank = 1;

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            leaderboardBody.innerHTML += `
                <tr>
                    <td class="rank-cell">${rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : rank}</td>
                    <td style="font-weight:700">${data.email || "-"}</td>
                    <td class="hide-mobile">${data.class || "-"}</td>
                    <td>${data.subject || "-"}</td>
                    <td>${data.score}/${data.total}</td>
                    <td class="hide-mobile">${data.accuracy}%</td>
                    <td>${data.date ? data.date.toDate().toLocaleDateString() : "-"}</td>
                </tr>
            `;
            rank++;
        });
    } catch (err) {
        leaderboardBody.innerHTML = "<tr><td colspan='7'>Error loading rankings.</td></tr>";
    }
}

window.logout = function() {
    if(confirm("Are you sure you want to logout?")) {
        signOut(auth).then(() => { window.location.href = "login.html"; });
    }
};
</script>

</body>
</html>
