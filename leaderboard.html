<!DOCTYPE html>
<html lang="en">
<head>
  <script>
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f172a;                 
      --surface: #1e293b;            
      --text: #f8fafc;               
      --muted: #94a3b8;              
      --border: #334155;             
      --brand: #38bdf8;              
      --amber: #f59e0b;              
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body { 
      background-color: var(--bg); 
      min-height: 100vh; 
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* --- MOBILE-FRIENDLY NAVIGATION --- */
    nav {
      background: var(--surface); 
      border-bottom: 2px solid var(--border);
      padding: 15px 5%; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand { font-size: 20px; font-weight: 800; color: var(--amber); text-decoration: none; }

    .nav-links { display: flex; gap: 15px; align-items: center; }
    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--amber) !important; }

    /* --- RESPONSIVE CONTAINER --- */
    .container {
      width: 95%;
      max-width: 1100px;
      margin: 30px auto;
      flex: 1;
    }

    h1 { text-align: center; margin-bottom: 25px; font-weight: 800; font-size: 24px; }

    /* --- THE FIX: MOBILE SCROLLABLE TABLE --- */
    .table-responsive {
      width: 100%;
      overflow-x: auto; /* Vital for Mobile swiping */
      -webkit-overflow-scrolling: touch;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px; /* Prevents columns from squashing on laptop/mobile */
    }

    th {
      background: #020617;
      color: var(--amber);
      padding: 18px 10px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }

    td {
      padding: 16px 10px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      white-space: nowrap; /* Keeps data clean on one line */
    }

    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tr:hover { background: rgba(56, 189, 248, 0.05); }

    .top-rank { background: rgba(245, 158, 11, 0.08) !important; }

    /* --- SMALL SCREEN TWEAKS --- */
    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 12px; padding: 15px; }
      .nav-links { gap: 10px; flex-wrap: wrap; justify-content: center; }
      h1 { font-size: 20px; }
    }
    
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 11px; background: #020617; }
  </style>
</head>

<body>

<nav>
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Take Quiz</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <h1>🏆 Global Leaderboard</h1>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Participant</th>
                    <th>Class</th>
                    <th>Subject</th>
                    <th>Score</th>
                    <th>Accuracy</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="7">Loading rankings...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<footer>&copy; 2026 Olympiad Portal</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) window.location.href = "login.html";
  else loadLeaderboard();
});

async function loadLeaderboard() {
    const leaderboardBody = document.getElementById("leaderboardBody");
    try {
        const q = query(collection(db, "leaderboard"), orderBy("score", "desc"));
        const querySnapshot = await getDocs(q);
        leaderboardBody.innerHTML = "";
        let rank = 1;

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            
            /* --- THE FIX: HANDLE MISSING DATA BY CHECKING ALL KEYS --- */
            const participant = data.email || data.userEmail || data.userName || data.id || "Participant";
            const studentClass = data.class || data.studentClass || data.grade || "N/A";
            
            const isTop3 = rank <= 3;
            const rankSymbol = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

            leaderboardBody.innerHTML += `
                <tr class="${isTop3 ? 'top-rank' : ''}">
                    <td style="font-weight:800;">${rankSymbol}</td>
                    <td style="font-weight:600; text-align:left;">${participant}</td>
                    <td>${studentClass}</td>
                    <td style="text-transform:capitalize;">${data.subject || "-"}</td>
                    <td>${data.score || 0}/${data.total || 30}</td>
                    <td style="color:var(--brand); font-weight:700;">${data.accuracy || 0}%</td>
                    <td>${data.date ? (data.date.toDate ? data.date.toDate().toLocaleDateString() : data.date) : "-"}</td>
                </tr>
            `;
            rank++;
        });

        if (rank === 1) leaderboardBody.innerHTML = "<tr><td colspan='7'>No records found.</td></tr>";
    } catch (err) {
        console.error(err);
        leaderboardBody.innerHTML = "<tr><td colspan='7'>Error loading table.</td></tr>";
    }
}

window.logout = function() {
    if(confirm("Are you sure you want to logout?")) {
        signOut(auth).then(() => { window.location.href = "login.html"; });
    }
};
</script>

</body>
</html>
