<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Popular Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 7%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:24px;
font-weight:800;
color:#f59e0b;
}

.nav-links a{
margin-left:25px;
text-decoration:none;
color:white;
font-weight:500;
transition:.3s;
}

.nav-links a:hover{
color:#f59e0b;
}

/* HERO */

.hero{
min-height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
background:radial-gradient(circle at top,#1e293b,#020617);
}

.hero h1{
font-size:clamp(2.5rem,6vw,4.2rem);
font-weight:800;
margin-bottom:20px;
}

.hero span{
color:#f59e0b;
}

.hero p{
max-width:750px;
font-size:18px;
color:#cbd5f5;
line-height:1.6;
margin-bottom:40px;
}

/* BUTTONS */

.btns{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:16px 34px;
border-radius:10px;
font-weight:600;
text-decoration:none;
transition:.3s;
}

.btn-primary{
background:#f59e0b;
color:black;
}

.btn-primary:hover{
transform:translateY(-4px);
box-shadow:0 10px 30px rgba(245,158,11,.5);
}

.btn-secondary{
background:#1e293b;
border:1px solid #334155;
color:white;
}

}

font-size:32px;

}

flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.org-card{
background:#1e293b;
padding:30px;
border-radius:14px;
width:220px;
transition:.3s;
border:1px solid #334155;
}

.org-card:hover{
transform:translateY(-6px);
}

.org-card img{
height:60px;
margin-bottom:15px;
}

.org-card h3{
font-size:18px;
}
