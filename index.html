<body>

  <nav>
    <a href="index.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="leaderboard.html">Leaderboard</a>
        <span id="authLink"></span> </div>
  </nav>

  <main class="hero">
    <h1>Level Up Your <span>Olympiad Skills</span></h1>
    <p>The ultimate preparation platform for students. Practice with real-time quizzes and track your global ranking.</p>
    
    <div class="cta-group">
        <button onclick="handleStart()" class="btn btn-primary">Start Practicing</button>
        <a href="leaderboard.html" class="btn btn-secondary">Check Rankings</a>
    </div>
  </main>

  <footer>&copy; 2026 Olympiad Portal</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
      authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
      projectId: "olympiad-portal-d2a5e",
      storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
      messagingSenderId: "341855557503",
      appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Global variable to track login status
    let isLoggedIn = false;

    onAuthStateChanged(auth, (user) => {
      const authLink = document.getElementById("authLink");
      if (user) {
        isLoggedIn = true;
        authLink.innerHTML = `<a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>`;
      } else {
        isLoggedIn = false;
        authLink.innerHTML = `<a href="login.html" style="color:var(--amber);">Login</a>`;
      }
    });

    // Function to handle the "Get Started" button
    window.handleStart = function() {
      if (isLoggedIn) {
        window.location.href = "dashboard.html";
      } else {
        alert("Please login first to access the dashboard.");
        window.location.href = "login.html";
      }
    };

    window.logout = function() {
      if(confirm("Logout?")) {
        signOut(auth).then(() => { window.location.href = "login.html"; });
      }
    };
  </script>
</body>
</html>
