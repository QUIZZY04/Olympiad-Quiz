<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Olympiad Portal - Ignite Your Potential</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --amber: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body, html { 
      height: 100%; 
      background-color: var(--bg); 
      color: var(--text); 
      overflow-x: hidden; 
    }

    /* --- Particle Background Layer --- */
    #particles-js {
      position: fixed; /* Fixed so it doesn't move on scroll */
      width: 100%; height: 100%;
      background-color: var(--bg); z-index: 1;
    }

    /* --- Content Layer --- */
    .hero-wrapper {
      position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh;
    }

    /* --- NAVIGATION (Mobile Responsive) --- */
    nav {
      background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 5%; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; width: 100%; z-index: 1000;
    }

    .brand { font-size: 22px; font-weight: 800; color: var(--amber); text-decoration: none; }
    
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      color: #ffffff; text-decoration: none; font-size: 12px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.5px; transition: 0.3s;
    }
    .nav-links a:hover { color: var(--amber); }

    /* --- HERO SECTION --- */
    .hero-content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 60px 20px;
    }

    .hero-content h1 {
      font-size: clamp(2.2rem, 8vw, 4.2rem); font-weight: 800; margin-bottom: 20px;
      line-height: 1.1; letter-spacing: -1.5px;
    }

    .hero-content h1 span { color: var(--amber); }

    .hero-content p {
      max-width: 700px; color: var(--muted); font-size: clamp(1rem, 4vw, 1.2rem);
      margin-bottom: 40px; line-height: 1.6;
    }

    /* --- BUTTONS (Mobile Adaptive) --- */
    .cta-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; }

    .btn {
      padding: 16px 35px; border-radius: 12px; font-weight: 800;
      text-transform: uppercase; text-decoration: none; font-size: 14px;
      transition: all 0.3s ease; cursor: pointer; border: none;
      display: inline-block;
    }

    .btn-primary { background: var(--amber); color: #000; }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4); }

    .btn-secondary { background: var(--surface); color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }

    /* --- MOBILE REFINEMENTS --- */
    @media (max-width: 768px) {
      nav { 
        padding: 15px; 
        flex-direction: column; 
        gap: 12px; 
        text-align: center; 
      }
      .brand { font-size: 20px; }
      .nav-links { gap: 12px; justify-content: center; }
      .nav-links a { font-size: 11px; }

      .hero-content { padding-top: 40px; }
      .cta-group { flex-direction: column; align-items: center; }
      .btn { width: 90%; max-width: 320px; text-align: center; }
    }

    footer { 
      padding: 25px; text-align: center; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--border); z-index: 10; background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="hero-wrapper">
    <nav>
      <a href="index.html" class="brand">🎓 Olympiad Portal</a>
      <div class="nav-links">
          <a href="login.html">Login</a>
          <a href="signup.html" style="color: var(--amber);">Sign Up</a>
      </div>
    </nav>

    <main class="hero-content">
      <h1>Master Your <span>Olympiad Skills</span></h1>
      <p>Ignite your potential with the world's most advanced preparation platform. Compete globally, track your progress, and conquer your academic goals.</p>
      
      <div class="cta-group">
          <a href="signup.html" class="btn btn-primary">Join Now — It's Free</a>
          <a href="login.html" class="btn btn-secondary">Resume Learning</a>
      </div>
    </main>

    <footer>&copy; 2026 Olympiad Portal • Preparation Redefined</footer>
  </div>

  <script>
    /* Animated Particles Configuration */
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#f59e0b" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3, "random": false },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#f59e0b", "opacity": 0.15, "width": 1 },
        "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
        "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
