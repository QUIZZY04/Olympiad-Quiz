<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
  <title>Olympiad Portal - Master Maths, Science & More</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --amber: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body, html { 
      height: 100%; background-color: var(--bg); color: var(--text); 
      overflow-x: hidden; width: 100%;
    }

    #particles-js {
      position: fixed; width: 100%; height: 100%;
      background-color: var(--bg); z-index: 1;
    }

    .hero-wrapper {
      position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh;
    }

    /* --- NAVIGATION --- */
    nav {
      background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 5%; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; width: 100%; z-index: 1000;
    }

    .brand { font-size: 24px; font-weight: 800; color: var(--amber); text-decoration: none; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a {
      color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* --- ENHANCED HERO CONTENT --- */
    .hero-content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 20px;
    }

    .hero-content h1 {
      font-size: clamp(3rem, 11vw, 5.5rem); 
      font-weight: 800; margin-bottom: 25px;
      line-height: 0.95; letter-spacing: -3px;
    }

    .hero-content h1 span { color: var(--amber); }

    .hero-content p {
      max-width: 850px; color: var(--muted); 
      font-size: clamp(1.2rem, 5.5vw, 1.6rem); 
      margin-bottom: 45px; line-height: 1.4;
    }

    /* --- SUBJECT TAGS --- */
    .subject-tags {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px;
    }
    .tag {
      background: rgba(245, 158, 11, 0.1); color: var(--amber);
      padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 700;
      border: 1px solid rgba(245, 158, 11, 0.3); text-transform: uppercase;
    }

    /* --- BUTTONS --- */
    .cta-group { display: flex; gap: 15px; justify-content: center; width: 100%; }

    .btn {
      padding: 20px 45px; border-radius: 14px; font-weight: 800;
      text-transform: uppercase; text-decoration: none; font-size: 16px;
      transition: 0.3s; cursor: pointer; border: none; display: inline-block;
    }

    .btn-primary { background: var(--amber); color: #000; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.2); }
    .btn-secondary { background: var(--surface); color: #fff; border: 1px solid var(--border); }

    /* --- MOBILE STYLES --- */
    @media (max-width: 768px) {
      nav { flex-direction: column; padding: 20px 10px; gap: 15px; }
      .brand { font-size: 22px; }
      
      .hero-content { padding: 40px 15px; justify-content: flex-start; margin-top: 10vh; }
      .hero-content h1 { font-size: 3.5rem; margin-bottom: 25px; } 
      .hero-content p { font-size: 1.3rem; }
      
      .cta-group { flex-direction: column; align-items: center; gap: 15px; }
      .btn { width: 100%; max-width: 320px; }
    }

    footer { 
      padding: 30px; text-align: center; font-size: 13px; color: var(--muted);
      border-top: 1px solid var(--border); z-index: 10; background: var(--bg);
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="hero-wrapper">
    <nav>
      <a href="index.html" class="brand">🎓 Olympiad Portal</a>
      <div class="nav-links">
          <a href="login.html">Login</a>
          <a href="signup.html" style="color: var(--amber);">Sign Up</a>
      </div>
    </nav>

    <main class="hero-content">
      <div class="subject-tags">
        <span class="tag">Maths</span>
        <span class="tag">Science</span>
        <span class="tag">English</span>
        <span class="tag">Reasoning</span>
      </div>

      <h1>Win Every <span>Olympiad</span></h1>
      
      <p>The premier training ground for <strong>Maths</strong>, <strong>Science</strong>, <strong>English</strong>, and <strong>Reasoning</strong>. Compete globally and achieve excellence.</p>
      
      <div class="cta-group">
          <a href="signup.html" class="btn btn-primary">Start Training</a>
          <a href="login.html" class="btn btn-secondary">Student Login</a>
      </div>
    </main>

    <footer>&copy; 2026 Olympiad Portal • Excellence in Every Subject</footer>
  </div>

  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#f59e0b" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.4 },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#f59e0b", "opacity": 0.2, "width": 1 },
        "move": { "enable": true, "speed": 1.5 }
      },
      "interactivity": {
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
