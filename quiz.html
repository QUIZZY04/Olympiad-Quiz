<!DOCTYPE html>
<html lang="en">
<head>

<script>
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Quiz - Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root {
--bg:#0f172a; --surface:#1e293b; --text:#f8fafc;
--muted:#94a3b8; --border:#334155; --brand:#38bdf8;
--accent:#22c55e; --amber:#f59e0b; --danger:#ef4444;
--unseen-grey:#cbd5e1;
}

*{box-sizing:border-box}

html,body{
height:100%; margin:0; font-family:'Inter',sans-serif;
color:var(--text); background:var(--bg); overflow:hidden;
}

.utility-nav {
background:#020617;
padding:12px 60px;
display:flex;
justify-content:flex-end;
gap:45px;
border-bottom:1px solid var(--border);
}

.utility-nav a {
color:var(--amber);
text-decoration:none;
font-size:13px;
font-weight:800;
text-transform:uppercase;
letter-spacing:1px;
cursor:pointer;
}

header.top-bar {
z-index:1000;
background:#1e293b;
border-bottom:2px solid var(--border);
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand {
font-size:18px;
font-weight:800;
color:var(--amber);
text-decoration:none;
}

#timerWrap {
margin-top:10px;
padding:6px 15px;
border-radius:8px;
background:rgba(245,158,11,0.1);
color:var(--amber);
border:1px solid var(--amber);
font-weight:800;
font-size:1rem;
}

.quiz-container {
display:flex;
gap:15px;
padding:15px;
max-width:1400px;
width:100%;
margin:0 auto;
height:calc(100vh - 140px);
}

.section {
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
display:flex;
flex-direction:column;
overflow-y:auto;
}

.question-section{flex:2.8}
.navigation-section{flex:0 0 300px;height:fit-content}

.options{display:grid;gap:8px;margin-top:10px}

.opt{
display:flex;align-items:center;gap:12px;
padding:10px 18px;
background:rgba(15,23,42,0.6);
border:1px solid var(--border);
border-radius:8px;
cursor:pointer;
}

.quiz-buttons{display:flex;gap:10px;margin-top:20px}

.btn{
flex:1;padding:12px 5px;border-radius:6px;
font-weight:800;cursor:pointer;border:none;
text-transform:uppercase;font-size:15px;
}

.btn-save{background:var(--amber);color:#000}
.btn-prev{background:#334155;color:#fff}
.btn-finish{background:var(--danger);color:#fff}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
margin-top:8px;
margin-bottom:15px;
width:100%;
}

.cell{
aspect-ratio:1/1;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px;
border:1px solid var(--border);
cursor:pointer;
font-weight:700;
font-size:12px;
}

.cell.current{background:#2563eb;color:white}
.cell.answered{background:#16a34a;color:white}
.cell.visited{background:#dc2626;color:white}
.cell.unseen{background:var(--unseen-grey);color:#000}

@media (max-width:850px){
html,body{overflow:auto;height:auto}
.utility-nav{padding:10px 15px;gap:15px;justify-content:center}
header.top-bar{padding:10px 15px}
.quiz-container{flex-direction:column;height:auto;padding:10px;gap:10px}
.question-section,.navigation-section{width:100%;flex:none}
.btn{padding:8px 4px;font-size:12px !important;height:38px}
.grid{grid-template-columns:repeat(auto-fill,minmax(45px,1fr))}
}
</style>
</head>

<body>

<div class="utility-nav">
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="leaderboard.html">Leaderboard</a>
<a onclick="logout()" style="color:var(--danger)">Logout</a>
</div>

<header class="top-bar">
<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
<div id="timerWrap">⏳ <span id="timer">--:--</span></div>
</header>

<main class="quiz-container">

<section class="question-section section">

<div style="display:flex;justify-content:space-between;">
<span id="displaySubject">Progress</span>
<span id="progressPercent">0%</span>
</div>

<div class="progress-container">
<div class="progress-fill" id="progressBar"></div>
</div>

<div id="questionNumber" style="margin-top:15px;">QUESTION 1</div>
<div id="questionText">Loading...</div>

<div class="options" id="options"></div>

<div class="quiz-buttons">
<button class="btn btn-prev" onclick="prevQuestion()">Previous</button>
<button class="btn btn-save" onclick="nextQuestion()">Save & Next</button>
<button class="btn btn-finish" onclick="confirmSubmit()">Finish Quiz</button>
</div>

</section>

<aside class="navigation-section section">
<h3>Question Palette</h3>
<div class="grid" id="questionGrid"></div>
</aside>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,collection,query,where,getDocs,addDoc,serverTimestamp,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e",
storageBucket:"olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId:"341855557503",
appId:"1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* wait for auth session */
await auth.authStateReady();

const isChampionship=localStorage.getItem("isChampionship")==="true";
const selectedClass=localStorage.getItem("selectedClass")||"class6";
const selectedSubject=localStorage.getItem("selectedSubject")||"science";

document.getElementById("displaySubject").innerText=
`${selectedSubject.toUpperCase()} - GRADE ${selectedClass.replace("class","")}`;

let current=0,questions=[],selectedAnswers=[],visitedQuestions=[],quizSubmitted=false;
let totalTime=isChampionship?3600:1800; const initialTime=totalTime;

onAuthStateChanged(auth,async(user)=>{

if(!user){
window.location.href="login.html";
return;
}

if(isChampionship){

const sessionId=localStorage.getItem("activeSessionId");

if(!sessionId){
alert("Please unlock the test first.");
window.location.href="dashboard.html";
return;
}

const purchaseRef=doc(db,"users",user.uid,"purchases",sessionId);
const purchaseSnap=await getDoc(purchaseRef);

if(!purchaseSnap.exists()){
alert("You have not unlocked this quiz.");
window.location.href="dashboard.html";
return;
}

}

loadQuestions();

});

async function loadQuestions(){

const q=query(
collection(db,"questions"),
where("class","==",selectedClass),
where("subject","==",selectedSubject)
);

const snapshot=await getDocs(q);

questions=snapshot.docs.map(doc=>doc.data());

if(questions.length>30)questions=questions.slice(0,30);

selectedAnswers=new Array(questions.length).fill(null);
visitedQuestions=new Array(questions.length).fill(false);

generateGrid();
loadQuestion();

}

/* rest of quiz logic unchanged */

</script>

</body>
</html>
