<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Quiz - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --brand: #38bdf8; --amber: #f59e0b; --danger: #ef4444; }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family:'Inter', sans-serif; color:var(--text); background:var(--bg); overflow: hidden;}

    /* UNIFIED NAVIGATION */
    .utility-nav { background: #020617; padding: 12px 60px; display: flex; justify-content: flex-end; gap: 40px; border-bottom: 1px solid var(--border); }
    .utility-nav a { color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .utility-nav a:hover { color: var(--amber); }

    header.top-bar { background: var(--surface); border-bottom: 2px solid var(--border); padding: 15px 60px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 18px; font-weight: 800; color: var(--amber); text-decoration: none; }
    #timerWrap { padding: 6px 15px; border-radius: 8px; background: rgba(245, 158, 11, 0.1); color: var(--amber); border: 1px solid var(--amber); font-weight: 800; }

    /* QUIZ LAYOUT */
    .quiz-container { display: flex; gap: 15px; padding: 15px; max-width: 1400px; margin: 0 auto; height: calc(100vh - 140px); }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
    .question-section { flex: 2.8; }
    .navigation-section { flex: 0 0 300px; }
    .options { display: grid; gap: 8px; margin: 15px 0; }
    .opt { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .btn { flex: 1; padding: 12px; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; text-transform: uppercase; }
    .btn-save { background: var(--amber); color: #000; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .grid .cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-weight: 700; font-size: 11px; }
    .cell.current { background: #2563eb !important; color: white; }
    .cell.answered { background: #16a34a !important; color: white; }
  </style>
</head>
<body>
  <div class="utility-nav">
      <a href="index.html">Home</a> 
      <a href="dashboard.html">Dashboard</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
  </div>
  <header class="top-bar">
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div id="timerWrap">⏳ <span id="timer">30:00</span></div>
  </header>
  <main class="quiz-container">
    <section class="question-section section">
      <div id="displaySubject" style="color:var(--brand); font-weight:800; text-transform:uppercase;">Loading...</div>
      <div id="questionNumber" style="margin: 10px 0; font-size: 12px; color: var(--muted);">QUESTION 1</div>
      <div id="questionText" style="font-size: 18px; line-height: 1.4;">Please wait while questions load...</div>
      <div class="options" id="options"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn" style="background:#334155; color:white" onclick="prevQuestion()">Previous</button>
        <button class="btn btn-save" onclick="nextQuestion()">Save & Next</button>
        <button class="btn" style="background:var(--danger); color:white" onclick="confirmSubmit()">Finish Quiz</button>
      </div>
    </section>
    <aside class="navigation-section section">
      <h3 style="font-size: 15px; margin-bottom: 10px;">Question Palette</h3>
      <div class="grid" id="questionGrid"></div>
    </aside>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    const app = initializeApp({ apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", projectId: "olympiad-portal-d2a5e" });
    const auth = getAuth(app);
    window.logout = () => { if(confirm("Logout?")) signOut(auth).then(()=>window.location.replace("login.html")); };
    // Logic from your provided quiz.html remains active here...
  </script>
</body>
</html>
