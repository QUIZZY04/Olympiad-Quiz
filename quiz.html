<!DOCTYPE html>
<html lang="en">
<head>
<script>
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Quiz - Olympiad Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
--bg:#0f172a; --surface:#1e293b; --text:#f8fafc;
--muted:#94a3b8; --border:#334155; --brand:#38bdf8;
--accent:#22c55e; --amber:#f59e0b; --danger:#ef4444;
--unseen-grey:#cbd5e1;
}
*{box-sizing:border-box}
html,body{
height:100%;
margin:0;
font-family:'Inter',sans-serif;
color:var(--text);
background:var(--bg);
overflow-x:hidden;
}
.utility-nav{background:#020617; padding:12px 60px; display:flex; justify-content:flex-end; gap:45px; border-bottom:1px solid var(--border);}
.utility-nav a{color:var(--amber); text-decoration:none; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1px; cursor:pointer;}
header.top-bar{z-index:1000; background:#1e293b; border-bottom:2px solid var(--border); padding:15px 40px; display:flex; align-items:center; justify-content:space-between;}
.brand{font-size:18px; font-weight:800; color:var(--amber); text-decoration:none;}
#timerWrap{margin-top:10px; padding:6px 15px; border-radius:8px; background:rgba(245,158,11,0.1); color:var(--amber); border:1px solid var(--amber); font-weight:800; font-size:1rem;}

.quiz-container{
display:flex;
gap:15px;
padding:15px;
max-width:1400px;
width:100%;
margin:0 auto;
padding-bottom: 80px; /* Buffer for footer on mobile */
min-height:calc(100vh - 140px);
}

.section{
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
display:flex;
flex-direction:column;
overflow-y:auto;
height:100%;
}
.question-section{flex:2.8}
.navigation-section{flex:0 0 300px;height:fit-content}
.options{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px; padding:10px 18px; background:rgba(15,23,42,0.6); border:1px solid var(--border); border-radius:8px; cursor:pointer;}
.quiz-buttons{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px 5px;border-radius:6px; font-weight:800;cursor:pointer;border:none; text-transform:uppercase;font-size:15px;}
.btn-save{background:var(--amber);color:#000}
.btn-prev{background:#334155;color:#fff}
.btn-finish{background:var(--danger);color:#fff}
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px; margin-bottom:15px; width:100%;}
.cell{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1px solid var(--border); cursor:pointer; font-weight:700; font-size:12px;}

.cell.current, .legend-current { background: #2563eb !important; color: white !important; }
.cell.answered, .legend-answered { background: #16a34a !important; color: white !important; }
.cell.visited, .legend-visited { background: #dc2626 !important; color: white !important; }
.cell.unseen, .legend-unseen { background: var(--unseen-grey) !important; color: #0f172a !important; }

.palette-legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); width: 100%; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #ffffff; }
.legend-box { width: 14px; height: 14px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: white; }

footer {
  text-align:center;
  padding:30px 20px;
  background:#020617;
  color:white;
  margin-top:40px;
  border-top: 1px solid var(--border);
  position: relative;
}

@media (max-width:850px){
html,body{overflow:auto;height:auto}
.utility-nav{padding:10px 15px;gap:15px;justify-content:center}
header.top-bar{padding:10px 15px}
.quiz-container{flex-direction:column;height:auto;padding:10px;gap:10px; padding-bottom:40px;}
.question-section,.navigation-section{width:100%;flex:none}
.btn{padding:8px 4px;font-size:12px !important;height:38px}
.grid{grid-template-columns:repeat(auto-fill,minmax(45px,1fr))}
}
</style>
</head>
<body>
<div class="utility-nav">
<a href="index.html">Home</a> <a href="dashboard.html">Dashboard</a> <a href="leaderboard.html">Leaderboard</a> <a onclick="logout()" style="color:var(--danger)">Logout</a>
</div>
<header class="top-bar">
<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
<div id="timerWrap">⏳ <span id="timer">--:--</span></div>
</header>
<main class="quiz-container">
<section class="question-section section">
<div style="display:flex;justify-content:space-between;"><span id="displaySubject">Progress</span><span id="progressPercent">0%</span></div>
<div style="width:100%; height:8px; background:#0f172a; border-radius:4px; margin-top:8px; overflow:hidden;">
    <div id="progressBar" style="width:0%; height:100%; background:var(--accent); transition:0.3s;"></div>
</div>
<div id="questionNumber" style="margin-top:15px; font-weight:800; color:var(--brand);">QUESTION 1</div>
<div id="questionText" style="margin-top:10px;">Loading...</div>
<div class="options" id="options"></div>
<div class="quiz-buttons">
<button class="btn btn-prev" onclick="prevQuestion()">Previous</button>
<button class="btn btn-save" onclick="nextQuestion()">Save & Next</button>
<button class="btn btn-finish" onclick="confirmSubmit()">Finish Quiz</button>
</div>
</section>
<aside class="navigation-section section">
<h3 style="margin:0 0 10px 0;font-size:15px;color:white;">Question Palette</h3>
<div class="grid" id="questionGrid"></div>
<div class="palette-legend">
<div class="legend-item"><div class="legend-box legend-current">1</div> Current</div>
<div class="legend-item"><div class="legend-box legend-answered">1</div> Answered</div>
<div class="legend-item"><div class="legend-box legend-visited">1</div> Visited</div>
<div class="legend-item"><div class="legend-box legend-unseen">1</div> Unseen</div>
</div>
</aside>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e",
storageBucket:"olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId:"341855557503",
appId:"1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let current=0, questions=[], selectedAnswers=[], visitedQuestions=[], quizSubmitted=false;
const isChampionship=localStorage.getItem("isChampionship")==="true";
let totalTime=isChampionship?3600:1800;

onAuthStateChanged(auth, async(user)=>{
if(!user){ window.location.href="login.html"; return; }
if(isChampionship){
const sId=localStorage.getItem("activeSessionId");
if(!sId){ window.location.href="dashboard.html"; return; }
const pSnap=await getDoc(doc(db,"users",user.uid,"purchases",sId));
if(!pSnap.exists()){ window.location.href="dashboard.html"; return; }
}
loadQuestions();
startTimer();
});

async function loadQuestions(){
const sClass=localStorage.getItem("selectedClass")||"class6";
const sSub=localStorage.getItem("selectedSubject")||"science";
document.getElementById("displaySubject").innerText=`${sSub.toUpperCase()} - GRADE ${sClass.replace("class","")}`;

const q=query(collection(db,"questions"), where("class","==",sClass), where("subject","==",sSub));
const snap=await getDocs(q);
questions=snap.docs.map(d=> {
    const data = d.data();
    return { ...data, id: d.id }; 
});
if(questions.length>30) questions=questions.slice(0,30);

selectedAnswers=new Array(questions.length).fill(null);
visitedQuestions=new Array(questions.length).fill(false);
generateGrid();
loadQuestion();
}

function loadQuestion(){
const q=questions[current]; visitedQuestions[current]=true;
document.getElementById("questionNumber").innerText=`QUESTION ${current+1}`;
document.getElementById("questionText").innerHTML=q.q;
let html="";
q.o.forEach((opt,i)=>{
html+=`<label class="opt"><input type="radio" name="option" value="${i}" ${selectedAnswers[current]===i?"checked":""} onchange="saveAnswer(${i})"/><span>${opt}</span></label>`;
});
document.getElementById("options").innerHTML=html;
updateGrid();
}

function saveAnswer(v){ selectedAnswers[current]=v; updateGrid(); }
function nextQuestion(){ if(current<questions.length-1){current++; loadQuestion();} }
function prevQuestion(){ if(current>0){current--; loadQuestion();} }
function jumpTo(i){ current=i; loadQuestion(); }

function generateGrid(){
let html=""; for(let i=0;i<questions.length;i++){ html+=`<div class="cell" id="q${i}" onclick="jumpTo(${i})">${i+1}</div>`; }
document.getElementById("questionGrid").innerHTML=html;
}

function updateGrid(){
let ans=0;
for(let i=0;i<questions.length;i++){
const el=document.getElementById("q"+i); if(!el)continue;
el.className="cell";
if(i===current) el.classList.add("current");
else if(selectedAnswers[i]!==null) el.classList.add("answered");
else if(visitedQuestions[i]) el.classList.add("visited");
else el.classList.add("unseen");
if(selectedAnswers[i]!==null) ans++;
}
const p=Math.round((ans/questions.length)*100);
document.getElementById("progressBar").style.width=p+"%";
document.getElementById("progressPercent").innerText=p+"%";
}

function startTimer(){
const tInterval=setInterval(()=>{
const m=Math.floor(totalTime/60), s=totalTime%60;
document.getElementById("timer").innerText=`${m}:${s<10?"0":""}${s}`;
if(--totalTime<0){ clearInterval(tInterval); submitQuiz(); }
},1000);
}

async function submitQuiz(){
    if(quizSubmitted)return; 
    quizSubmitted=true;
    let score=0; 
    questions.forEach((q,i)=>{ if(selectedAnswers[i] == q.a) score++; });

    // RE-ESTABLISHED DATA BRIDGE FOR RESULT PAGE
    const resultData = {
        score: score,
        total: questions.length,
        questions: questions,
        answers: selectedAnswers,
        subject: localStorage.getItem("selectedSubject"),
        class: localStorage.getItem("selectedClass")
    };
    localStorage.setItem("quizResult", JSON.stringify(resultData));

    try {
        await addDoc(collection(db,"leaderboard"),{
            email:auth.currentUser.email, 
            uid:auth.currentUser.uid, 
            score:score, 
            total:questions.length,
            accuracy:((score/questions.length)*100).toFixed(2), 
            date:serverTimestamp(),
            isChampionship:isChampionship, 
            subject:localStorage.getItem("selectedSubject"), 
            studentClass:localStorage.getItem("selectedClass")
        });
        window.location.href="result.html";
    } catch(e) {
        window.location.href="result.html";
    }
}

window.logout=async()=>{ if(confirm("Logout?")){ await signOut(auth); window.location.replace("login.html"); } };
window.nextQuestion = nextQuestion; window.prevQuestion = prevQuestion;
window.jumpTo = jumpTo; window.saveAnswer = saveAnswer;
window.confirmSubmit = () => { if(confirm("Submit quiz?")) submitQuiz(); };
</script>
