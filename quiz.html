<!DOCTYPE html>
<html lang="en">
<head>
<script>
if(sessionStorage.getItem("loggedIn") !== "true"){
  window.location.href="login.html";
}
</script>
<script>
history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.go(1);
};
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Quiz - Olympiad Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --brand: #38bdf8;
      --accent: #22c55e; --amber: #f59e0b; --danger: #ef4444;
      --unseen-grey: #cbd5e1;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family:'Inter', sans-serif; color:var(--text); background:var(--bg); overflow: hidden;}
    .utility-nav { background: #020617; padding: 12px 60px; display: flex; justify-content: flex-end; gap: 45px; border-bottom: 1px solid var(--border); }
    .utility-nav a { color: var(--amber); text-decoration: none; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
    header.top-bar { z-index: 1000; background: #1e293b; border-bottom: 2px solid var(--border); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 18px; font-weight: 800; color: var(--amber); text-decoration: none; }
    #timerWrap { margin-top: 10px; padding: 6px 15px; border-radius: 8px; background: rgba(245, 158, 11, 0.1); color: var(--amber); border: 1px solid var(--amber); font-weight: 800; }
    .quiz-container { display: flex; gap: 15px; padding: 15px; max-width: 1400px; width: 100%; margin: 0 auto; height: calc(100vh - 140px); }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
    .question-section { flex: 2.8; }
    .navigation-section { flex: 0 0 300px; height: fit-content; }
    .options { display: grid; gap: 8px; margin-top: 10px; }
    .opt { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .btn { flex: 1; padding: 12px 5px; border-radius: 6px; font-weight: 800; cursor: pointer; border: none; text-transform: uppercase; font-size: 15px !important; }
    .btn-save { background: var(--amber); color: #000; }
    .btn-finish { background: var(--danger); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; width: 220px; }
    .cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-weight: 700; font-size: 11px; }
    .cell.current { background: #2563eb !important; color: white; }
    .cell.answered { background: #16a34a !important; color: white; }
    .cell.visited { background: #dc2626 !important; color: white; }
    @media (max-width: 850px) { .quiz-container { flex-direction: column; height: auto; } .navigation-section { width: 100%; } }
</style>
</head>
<body>
  <div class="utility-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
  </div>

  <header class="top-bar">
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div id="timerWrap">⏳ <span id="timer">--:--</span></div>
  </header>

  <main class="quiz-container">
    <section class="question-section section">
      <div id="displaySubject" style="font-weight:800; color:var(--brand); text-transform: uppercase;">Progress</div>
      <div id="questionNumber" style="color:var(--brand); font-weight:700; margin-top:15px;">QUESTION 1</div>
      <div id="questionText" style="font-size: 18px; margin: 12px 0;">Loading...</div>
      <div id="questionImageWrap" style="display: none; text-align:center;"><img id="questionImage" style="max-height:250px; border-radius:8px;" src="" /></div>
      <div class="options" id="options"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-save" onclick="nextQuestion()">Save & Next</button>
        <button class="btn btn-finish" onclick="confirmSubmit()">Finish Quiz</button>
      </div>
    </section>

    <aside class="navigation-section section">
      <h3 style="font-size: 15px;">Question Palette</h3>
      <div class="grid" id="questionGrid"></div>
    </aside>
  </main>

  <script src="questions.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
      authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
      projectId: "olympiad-portal-d2a5e",
      storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
      messagingSenderId: "341855557503",
      appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let current = 0, questions = [], selectedAnswers = [], visitedQuestions = [], quizSubmitted = false;
    const isChampionship = localStorage.getItem("isChampionship") === "true";
    let totalTime = isChampionship ? 3600 : 1800;
    const initialTime = totalTime;

    const selectedClass = localStorage.getItem("selectedClass") || "class6";
    const selectedSubject = localStorage.getItem("selectedSubject") || "science";
    document.getElementById("displaySubject").innerText = `${selectedSubject} - GRADE ${selectedClass.replace("class", "")}`;

    async function loadQuestions() {
      try {
        const q = query(collection(db, "questions"), where("class", "==", selectedClass), where("subject", "==", selectedSubject));
        const snapshot = await getDocs(q);
        if (!snapshot.empty) {
          questions = snapshot.docs.map(doc => ({...doc.data(), id: doc.id})).sort(() => Math.random() - 0.5);
          if (isChampionship) questions = questions.slice(0, 50); else questions = questions.slice(0, 30);
        } else {
          alert("No questions found."); window.location.href = "dashboard.html"; return;
        }
        selectedAnswers = new Array(questions.length).fill(null);
        visitedQuestions = new Array(questions.length).fill(false);
        generateGrid(); loadQuestion();
      } catch (e) { console.error(e); }
    }

    onAuthStateChanged(auth, (user) => { if (!user) window.location.replace("login.html"); else loadQuestions(); });

    window.loadQuestion = () => {
      const q = questions[current]; visitedQuestions[current] = true;
      document.getElementById("questionNumber").innerText = `QUESTION ${current + 1}`;
      document.getElementById("questionText").innerHTML = q.q;
      const imgWrap = document.getElementById("questionImageWrap"), imgTag = document.getElementById("questionImage");
      if (q.image_url) { imgWrap.style.display = "block"; imgTag.src = q.image_url; } else { imgWrap.style.display = "none"; }
      let html = '';
      q.o.forEach((opt, i) => {
        html += `<label class="opt"><input type="radio" name="option" value="${i}" ${selectedAnswers[current] === i ? "checked" : ""} onchange="saveAnswer(${i})" /><span>${opt}</span></label>`;
      });
      document.getElementById("options").innerHTML = html; updateGrid();
    };

    window.saveAnswer = (v) => { selectedAnswers[current] = v; updateGrid(); };
    window.nextQuestion = () => { if (current < questions.length - 1) { current++; loadQuestion(); } };
    window.jumpTo = (i) => { current = i; loadQuestion(); };

    function generateGrid() {
      let html = ''; for (let i = 0; i < questions.length; i++) html += `<div class="cell" id="q${i}" onclick="jumpTo(${i})">${i + 1}</div>`;
      document.getElementById("questionGrid").innerHTML = html;
    }

    function updateGrid() {
      for (let i = 0; i < questions.length; i++) {
        const el = document.getElementById("q" + i); if(!el) continue;
        el.className = 'cell';
        if (i === current) el.classList.add('current');
        else if (selectedAnswers[i] !== null) el.classList.add('answered');
        else if (visitedQuestions[i]) el.classList.add('visited');
      }
    }

    const timer = setInterval(() => {
      const m = Math.floor(totalTime / 60), s = totalTime % 60;
      document.getElementById("timer").innerText = `${m}:${s < 10 ? "0" : ""}${s}`;
      if (--totalTime < 0) { clearInterval(timer); submitQuiz(); }
    }, 1000);

    window.confirmSubmit = () => { if (confirm("Submit quiz?")) submitQuiz(); };
    
    async function submitQuiz() {
      if(quizSubmitted) return; quizSubmitted = true;
      let score = 0; questions.forEach((q, i) => { if (selectedAnswers[i] == q.a) score++; });
      const accuracy = ((score / questions.length) * 100).toFixed(2);
      
      const resultData = {
        score, total: questions.length, subject: selectedSubject, studentClass: selectedClass,
        accuracy, answers: selectedAnswers, questions: questions,
        timeTaken: initialTime - totalTime, isChampionship, sessionId: localStorage.getItem("activeSessionId") || null
      };

      try {
        await addDoc(collection(db, "leaderboard"), {
            email: auth.currentUser.email,
            uid: auth.currentUser.uid,
            studentClass: resultData.studentClass, // Key matched to DB
            subject: resultData.subject,
            score: resultData.score,
            total: resultData.total,
            accuracy: resultData.accuracy,
            date: serverTimestamp(),
            isChampionship: resultData.isChampionship,
            sessionId: resultData.sessionId
        });
        localStorage.setItem("quizResult", JSON.stringify(resultData));
        window.location.href = "result.html";
      } catch (e) { console.error(e); localStorage.setItem("quizResult", JSON.stringify(resultData)); window.location.href = "result.html"; }
    }

    window.logout = async () => { quizSubmitted = true; await signOut(auth); window.location.replace("login.html"); };
  </script>
</body>
</html>
