<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --subtle: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --brand: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); 
            border-bottom:1px solid var(--border); padding:20px 5%; 
            display:flex; align-items:center; justify-content:space-between; 
            position:sticky; top:0; z-index:1000;
        }
        .brand { font-size:1.5rem; font-weight:800; color:var(--text); text-decoration:none; }
        .nav-links { display:flex; gap:12px; }
        .nav-links a { color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; transition:0.3s; }
        .nav-links a:hover { color:var(--brand); }

        .container { width: 100%; max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; }

        .header-section { margin-bottom: 40px; }
        .breadcrumb { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; }
        .breadcrumb a { color: var(--brand); text-decoration: none; }
        
        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text); margin-bottom: 15px; }
        h1 span { color: var(--brand); text-transform: capitalize; }

        .note-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-top: 5px solid var(--brand);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease-out forwards;
            /* Base styles for content for better font and contrast */
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
        }

        /* Ensure images are responsive within the note card */
        .note-card img {
            max-width: 100%;
            height: auto;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Enhanced Heading Styles */
        .note-card h2 { color: var(--brand); font-size: 2rem; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; font-weight: 800; }
        .note-card h3 { color: var(--text); font-size: 1.5rem; margin-top: 30px; margin-bottom: 15px; font-weight: 700; }
        
        /* High-contrast paragraph text */
        .note-card p { margin-bottom: 15px; }
        
        .note-card ul { padding-left: 25px; margin-bottom: 20px; }
        .note-card li { margin-bottom: 10px; line-height: 1.6; }
        .note-card strong { color: var(--brand); font-weight: 700; }

        .highlight-box {
            background: var(--subtle);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            color: var(--text);
        }

        .formula-box {
            background: var(--bg);
            padding: 15px 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: var(--brand);
            margin: 10px 0;
            border: 1px dashed var(--border);
        }

        .action-area { text-align: center; margin-top: 50px; }
        .btn-practice {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
            display: inline-block;
        }
        .btn-practice:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }

        @media (max-width: 768px) {
            .note-card { padding: 25px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="study.html">Subjects</a>
        <a href="index.html">Home</a>
    </div>
</nav>

<div class="container">
    <div class="header-section">
        <div class="breadcrumb">
            <a href="study.html">Study Material</a> > <span id="breadSubject">Subject</span>
        </div>
        <h1><span id="pageTitle">Mathematics</span> - <span id="pageClass" style="color:var(--text)">Class 6</span></h1>
        <p style="color:var(--muted)">Curated high-performance notes for Olympiad aspirants.</p>
    </div>

    <div id="contentInjection">
        <!-- Content loads here -->
    </div>

    <div class="action-area">
        <a href="chapterwise.html" class="btn-practice">Start Practice Quiz 🚀</a>
    </div>
</div>

<footer style="text-align:center;padding:30px;border-top:1px solid var(--border);color:var(--muted);margin-top:auto;">
    <p style="font-size:14px;">© 2026 Olympiad Portal. All rights reserved.</p>
</footer>

<script type="module">
    // Firebase SDK Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your unique Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'maths';
    const classStr = urlParams.get('class') || 'class6';
    const classNum = parseInt(classStr.toLowerCase().replace('class', ''));

    // --- UPDATE PAGE TITLES ---
    document.getElementById('breadSubject').innerText = subject.charAt(0).toUpperCase() + subject.slice(1);
    document.getElementById('pageTitle').innerText = subject.charAt(0).toUpperCase() + subject.slice(1);
    document.getElementById('pageClass').innerText = `Class ${classNum}`;

    // --- LOGIC TO FETCH AND SELECT CONTENT FROM FIREBASE ---
    async function loadStudyContent() {
        const contentInjectionDiv = document.getElementById('contentInjection');
        contentInjectionDiv.innerHTML = `<div class='note-card'><p>Loading content...</p></div>`;

        // The document ID is structured as 'class6_maths'
        const docId = `${classStr}_${subject}`;

        try {
            const docRef = doc(db, "study_content", docId);
            const docSnap = await getDoc(docRef);

            let content = "";
            if (docSnap.exists() && docSnap.data().htmlContent) {
                // Use the htmlContent field from Firestore.
                // This content was saved with <br /> tags for newlines, so it will render correctly.
                content = docSnap.data().htmlContent;
            }

            if (content) {
                // Inject the HTML content directly. This allows for tags like <h2>, <p>, <ul> to be rendered.
                contentInjectionDiv.innerHTML = `<div class="note-card">${content}</div>`;
            } else {
                // Fallback message if document doesn't exist or content is empty
                contentInjectionDiv.innerHTML = `<div class='note-card'><h3>Content updating soon...</h3><p>Our experts are curating detailed notes for Class ${classNum} ${subject.charAt(0).toUpperCase() + subject.slice(1)}.</p></div>`;
            }
        } catch (error) {
            console.error("Error fetching study content:", error);
            contentInjectionDiv.innerHTML = `<div class='note-card'><h3>Error loading content</h3><p>There was a problem fetching the study material. Please try again later.</p></div>`;
        }
    }

    // Call the function to load content when the page loads
    loadStudyContent();
</script>

</body>
</html>
