<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --brand: #38bdf8;
            --accent: #818cf8;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav { 
            background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); 
            border-bottom:1px solid var(--border); padding:20px 5%; 
            display:flex; align-items:center; justify-content:space-between; 
            position:sticky; top:0; z-index:1000;
        }
        .brand { font-size:1.5rem; font-weight:700; color:#ffffff; text-decoration:none; }
        .nav-links { display:flex; gap:12px; }
        .nav-links a { color:var(--muted); text-decoration:none; font-size:0.9rem; font-weight:600; transition:0.3s; }
        .nav-links a:hover { color:var(--brand); }

        .container { width: 100%; max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; }

        .header-section { margin-bottom: 40px; }
        .breadcrumb { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; }
        .breadcrumb a { color: var(--brand); text-decoration: none; }
        
        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text); margin-bottom: 15px; }
        h1 span { color: var(--brand); text-transform: capitalize; }

        .note-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 4px solid var(--brand);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .note-card h2 { color: var(--brand); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .note-card h3 { color: var(--text); font-size: 1.3rem; margin-top: 30px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .note-card p { color: #cbd5e1; font-size: 1rem; line-height: 1.8; margin-bottom: 15px; }
        
        .note-card ul { padding-left: 20px; margin-bottom: 20px; color: #cbd5e1; }
        .note-card li { margin-bottom: 10px; line-height: 1.6; }
        .note-card strong { color: var(--text); }

        .highlight-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            color: #e2e8f0;
        }

        .formula-box {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: var(--brand);
            margin: 10px 0;
            border: 1px dashed var(--border);
        }

        .action-area { text-align: center; margin-top: 50px; }
        .btn-practice {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
            display: inline-block;
        }
        .btn-practice:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }

        @media (max-width: 768px) {
            .note-card { padding: 25px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'maths';
    const classStr = urlParams.get('class') || 'class6';

    document.getElementById('pageTitle').innerText = subject;
    document.getElementById('pageClass').innerText = `Class ${classNum}`;

    // --- CONTENT DATABASE ---
    const studyDB = {
        maths: {
            primary: `
        <div class="note-card">
            <h2>🔢 Number Sense & Operations</h2>
            <p>Foundation of mathematics involves understanding large numbers, place value, and basic arithmetic operations efficiently.</p>
            <h3>1. Number Systems</h3>
            <ul>
                <li><b>Indian System:</b> Units, Tens, Hundreds, Thousands, Lakhs, Crores.</li>
                <li><b>International System:</b> Units, Tens, Hundreds, Thousands, Millions, Billions.</li>
                <li><b>Place Value vs Face Value:</b> In 543, face value of 4 is 4, but place value is 40.</li>
            </ul>
            <h3>2. Roman Numerals</h3>
            <p>I=1, V=5, X=10, L=50, C=100, D=500, M=1000. No symbol repeats more than 3 times. A smaller value before a larger one means subtraction (e.g., IV = 4).</p>
            <h3>3. Divisibility Rules</h3>
            <ul>
                <li><b>By 2:</b> Last digit is even.</li>
                <li><b>By 3:</b> Sum of digits is divisible by 3.</li>
                <li><b>By 4:</b> Last two digits form a number divisible by 4.</li>
                <li><b>By 5:</b> Last digit is 0 or 5.</li>
                <li><b>By 9:</b> Sum of digits is divisible by 9.</li>
                <li><b>By 10:</b> Last digit is 0.</li>
            </ul>
        </div>
        <div class="note-card">

            <ul>
                <li><b>Proper Fraction:</b> Numerator < Denominator (e.g., 3/4).</li>
                <li><b>Improper Fraction:</b> Numerator > Denominator (e.g., 5/2).</li>
                <li><b>Mixed Fraction:</b> Whole number + Proper fraction (e.g., 2 1/2).</li>
            </ul>
            <div class="formula-box">Comparing Fractions (a/b and c/d): Cross-multiply. If ad > bc, then a/b > c/d.</div>

            <h2>📐 Geometry & Measurement</h2>

                <li><b>Angles:</b> Acute (<90°), Right (=90°), Obtuse (>90°).</li>
                <li><b>2D Shapes:</b> Square (4 equal sides), Rectangle (opposite sides equal), Triangle, Circle.</li>

            <div class="formula-box">Perimeter of Rectangle = 2 × (Length + Breadth)</div>
            <div class="formula-box">Area of Square = Side × Side</div>
            <div class="formula-box">Area of Rectangle = Length × Breadth</div>
        </div>
            `,
            middle: `

            <ul>
                <li><b>Integers:</b> All whole numbers and their negatives (...-2, -1, 0, 1, 2...).</li>
                <li><b>Rational Numbers:</b> Any number that can be written as a fraction p/q, where q is not zero.</li>

        </div>
        <div class="note-card">
            <h2>📐 Geometry & Mensuration</h2>

            <div class="formula-box">Area of Triangle = 1/2 × base × height</div>
            <div class="formula-box">Area of Parallelogram = base × height</div>
            <div class="formula-box">Area of Circle = πr²</div>
            <div class="formula-box">Circumference of Circle = 2πr</div>

        <div class="note-card">

            <h3>Laws of Exponents</h3>
            <div class="formula-box">aᵐ × aⁿ = a⁽ᵐ⁺ⁿ⁾</div>
            <div class="formula-box">aᵐ ÷ aⁿ = a⁽ᵐ⁻ⁿ⁾</div>
            <div class="formula-box">(aᵐ)ⁿ = a⁽ᵐⁿ⁾</div>
            <div class="formula-box">a⁰ = 1</div>

                <li><b>Profit %:</b> (Profit / Cost Price) × 100.</li>

        </div>
            `,
            secondary: `
        <div class="note-card">
            <h2>📉 Polynomials & Quadratic Equations</h2>
            <p>Polynomials are algebraic expressions with variables having non-negative integer powers.</p>
            <h3>Important Algebraic Identities</h3>
            <div class="formula-box">(a + b)² = a² + 2ab + b²</div>
            <div class="formula-box">(a - b)² = a² - 2ab + b²</div>
            <div class="formula-box">a² - b² = (a - b)(a + b)</div>
            <div class="formula-box">(a + b + c)² = a² + b² + c² + 2ab + 2bc + 2ca</div>
            <h3>Solving Quadratic Equations (ax² + bx + c = 0)</h3>
            <p>The roots of the equation can be found using the quadratic formula. The nature of roots depends on the discriminant (D = b² - 4ac).</p>
            <ul>
                <li>If D > 0, two distinct real roots.</li>
                <li>If D = 0, two equal real roots.</li>
                <li>If D < 0, no real roots.</li>
            </ul>

        </div>

                <li><b>Fundamental Identity:</b> sin²θ + cos²θ = 1.</li>
                <li><b>Heights and Distances:</b> Angle of Elevation (looking up) vs Angle of Depression (looking down).</li>
            </ul>
            <h3>Coordinate Geometry Formulas</h3>
            <div class="formula-box">Distance Formula: √[(x₂ - x₁)² + (y₂ - y₁)²]</div>
            <div class="formula-box">Section Formula (Internal): [(mx₂ + nx₁)/(m+n), (my₂ + ny₁)/(m+n)]</div>
            <div class="formula-box">Area of Triangle: 1/2 |x₁(y₂-y₃) + x₂(y₃-y₁) + x₃(y₁-y₂)|</div>

        <div class="note-card">
            <h2>📊 Statistics & Probability</h2>
            <h3>Measures of Central Tendency (Grouped Data)</h3>
            <ul>
                <li><b>Mean (Direct Method):</b> Σ(fᵢxᵢ) / Σfᵢ</li>
                <li><b>Median:</b> l + [((n/2) - cf) / f] × h</li>

            <p>The theoretical probability of an event E, written as P(E), is defined as:</p>
            <div class="highlight-box">
                P(E) = Number of outcomes favorable to E / Total number of possible outcomes
            </div>
            <p>The probability of a sure event is 1. The probability of an impossible event is 0. For any event E, 0 ≤ P(E) ≤ 1.</p>
        </div>
            `
        },
        science: {
            primary: `
                <div class="note-card">
                    <h2>🌿 The Living World</h2>
                    <h3>1. Plants Life</h3>
                    <ul>

                    </ul>
                </div>
            `,
            middle: `
                <div class="note-card">
                    <h2>⚛️ Chemistry: Changes & Substances</h2>
                    <ul>
                        <li><b>Acids:</b> Sour taste, turn blue litmus red (Lemon, Curd).</li>

                    </ul>
                </div>
                <div class="note-card">
                    <h2>⚡ Physics: Light & Electricity</h2>
                    <h3>Light</h3>
                    <ul>
                        <li><b>Rectilinear Propagation:</b> Light travels in straight lines.</li>
                        <li><b>Reflection:</b> Bouncing back of light from a surface.</li>
                        <li><b>Spherical Mirrors:</b> Concave (converging) and Convex (diverging).</li>
                    </ul>
                    <h3>Electricity</h3>
                    <ul>
                        <li><b>Conductors:</b> Allow current (Copper, Aluminum).</li>
                        <li><b>Insulators:</b> Block current (Rubber, Plastic).</li>
                    </ul>
                </div>
                <div class="note-card">
                    <h2>🧬 Biology: Life Functions</h2>
                    <ul>
                        <li><b>Nutrition:</b> Autotrophic (Plants) vs Heterotrophic (Animals).</li>
                        <li><b>Respiration:</b> Breakdown of food to release energy (Aerobic uses oxygen, Anaerobic doesn't).</li>
                        <li><b>Transportation:</b> Xylem (Water) and Phloem (Food) in plants. Arteries and Veins in humans.</li>
                    </ul>
                </div>
            `,
            secondary: `

                    <h2>🧪 Chemical Reactions & Equations</h2>
                    <p>Substances react to form new substances with different properties.</p>
                    <ul>
                        <li><b>Combination:</b> A + B → AB</li>

                    </ul>

        reasoning: {

    // --- LOGIC TO SELECT CONTENT ---
    let content = "";

    if (subject === 'english') content = studyDB.english.general;
    else if (subject === 'reasoning') content = studyDB.reasoning.general;
    else {
        // For Maths and Science, split by grade levels
        const subDB = studyDB[subject];
        if (classNum <= 5) content = subDB.primary;
        else if (classNum <= 8) content = subDB.middle;
        else content = subDB.secondary;
    }

    document.getElementById('contentInjection').innerHTML = content || "<div class='note-card'><h3>Content updating soon...</h3><p>Our experts are curating detailed notes for this section.</p></div>";

</script>
