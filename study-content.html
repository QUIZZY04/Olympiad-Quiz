<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --subtle: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --brand: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); 
            border-bottom:1px solid var(--border); padding:20px 5%; 
            display:flex; align-items:center; justify-content:space-between; 
            position:sticky; top:0; z-index:1000;
        }
        .brand { font-size:1.5rem; font-weight:800; color:var(--text); text-decoration:none; }
        .nav-links { display:flex; gap:12px; }
        .nav-links a { color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; transition:0.3s; }
        .nav-links a:hover { color:var(--brand); }

        .container { width: 100%; max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; }

        .header-section { margin-bottom: 40px; }
        .breadcrumb { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; }
        .breadcrumb a { color: var(--brand); text-decoration: none; }
        
        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text); margin-bottom: 15px; }
        h1 span { color: var(--brand); text-transform: capitalize; }

        .note-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-top: 5px solid var(--brand);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .note-card h2 { color: var(--brand); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .note-card h3 { color: var(--text); font-size: 1.3rem; margin-top: 30px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .note-card p { color: var(--muted); font-size: 1rem; line-height: 1.8; margin-bottom: 15px; }
        
        .note-card ul { padding-left: 20px; margin-bottom: 20px; color: var(--muted); }
        .note-card li { margin-bottom: 10px; line-height: 1.6; }
        .note-card strong { color: var(--text); font-weight: 700; }

        .highlight-box {
            background: var(--subtle);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            color: var(--text);
        }

        .formula-box {
            background: var(--bg);
            padding: 15px 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: var(--brand);
            margin: 10px 0;
            border: 1px dashed var(--border);
        }

        .action-area { text-align: center; margin-top: 50px; }
        .btn-practice {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
            display: inline-block;
        }
        .btn-practice:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }

        @media (max-width: 768px) {
            .note-card { padding: 25px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'maths';
    const classStr = urlParams.get('class') || 'class6';
    const classNum = parseInt(classStr.toLowerCase().replace('class', ''));

    // Set Titles
    document.getElementById('breadSubject').innerText = subject.charAt(0).toUpperCase() + subject.slice(1);
    document.getElementById('pageTitle').innerText = subject.charAt(0).toUpperCase() + subject.slice(1);
    document.getElementById('pageClass').innerText = `Class ${classNum}`;

    // --- CONTENT DATABASE ---
    const studyDB = {
        maths: {
            class1: `<div class="note-card"><h2>🔢 Chapter 1: Number Sense</h2><p>Number sense is the foundation of mathematics. It involves understanding the value of numbers and how they relate to each other.</p><ul><li><strong>Place Value:</strong> In a 2-digit number, the right digit is "Ones" and the left is "Tens".</li></ul><div class="highlight-box"><strong>Example:</strong> In the number 45, there are 4 Tens (40) and 5 Ones (5).</div></div><div class="note-card"><h2>➕ Chapter 2: Addition & Subtraction</h2><p>Addition means putting things together, and subtraction means taking them away.</p><div class="highlight-box"><strong>Word Problem:</strong> If Rahul has 5 apples and buys 3 more, he has 5 + 3 = 8 apples. If he eats 2, he has 8 - 2 = 6 apples left.</div></div><div class="note-card"><h2>📐 Chapter 3: Geometry & Patterns</h2><p>Shapes are all around us. A square has 4 equal sides, a rectangle has 2 long and 2 short sides, and a triangle has 3 sides.</p><div class="highlight-box"><strong>Pattern Example:</strong> 🔴 🟦 🔴 🟦 🔴 🟦 ... The next shape is 🔴!</div></div>`,
            class2: `<div class="note-card"><h2>🔢 Chapter 1: Numbers up to 1000</h2><p>Expanding our number system to three digits introduces the "Hundreds" place.</p><ul><li><strong>Expanded Form:</strong> Breaking a number down by the value of its digits.</li></ul><div class="formula-box">Example: 782 = 700 + 80 + 2</div></div><div class="note-card"><h2>✖️ Chapter 2: Arithmetic Operations</h2><p>Multiplication is simply repeated addition. Division is sharing equally.</p><div class="highlight-box"><strong>Example:</strong> 4 × 3 is the same as adding 4 three times (4 + 4 + 4 = 12). If you share 12 candies among 3 friends, each gets 4 (12 ÷ 3 = 4).</div></div><div class="note-card"><h2>⏰ Chapter 3: Time & Money</h2><p>Reading the clock is crucial. The short hand is the Hour hand, the long hand is the Minute hand.</p><div class="highlight-box"><strong>Trick:</strong> Count by 5s for the minute hand. If the long hand is on 3, it means 3 × 5 = 15 minutes past the hour.</div></div>`,
            class3: `<div class="note-card"><h2>🔢 Chapter 1: 4-Digit Numbers</h2><p>Working with numbers in the Thousands. Rounding off helps estimate numbers quickly.</p><div class="highlight-box"><strong>Rounding Rule:</strong> Look at the digit to the right. If it is 5 or more, round up. If it is 4 or less, keep it the same.<br><em>Round 347 to nearest ten:</em> The ones digit is 7, so it rounds up to 350.</div></div><div class="note-card"><h2>🍰 Chapter 2: Fractions</h2><p>Fractions represent parts of a whole. The top number is the Numerator (parts you have), and the bottom is the Denominator (total equal parts).</p><div class="formula-box">Fraction = Numerator / Denominator</div><div class="highlight-box">If a pizza is cut into 8 slices and you eat 3, you ate 3/8 of the pizza.</div></div><div class="note-card"><h2>📐 Chapter 3: Geometry & Data</h2><p>Understanding lines and shapes.</p><ul><li><strong>Point:</strong> Exact location.</li><li><strong>Line Segment:</strong> A straight path with two endpoints.</li><li><strong>Ray:</strong> One endpoint, goes on forever in one direction.</li></ul></div>`,
            class4: `<div class="note-card"><h2>🔢 Chapter 1: Large Numbers & Systems</h2><p>Understanding both Indian and International Place Value systems is essential.</p><div class="highlight-box"><strong>Indian System:</strong> Ones, Tens, Hundreds, Thousands, Ten Thousands, Lakhs, Ten Lakhs, Crores.<br><strong>International System:</strong> Ones, Tens, Hundreds, Thousands, Ten Thousands, Hundred Thousands, Millions.</div></div><div class="note-card"><h2>➗ Chapter 2: Factors & Multiples</h2><p>A factor divides a number exactly. A multiple is the result of multiplying a number by an integer.</p><div class="highlight-box"><strong>Prime Numbers:</strong> Numbers with only 2 factors (1 and itself) like 2, 3, 5, 7, 11.<br><strong>LCM Trick:</strong> The LCM of 4 and 6 is the smallest number in both their multiplication tables (12).</div></div><div class="note-card"><h2>📐 Chapter 3: Perimeter & Area</h2><p>Perimeter is the total boundary length. Area is the space inside.</p><div class="formula-box">Perimeter of Rectangle = 2 × (Length + Breadth)<br>Area of Rectangle = Length × Breadth</div></div>`,
            class5: `<div class="note-card"><h2>🔢 Chapter 1: Advanced Arithmetic & BODMAS</h2><p>When multiple operations are present, always follow the BODMAS rule to get the correct answer.</p><div class="formula-box">BODMAS = Brackets, Of, Division, Multiplication, Addition, Subtraction</div><div class="highlight-box"><strong>Example:</strong> 12 + 8 ÷ 4<br>Wrong way: (12 + 8) = 20 ÷ 4 = 5.<br>Correct way (BODMAS): 12 + (8 ÷ 4) = 12 + 2 = 14.</div></div><div class="note-card"><h2>🍰 Chapter 2: Decimals & Percentages</h2><p>Percentages mean "out of 100". To convert a fraction to a percentage, multiply by 100.</p><div class="highlight-box"><strong>Example:</strong> Convert 3/4 to % ➔ (3/4) × 100 = 3 × 25 = 75%.</div></div><div class="note-card"><h2>📦 Chapter 3: Volume & Area</h2><p>Volume calculates the 3D space an object occupies.</p><div class="formula-box">Volume of Cuboid = Length × Breadth × Height<br>Volume of Cube = Side × Side × Side</div></div>`,
            class6: `<div class="note-card"><h2>🔢 Chapter 1: Integers</h2><p>Integers include all positive whole numbers, zero, and negative whole numbers.</p><div class="highlight-box"><strong>Addition/Subtraction Rules:</strong><br>1. (+) and (+) ➔ Add, keep + sign.<br>2. (-) and (-) ➔ Add, keep - sign.<br>3. (+) and (-) ➔ Subtract, keep sign of the larger number.</div></div><div class="note-card"><h2>✖️ Chapter 2: Algebra Basics</h2><p>Algebra uses letters (variables) to represent unknown numbers.</p><div class="formula-box">Linear Equation: If 2x + 5 = 15, then 2x = 10, so x = 5.</div></div><div class="note-card"><h2>➗ Chapter 3: Fractions & Decimals</h2><p>To add or subtract unlike fractions, you must first find the LCM of the denominators.</p><div class="highlight-box"><strong>Example:</strong> 1/2 + 1/3 ➔ LCM of 2 and 3 is 6.<br>Convert: 3/6 + 2/6 = 5/6.</div></div>`,
            class7: `<div class="note-card"><h2>📊 Chapter 1: Comparing Quantities</h2><p>Mastering Ratios, Percentages, and Profit & Loss is essential for competitive exams.</p><div class="formula-box">Profit % = (Profit / Cost Price) × 100<br>Simple Interest (SI) = (P × R × T) / 100</div><div class="highlight-box"><strong>Example:</strong> Buy a book for $200 (CP), sell for $250 (SP). Profit = $50. Profit % = (50 / 200) × 100 = 25%.</div></div><div class="note-card"><h2>📐 Chapter 2: Lines & Angles</h2><p>Understanding angle relationships when a transversal cuts parallel lines.</p><ul><li><strong>Complementary Angles:</strong> Two angles that add up to 90°.</li><li><strong>Supplementary Angles:</strong> Two angles that add up to 180°.</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Triangles</h2><p>The Pythagoras theorem applies only to right-angled triangles.</p><div class="formula-box">Pythagoras Theorem: a² + b² = c² (where c is the hypotenuse)</div></div>`,
            class8: `<div class="note-card"><h2>✖️ Chapter 1: Algebraic Expressions & Identities</h2><p>Expanding expressions correctly saves time and prevents sign errors.</p><div class="formula-box">Standard Identities:<br>(a + b)² = a² + 2ab + b²<br>(a - b)² = a² - 2ab + b²<br>a² - b² = (a + b)(a - b)</div></div><div class="note-card"><h2>📉 Chapter 2: Exponents & Powers</h2><p>Laws of exponents simplify complex multiplication and division of large numbers.</p><div class="highlight-box"><strong>Key Laws:</strong><br>1. a^m × a^n = a^(m+n)<br>2. a^m ÷ a^n = a^(m-n)<br>3. (a^m)^n = a^(m×n)<br>4. a^0 = 1</div></div><div class="note-card"><h2>📐 Chapter 3: Mensuration</h2><p>Advanced area calculations for quadrilaterals.</p><div class="formula-box">Area of Trapezium = 1/2 × (Sum of parallel sides) × height<br>Area of Rhombus = 1/2 × d1 × d2 (diagonals)</div></div>`,
            class9: `<div class="note-card"><h2>🔢 Chapter 1: Polynomials & Factorization</h2><p>The Remainder Theorem allows you to find a remainder without performing long division.</p><div class="highlight-box"><strong>Remainder Theorem:</strong> If a polynomial p(x) is divided by (x - a), the remainder is simply p(a).</div><div class="formula-box">Important Cubic Identity:<br>(x + y + z)² = x² + y² + z² + 2xy + 2yz + 2zx</div></div><div class="note-card"><h2>📊 Chapter 2: Surface Areas & Volumes</h2><p>Memorizing 3D formulas is critical for this section.</p><ul><li><strong>Cylinder:</strong> CSA = 2πrh, Volume = πr²h</li><li><strong>Cone:</strong> CSA = πrl (where l is slant height), Volume = 1/3 πr²h</li><li><strong>Sphere:</strong> Surface Area = 4πr², Volume = 4/3 πr³</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Geometry (Triangles & Circles)</h2><p>Congruence rules (SAS, ASA, SSS, RHS) prove two triangles are identical in shape and size.</p></div>`,
            class10: `<div class="note-card"><h2>✖️ Chapter 1: Quadratic Equations</h2><p>Equations of the form ax² + bx + c = 0 can be solved using the quadratic formula.</p><div class="formula-box">Quadratic Formula: x = [-b ± √(b² - 4ac)] / 2a</div><div class="highlight-box"><strong>Discriminant (D = b² - 4ac):</strong><br>If D > 0, roots are real and distinct.<br>If D = 0, roots are real and equal.<br>If D < 0, roots are imaginary (no real roots).</div></div><div class="note-card"><h2>📐 Chapter 2: Trigonometry</h2><p>Trigonometry studies relationships between side lengths and angles of right triangles.</p><div class="formula-box">SOH CAH TOA:<br>Sin θ = Opposite / Hypotenuse<br>Cos θ = Adjacent / Hypotenuse<br>Tan θ = Opposite / Adjacent</div><div class="highlight-box"><strong>Fundamental Identity:</strong> sin²θ + cos²θ = 1</div></div><div class="note-card"><h2>📈 Chapter 3: Arithmetic Progressions (AP)</h2><p>An AP is a sequence where the difference between consecutive terms is constant (d).</p><div class="formula-box">nth Term (an) = a + (n - 1)d<br>Sum of n terms (Sn) = n/2 [2a + (n - 1)d]</div></div>`
        },
        science: {
            class1: `<div class="note-card"><h2>🌿 Chapter 1: Plant Life</h2><p>Plants are living things that stay in one place. They need sunlight, water, and air to grow.</p><ul><li><strong>Types of Plants:</strong> Big trees (Mango), small shrubs (Rose), herbs (Mint), climbers (Grapevine), creepers (Pumpkin).</li><li><strong>Parts of a Plant:</strong> Roots (drink water), stem (holds it up), leaves (make food), flowers (make seeds), fruits (protect seeds).</li></ul><div class="highlight-box">Fun Fact: Leaves are green because of a special substance called Chlorophyll, which helps them cook food using sunlight!</div></div><div class="note-card"><h2>🐾 Chapter 2: Animal World</h2><p>Animals live all around us. They can be wild (lions) or domestic (cows, dogs).</p><ul><li><strong>Animal Homes:</strong> A lion lives in a den, a bird builds a nest, bees make a hive, and rabbits burrow in the ground.</li></ul></div><div class="note-card"><h2>🧍 Chapter 3: Human Body & Senses</h2><p>Our body has 5 special helpers called Sense Organs.</p><div class="highlight-box">1. <strong>Eyes</strong> to see.<br>2. <strong>Ears</strong> to hear.<br>3. <strong>Nose</strong> to smell.<br>4. <strong>Tongue</strong> to taste.<br>5. <strong>Skin</strong> to feel (hot, cold, soft, hard).</div></div>`,
            class2: `<div class="note-card"><h2>🌿 Chapter 1: Uses of Plants</h2><p>Plants give us many important things we need to survive.</p><ul><li><strong>Food:</strong> We eat the roots of carrots, stems of sugarcane, leaves of spinach, and fruits of apple trees.</li><li><strong>Materials:</strong> Wood for furniture, cotton for clothes, and medicines from plants like Neem and Tulsi.</li></ul></div><div class="note-card"><h2>🌬️ Chapter 3: Air, Water & Weather</h2><p>Water is essential for life. It comes from rain, lakes, and rivers.</p><div class="highlight-box"><strong>The Water Cycle:</strong> The sun heats water, turning it into vapor (Evaporation). It goes up, cools down to form clouds (Condensation), and falls back as rain (Precipitation).</div></div><div class="note-card"><h2>🧍 Chapter 4: Bones & Muscles</h2><p>Inside our body is a hard frame called the Skeleton.</p><div class="highlight-box">The skeleton protects soft inner parts (like the brain and heart) and gives our body its shape. Muscles are attached to bones and help them move!</div></div>`,
            class3: `<div class="note-card"><h2>🦅 Chapter 1: Birds & Their Features</h2><p>Birds are the only animals with feathers. They have wings to fly and beaks to eat.</p><ul><li><strong>Beaks:</strong> A parrot has a curved beak to crack nuts. A woodpecker has a strong, chisel-like beak to drill wood. A duck has a broad, flat beak.</li><li><strong>Feet & Claws:</strong> Ducks have webbed feet to swim. Eagles have sharp claws (talons) to catch prey.</li></ul></div><div class="note-card"><h2>⚛️ Chapter 2: Matter & Materials</h2><p>Everything around us is Matter. Matter exists in three states.</p><div class="highlight-box"><strong>Solids:</strong> Have fixed shape and size (e.g., Ice, Wood).<br><strong>Liquids:</strong> Flow and take the shape of their container (e.g., Water, Milk).<br><strong>Gases:</strong> Spread out to fill any space (e.g., Steam, Air).</div></div><div class="note-card"><h2>🌍 Chapter 3: Earth & Universe</h2><p>The Earth moves in two ways in space.</p><div class="highlight-box"><strong>Rotation:</strong> Earth spinning like a top on its axis. This causes Day and Night and takes 24 hours.<br><strong>Revolution:</strong> Earth traveling in an orbit around the Sun. This causes Seasons and takes 1 year (365 days).</div></div>`,
            class4: `<div class="note-card"><h2>🍃 Chapter 1: Plant Adaptations & Photosynthesis</h2><p>Plants make their own food through a chemical process.</p><div class="formula-box">Carbon Dioxide + Water + Sunlight ➔ Glucose (Food) + Oxygen</div><div class="highlight-box"><strong>Adaptations:</strong> Cactus plants in the desert have thick stems to store water and spines instead of leaves to prevent water loss. Lotus plants have broad floating leaves.</div></div><div class="note-card"><h2>⚙️ Chapter 2: Force, Work & Energy</h2><p>A force is a push or a pull applied to an object.</p><ul><li><strong>Friction:</strong> A force that slows down moving objects when two surfaces rub together.</li><li><strong>Gravity:</strong> The invisible force that pulls everything down towards the center of the Earth.</li></ul><div class="highlight-box"><strong>Work:</strong> In science, "Work" is only done when a force actually moves an object over a distance! Pushing a wall that doesn't move equals zero work.</div></div>`,
            class5: `<div class="note-card"><h2>🧬 Chapter 1: Human Body Systems</h2><p>Our body is a complex machine with interconnected systems.</p><ul><li><strong>Skeletal System:</strong> The adult human skeleton has 206 bones. The longest bone is the femur (thigh bone).</li><li><strong>Nervous System:</strong> Includes the Brain, Spinal Cord, and Nerves. The brain acts as the control center, sending electrical signals to muscles.</li></ul></div><div class="note-card"><h2>🩺 Chapter 2: Health & Diseases</h2><p>A balanced diet is essential. Deficiencies in certain vitamins cause specific diseases.</p><div class="highlight-box"><strong>Deficiency Diseases:</strong><br>Lack of Vitamin A ➔ Night Blindness.<br>Lack of Vitamin C ➔ Scurvy (bleeding gums).<br>Lack of Vitamin D ➔ Rickets (weak bones).<br>Lack of Iron ➔ Anemia.</div></div><div class="note-card"><h2>🌋 Chapter 3: Natural Disasters</h2><p>Understanding natural phenomena caused by tectonic plate movements.</p><div class="highlight-box"><strong>Earthquakes:</strong> Sudden shaking of the ground. Measured using a Seismograph on the Richter scale.<br><strong>Tsunami:</strong> Giant ocean waves usually caused by underwater earthquakes.</div></div>`,
            class6: `<div class="note-card"><h2>🧪 Chapter 1: Food & Components</h2><p>Nutrients are chemical substances in food required for growth and survival.</p><ul><li><strong>Carbohydrates & Fats:</strong> Energy-giving foods.</li><li><strong>Proteins:</strong> Body-building foods, essential for growth and repair.</li><li><strong>Roughage (Dietary Fibre):</strong> Does not provide nutrients but helps in digestion and prevents constipation.</li></ul></div><div class="note-card"><h2>🔬 Chapter 2: Sorting & Separating Materials</h2><p>Methods to separate mixtures based on physical properties.</p><div class="highlight-box"><strong>Filtration:</strong> Separating insoluble solids from liquids (e.g., tea leaves from tea).<br><strong>Evaporation:</strong> Separating soluble solids from liquids by boiling (e.g., getting salt from seawater).<br><strong>Winnowing:</strong> Separating heavier grain from lighter husk using wind.</div></div><div class="note-card"><h2>⚡ Chapter 3: Physics - Light & Shadows</h2><p>Light travels in straight lines (Rectilinear propagation). Shadows are formed when an opaque object blocks light.</p><div class="highlight-box"><strong>Pinhole Camera:</strong> Demonstrates that light travels in straight lines. The image formed inside is always inverted (upside down).</div></div>`,
            class7: `<div class="note-card"><h2>🌿 Chapter 1: Nutrition in Organisms</h2><p>How living things obtain and utilize food.</p><ul><li><strong>Autotrophs:</strong> Produce their own food (Plants).</li><li><strong>Heterotrophs:</strong> Depend on others for food (Animals).</li><li><strong>Saprotrophs:</strong> Feed on dead and decaying matter (Fungi, Mushrooms).</li></ul><div class="highlight-box">In human digestion, the small intestine is where the maximum absorption of nutrients into the blood occurs, aided by finger-like projections called villi.</div></div><div class="note-card"><h2>🔥 Chapter 2: Heat & Acids/Bases</h2><p>Heat flows from a hotter object to a colder object.</p><div class="highlight-box"><strong>Conduction:</strong> Heat transfer in solids.<br><strong>Convection:</strong> Heat transfer in liquids and gases (warm air rises, cool air sinks).<br><strong>Radiation:</strong> Heat transfer without a medium (how Sun's heat reaches Earth).</div><p>Acids are sour (Lemon). Bases are bitter and soapy (Soap). An indicator like Litmus changes color (Acid turns blue litmus red).</p></div><div class="note-card"><h2>⚡ Chapter 3: Motion & Time</h2><p>Understanding basic physics of movement.</p><div class="formula-box">Speed = Distance / Time</div></div>`,
            class8: `<div class="note-card"><h2>🧬 Chapter 1: Cell Structure & Functions</h2><p>The cell is the basic structural and functional unit of life.</p><ul><li><strong>Nucleus:</strong> The control center of the cell containing genetic material (DNA).</li><li><strong>Mitochondria:</strong> The powerhouse of the cell, generating energy.</li><li><strong>Chloroplasts:</strong> Found only in plant cells, site of photosynthesis.</li></ul></div><div class="note-card"><h2>⚗️ Chapter 2: Metals & Non-Metals</h2><p>Understanding physical and chemical properties of elements.</p><div class="highlight-box"><strong>Metals:</strong> Malleable (can be beaten into sheets), Ductile (drawn into wires), good conductors of heat/electricity. Example: Copper, Iron.<br><strong>Non-Metals:</strong> Brittle, poor conductors. Example: Carbon, Sulphur.</div><div class="formula-box">Displacement Reaction: A more reactive metal displaces a less reactive metal from its salt solution.<br>Fe + CuSO4 ➔ FeSO4 + Cu</div></div><div class="note-card"><h2>🚀 Chapter 3: Force, Pressure & Sound</h2><p>Pressure is force acting on a unit area.</p><div class="formula-box">Pressure = Force / Area (Measured in Pascals)</div><p>Sound requires a material medium to travel (cannot travel in a vacuum). Pitch depends on frequency, while loudness depends on amplitude.</p></div>`,
            class9: `<div class="note-card"><h2>⚗️ Chapter 1: Matter & Atomic Structure</h2><p>Atoms are the indivisible building blocks of all matter.</p><ul><li><strong>Protons:</strong> Positively charged particles in the nucleus.</li><li><strong>Neutrons:</strong> Neutral particles in the nucleus.</li><li><strong>Electrons:</strong> Negatively charged particles revolving in shells around the nucleus.</li></ul><div class="highlight-box"><strong>Isotopes:</strong> Atoms of the same element having the same atomic number (protons) but different mass numbers (neutrons), like Carbon-12 and Carbon-14.</div></div><div class="note-card"><h2>🚀 Chapter 2: Motion & Force</h2><p>Newton's three laws of motion govern classical mechanics.</p><div class="highlight-box"><strong>1st Law (Inertia):</strong> An object remains at rest or in uniform motion unless acted upon by an external force.<br><strong>2nd Law:</strong> The rate of change of momentum is directly proportional to applied force.</div><div class="formula-box">Force (F) = mass (m) × acceleration (a)<br>Equations of Motion:<br>v = u + at<br>s = ut + 1/2 at²<br>v² = u² + 2as</div></div><div class="note-card"><h2>🌍 Chapter 3: Gravitation & Work</h2><p>Gravity is an attractive force between any two masses.</p><div class="formula-box">Universal Law: F = G * (m1*m2) / r²<br>Work Done (W) = Force (F) × Displacement (s)<br>Kinetic Energy = 1/2 mv²</div></div>`,
            class10: `<div class="note-card"><h2>⚗️ Chapter 1: Chemical Reactions</h2><p>Chemical equations must be balanced to satisfy the Law of Conservation of Mass.</p><div class="highlight-box"><strong>Types of Reactions:</strong><br>1. Combination: A + B ➔ AB<br>2. Decomposition: AB ➔ A + B<br>3. Displacement: A + BC ➔ AC + B<br>4. Redox: Oxidation (gain of oxygen/loss of electrons) and Reduction (loss of oxygen/gain of electrons) occur simultaneously.</div></div><div class="note-card"><h2>🧬 Chapter 2: Life Processes</h2><p>Nutrition, Respiration, Transportation, and Excretion.</p><div class="highlight-box"><strong>Aerobic Respiration:</strong> Uses oxygen to completely break down glucose into CO2, Water, and 38 ATP of energy.<br><strong>Anaerobic Respiration:</strong> Occurs without oxygen, leading to lactic acid (in muscles) or ethanol (in yeast), producing only 2 ATP.</div></div><div class="note-card"><h2>⚡ Chapter 3: Electricity & Optics</h2><p>Ohm's Law states that current flowing through a conductor is directly proportional to the potential difference across its ends, provided temperature remains constant.</p><div class="formula-box">Ohm's Law: V = I × R<br>Power: P = V × I<br>Mirror Formula: 1/f = 1/v + 1/u<br>Lens Formula: 1/f = 1/v - 1/u</div></div>`
        },
        english: {
            class1: `<div class="note-card"><h2>📝 Chapter 1: Nouns & Pronouns</h2><p>Nouns are naming words. Everything around us has a name!</p><ul><li><strong>Nouns:</strong> Boy, dog, school, apple.</li><li><strong>Pronouns:</strong> Words used in place of nouns. I, you, he, she, it, we, they.</li></ul><div class="highlight-box"><strong>Example:</strong> "Rahul is playing. <em>He</em> is happy." (Here, <em>He</em> replaces the noun <em>Rahul</em>).</div></div><div class="note-card"><h2>🏃 Chapter 2: Action Words (Verbs)</h2><p>Verbs show what someone or something is doing.</p><div class="highlight-box"><strong>Examples of Verbs:</strong> Run, jump, eat, sleep, cry, laugh. The dog <em>barks</em>.</div></div><div class="note-card"><h2>🔗 Chapter 3: Articles (A, An, The)</h2><p>Articles point out a noun.</p><div class="highlight-box">Use <strong>"An"</strong> before words starting with vowel sounds (A, E, I, O, U). Example: <em>An apple, an elephant</em>.<br>Use <strong>"A"</strong> before consonant sounds. Example: <em>A boy, a car</em>.</div></div>`,
            class2: `<div class="note-card"><h2>📝 Chapter 1: Common vs Proper Nouns</h2><p>Identifying the difference between general names and specific names.</p><div class="highlight-box"><strong>Common Noun:</strong> boy, city, festival, river. (Starts with a small letter).<br><strong>Proper Noun:</strong> Rahul, Delhi, Diwali, Ganges. (Always starts with a Capital letter!).</div></div><div class="note-card"><h2>🎨 Chapter 2: Adjectives</h2><p>Adjectives are describing words. They tell us more about a noun.</p><div class="highlight-box"><strong>Example:</strong> The <em>tall</em> man drove a <em>red</em> car.<br>(Tall describes the man, red describes the car).</div></div><div class="note-card"><h2>🔗 Chapter 3: Prepositions</h2><p>Prepositions show the position of a noun relative to another.</p><div class="highlight-box"><strong>Common Prepositions:</strong> In, on, under, behind, near, between.<br><em>The cat is hiding <strong>under</strong> the table.</em></div></div>`,
            class3: `<div class="note-card"><h2>📝 Chapter 1: Collective Nouns</h2><p>Words used to describe a group of people, animals, or things.</p><div class="highlight-box"><strong>Examples:</strong><br>A <em>flock</em> of birds.<br>A <em>herd</em> of sheep.<br>A <em>bunch</em> of keys.<br>An <em>army</em> of ants.</div></div><div class="note-card"><h2>⏳ Chapter 2: Simple Tenses</h2><p>Verbs change their spelling to show when an action happens.</p><div class="highlight-box"><strong>Present:</strong> I <em>play</em> daily.<br><strong>Past:</strong> I <em>played</em> yesterday.<br><strong>Future:</strong> I <em>will play</em> tomorrow.</div></div><div class="note-card"><h2>🗣️ Chapter 3: Synonyms & Antonyms</h2><p>Building vocabulary through similar and opposite meanings.</p><ul><li><strong>Synonyms (Same):</strong> Quick = Fast, Huge = Big, Glad = Happy.</li><li><strong>Antonyms (Opposites):</strong> Hot ≠ Cold, Heavy ≠ Light, Arrive ≠ Depart.</li></ul></div>`,
            class4: `<div class="note-card"><h2>📝 Chapter 1: Abstract Nouns</h2><p>Abstract nouns name feelings, ideas, or qualities that you cannot touch or see.</p><div class="highlight-box"><strong>Examples:</strong> Bravery, honesty, childhood, friendship, happiness. You can't put "bravery" in a box!</div></div><div class="note-card"><h2>🎨 Chapter 2: Degrees of Adjectives</h2><p>We use different forms of adjectives to compare things.</p><div class="highlight-box"><strong>Positive:</strong> Rahul is a <em>tall</em> boy.<br><strong>Comparative:</strong> Rahul is <em>taller</em> than Amit. (Usually ends in -er).<br><strong>Superlative:</strong> Rahul is the <em>tallest</em> boy in the class. (Usually ends in -est).</div></div><div class="note-card"><h2>🎭 Chapter 3: Idioms</h2><p>Idioms are phrases that mean something completely different from the literal words.</p><div class="highlight-box"><strong>"A piece of cake"</strong> ➔ Very easy.<br><strong>"Break a leg"</strong> ➔ Good luck.<br><strong>"Under the weather"</strong> ➔ Feeling sick.</div></div>`,
            class5: `<div class="note-card"><h2>📝 Chapter 1: Pronoun Types</h2><p>Different pronouns serve different functions in a sentence.</p><ul><li><strong>Demonstrative:</strong> Point out specific things (This, That, These, Those).</li><li><strong>Interrogative:</strong> Used to ask questions (Who, Whom, Whose, Which, What).</li></ul><div class="highlight-box"><strong>Trick:</strong> "Who" is used for subjects (Who did it?). "Whom" is used for objects (To whom did you give it?).</div></div><div class="note-card"><h2>⏳ Chapter 2: Perfect Tenses</h2><p>Perfect tenses describe actions that are already completed in relation to another time.</p><div class="highlight-box"><strong>Present Perfect:</strong> Has/Have + Past Participle. (<em>She has finished her work.</em>)<br><strong>Past Perfect:</strong> Had + Past Participle. (<em>The train had left before we arrived.</em>)</div></div><div class="note-card"><h2>🔗 Chapter 3: Conjunctions (Correlative)</h2><p>These conjunctions always travel in pairs.</p><div class="highlight-box"><strong>Pairs:</strong> Either...or, Neither...nor, Not only...but also.<br><em>Example:</em> You can have <strong>either</strong> tea <strong>or</strong> coffee.</div></div>`,
            class6: `<div class="note-card"><h2>📝 Chapter 1: Subject-Verb Agreement</h2><p>A verb must always agree with its subject in number (Singular/Plural).</p><div class="highlight-box"><strong>Trick - The 'Each/Every' Rule:</strong> Words like Each, Every, Either, Neither, Everyone are always singular!<br><strong>Incorrect:</strong> Every one of the students <em>are</em> present.<br><strong>Correct:</strong> Every one of the students <em>is</em> present.</div></div><div class="note-card"><h2>🗣️ Chapter 2: Voice (Active vs Passive)</h2><p>In Active voice, the subject DOES the action. In Passive, the subject RECEIVES the action.</p><div class="highlight-box"><strong>Active:</strong> The cat (Subject) chased the mouse.<br><strong>Passive:</strong> The mouse (Subject) was chased by the cat.<br><strong>Formula for Passive:</strong> Form of "to be" + Past Participle (was chased).</div></div><div class="note-card"><h2>🎭 Chapter 3: Phrasal Verbs</h2><p>A verb combined with a preposition that creates a completely new meaning.</p><div class="highlight-box"><strong>Look after:</strong> To take care of.<br><strong>Give up:</strong> To quit.<br><strong>Put off:</strong> To postpone.</div></div>`,
            class7: `<div class="note-card"><h2>📝 Chapter 1: Modals</h2><p>Modals are auxiliary verbs that express necessity, possibility, or permission.</p><ul><li><strong>Ability:</strong> Can, Could (<em>I can swim</em>).</li><li><strong>Permission:</strong> May, Can (<em>May I come in?</em>).</li><li><strong>Obligation:</strong> Must, Should, Ought to (<em>You must wear a helmet</em>).</li></ul></div><div class="note-card"><h2>🔗 Chapter 2: Clauses</h2><p>A clause is a group of words containing a subject and a verb.</p><div class="highlight-box"><strong>Independent Clause:</strong> Can stand alone as a sentence. (<em>I went to the store.</em>)<br><strong>Dependent Clause:</strong> Cannot stand alone. It relies on the main clause. (<em>Because we were out of milk.</em>)<br>Combined: I went to the store because we were out of milk.</div></div><div class="note-card"><h2>⏳ Chapter 3: Conditionals</h2><p>Sentences that state a condition and a hypothetical result.</p><div class="highlight-box"><strong>Zero Conditional (Facts):</strong> If you heat ice, it melts.<br><strong>First Conditional (Likely):</strong> If it rains, I will stay home.<br><strong>Second Conditional (Unlikely):</strong> If I won the lottery, I would buy a mansion.</div></div>`,
            class8: `<div class="note-card"><h2>📝 Chapter 1: Adverb Positioning</h2><p>Adverbs modify verbs, adjectives, or other adverbs. Their position changes meaning.</p><div class="highlight-box"><strong>Adverbs of Frequency (Always, never, often):</strong> Usually go before the main verb but after the 'to be' verb.<br><em>Correct:</em> I <strong>always</strong> arrive on time. He is <strong>always</strong> late.</div></div><div class="note-card"><h2>🗣️ Chapter 2: Direct to Indirect Speech</h2><p>When converting direct quotes into reported speech, three things change: Pronouns, Tense, and Time/Place words.</p><div class="highlight-box"><strong>Direct:</strong> He said, "I am playing now."<br><strong>Indirect:</strong> He said that he was playing then.<br>(I ➔ he), (am playing ➔ was playing), (now ➔ then).</div></div><div class="note-card"><h2>🎭 Chapter 3: Poetic Devices (Figures of Speech)</h2><p>Literary tools used to create imagery.</p><ul><li><strong>Simile:</strong> Comparing using 'like' or 'as' (As brave as a lion).</li><li><strong>Metaphor:</strong> Direct comparison without 'like' or 'as' (Time is money).</li><li><strong>Personification:</strong> Giving human traits to non-living things (The wind howled).</li></ul></div>`,
            class9: `<div class="note-card"><h2>📝 Chapter 1: Integrated Grammar & Gap Filling</h2><p>In high-level cloze tests, focus on context clues to select the correct tense or determiner.</p><div class="highlight-box"><strong>Preposition Traps:</strong> Certain verbs take fixed prepositions.<br><em>Accused <strong>of</strong></em> (Not 'for')<br><em>Congratulate <strong>on</strong></em> (Not 'for')<br><em>Prefer tea <strong>to</strong> coffee</em> (Not 'than')</div></div><div class="note-card"><h2>🔗 Chapter 2: Relative Clauses</h2><p>Relative clauses begin with relative pronouns (who, whom, whose, which, that).</p><div class="highlight-box"><strong>Defining vs Non-Defining:</strong><br>Defining (No commas): The man <em>who stole the car</em> was caught. (Essential info).<br>Non-Defining (Commas): My father, <em>who is 50</em>, loves tennis. (Extra, non-essential info).</div></div><div class="note-card"><h2>📚 Chapter 3: Advanced Comprehension</h2><p>For discursive and factual passages, master the art of Skimming (reading for general idea) and Scanning (searching for specific keywords).</p></div>`,
            class10: `<div class="note-card"><h2>📝 Chapter 1: Advanced Subject-Verb Concord</h2><p>Mastering the tricky exceptions to subject-verb agreement for competitive exams.</p><div class="highlight-box"><strong>The "As well as / Along with" Rule:</strong> When subjects are joined by these phrases, the verb follows the FIRST subject.<br><em>The captain, along with his team, <strong>is</strong> practicing.</em> (Matches 'captain', not 'team').</div></div><div class="note-card"><h2>🗣️ Chapter 2: Non-Finite Verbs</h2><p>Verbs that do not show tense, person, or number.</p><ul><li><strong>Infinitives:</strong> To + Base Verb (<em>I want <strong>to swim</strong></em>).</li><li><strong>Gerunds:</strong> Verb + ing acting as a noun (<em><strong>Swimming</strong> is good exercise</em>).</li><li><strong>Participles:</strong> Verb forms acting as adjectives (<em>The <strong>crying</strong> baby</em>).</li></ul></div><div class="note-card"><h2>🔗 Chapter 3: Sentence Transformation (Synthesis)</h2><p>Transforming complex syntax without changing meaning.</p><div class="highlight-box"><strong>Using "Too...to":</strong><br><em>Original:</em> He is so weak that he cannot walk.<br><em>Transformed:</em> He is <strong>too</strong> weak <strong>to</strong> walk.</div></div>`
        },
        reasoning: {
            class1: `<div class="note-card"><h2>🎨 Chapter 1: Visual Patterns</h2><p>Reasoning is all about finding rules and patterns in the world around us.</p><div class="highlight-box"><strong>Example:</strong> Look at the shapes: ⭕ ⬛ ⭕ ⬛ ⭕ ?<br>The rule is repeating Circle, then Square. So the next shape is a Square (⬛).</div></div><div class="note-card"><h2>🤔 Chapter 2: Odd One Out</h2><p>Grouping items that share a common feature and finding the one that doesn't fit.</p><div class="highlight-box"><strong>Find the odd one out:</strong> Apple, Banana, Potato, Orange.<br><em>Answer:</em> Potato. The rule is "Fruits". Potato is a vegetable, so it is the odd one out.</div></div><div class="note-card"><h2>🧩 Chapter 3: Analogy</h2><p>Analogy means finding the relationship between pairs.</p><div class="highlight-box"><strong>Example:</strong> Bird is to Fly as Fish is to ?<br><em>Answer:</em> Swim. (The relationship is the mode of movement).</div></div>`,
            class2: `<div class="note-card"><h2>🔢 Chapter 1: Number & Alphabet Series</h2><p>Finding the hidden mathematical or alphabetical rule to complete a sequence.</p><div class="highlight-box"><strong>Number Series:</strong> 2, 4, 6, 8, ?<br><em>Rule:</em> Adding 2 each time. Next number = 10.<br><strong>Alphabet Series:</strong> A, C, E, G, ?<br><em>Rule:</em> Skipping one letter. Next letter = I.</div></div><div class="note-card"><h2>🗺️ Chapter 2: Spatial & Mirror Understanding</h2><p>Visualizing how shapes look when moved or reflected.</p><div class="highlight-box"><strong>Mirror Image Trick:</strong> In a mirror, the Left side becomes the Right side, and Right becomes Left. Top and bottom remain the same. (e.g., 'b' looks like 'd' in a mirror).</div></div><div class="note-card"><h2>🔠 Chapter 3: Coding-Decoding</h2><p>Translating secret messages using substitution rules.</p><div class="highlight-box"><strong>Example:</strong> If CAT is written as DOG, how is BOY written?<br><em>Rule:</em> No logical rule here, just direct substitution! If the code says +1 letter (A➔B, B➔C), then CAT (+1) = DBU.</div></div>`,
            class3: `<div class="note-card"><h2>🖼️ Chapter 1: Figure Matrix</h2><p>A matrix is a grid of shapes with a horizontal and vertical visual rule.</p><div class="highlight-box"><strong>Trick:</strong> Look row by row. Is the shape rotating? Is a line being added? Or is the third shape a combination of the first two? Find the rule and apply it to the missing box.</div></div><div class="note-card"><h2>📆 Chapter 2: Days & Dates</h2><p>Basic calendar reasoning requires knowing days in a month and leap years.</p><div class="highlight-box"><strong>Trick:</strong> A normal year has 365 days, a leap year has 366. If today is Monday, what day is it after 15 days?<br>15 ÷ 7 (days in week) = 2 weeks and 1 odd day. Monday + 1 day = Tuesday!</div></div><div class="note-card"><h2>🔠 Chapter 3: Alphabet Test</h2><p>Arranging words exactly as they appear in a standard English Dictionary.</p><div class="highlight-box"><strong>Example:</strong> Arrange: 1. Apple, 2. Ape, 3. Ant.<br><em>Order:</em> Ant (An-), Ape (Ap-e), Apple (Ap-p).</div></div>`,
            class4: `<div class="note-card"><h2>🧭 Chapter 1: Direction Sense</h2><p>Map reading logic using cardinal directions.</p><div class="highlight-box"><strong>The NESW Rule:</strong> Always draw a plus sign on your rough sheet. Label the top North, bottom South, right East, left West. If a person faces North and turns Right, they now face East.</div></div><div class="note-card"><h2>🔢 Chapter 2: Ranking Test</h2><p>Finding a person's exact position in a line or queue.</p><div class="formula-box">Total people = (Position from Left + Position from Right) - 1</div><div class="highlight-box"><strong>Example:</strong> Rahul is 5th from the left and 6th from the right. Total = (5 + 6) - 1 = 10 people in the line.</div></div><div class="note-card"><h2>🖼️ Chapter 3: Water Images</h2><p>Water images are reflections seen in a horizontal pool of water.</p><div class="highlight-box"><strong>Rule:</strong> Top becomes Bottom, Bottom becomes Top. Left and Right remain unchanged. (e.g., 'M' becomes 'W').</div></div>`,
            class5: `<div class="note-card"><h2>🧩 Chapter 1: Logical Venn Diagrams</h2><p>Using overlapping circles to represent relationships between groups.</p><div class="highlight-box"><strong>Example:</strong> Group 1 (Animals), Group 2 (Dogs), Group 3 (Cats).<br><em>Diagram:</em> Draw one large circle for Animals. Inside it, draw two smaller separate circles for Dogs and Cats (since a dog cannot be a cat, they do not overlap).</div></div><div class="note-card"><h2>🩸 Chapter 2: Blood Relations</h2><p>Tracing family trees to find relationships.</p><div class="highlight-box"><strong>Drawing Trick:</strong> Use (+) for Males, (-) for Females. Use a horizontal line (—) for siblings, an equals sign (=) for married couples, and a vertical line (|) for parent-child generation gaps.</div></div><div class="note-card"><h2>🔢 Chapter 3: Mathematical Reasoning</h2><p>Substituting signs in equations based on given rules.</p><div class="highlight-box"><strong>Example:</strong> If '+' means '×' and '-' means '+', solve: 4 + 2 - 3.<br><em>Substitute:</em> 4 × 2 + 3.<br><em>BODMAS:</em> 8 + 3 = 11.</div></div>`,
            class6: `<div class="note-card"><h2>🎨 Chapter 1: Advanced Number Series</h2><p>Multi-layered series that require finding differences of differences.</p><div class="highlight-box"><strong>Double Difference Trick:</strong> If a series is 2, 5, 11, 20, 32... calculate the difference between terms: 3, 6, 9, 12. Since the differences form a table of 3, the next difference is 15. The next term is 32 + 15 = 47.</div></div><div class="note-card"><h2>🧭 Chapter 2: Advanced Direction Sense</h2><p>Using the Pythagoras theorem to find the shortest distance.</p><div class="highlight-box"><strong>Example:</strong> A man walks 3 km East, then 4 km North. How far is he from the start?<br>Draw the triangle. Base = 3, Height = 4. Distance = √(3² + 4²) = √(9 + 16) = √25 = 5 km.</div></div><div class="note-card"><h2>🤔 Chapter 3: Syllogism Basics</h2><p>Drawing logical conclusions from stated premises.</p><div class="highlight-box"><strong>Premises:</strong> All A are B. Some B are C.<br><strong>Venn Diagram:</strong> Draw circle A entirely inside circle B. Draw circle C overlapping only the edge of circle B.<br><strong>Conclusion:</strong> We cannot say for sure if A overlaps with C, so "Some A are C" is a false conclusion!</div></div>`,
            class7: `<div class="note-card"><h2>🔠 Chapter 1: Coding-Decoding (Matrix & Substitution)</h2><p>Decoding sentences where entire words are substituted.</p><div class="highlight-box"><strong>Example:</strong> If "Sky is Blue" = "Blue is Water" = "Water is Sand". What is the color of the clear sky?<br><em>Logic:</em> The sky is Blue. But in this code language, "Blue" is called "Water". Therefore, the answer is "Water".</div></div><div class="note-card"><h2>🧩 Chapter 2: Sitting Arrangement</h2><p>Solving linear and circular seating puzzles.</p><div class="highlight-box"><strong>Circular Trick:</strong> If people are "facing the center", their Left is clockwise, and their Right is anti-clockwise. If they are "facing outside", Left is anti-clockwise, and Right is clockwise! Always start by placing the most definite clue first.</div></div><div class="note-card"><h2>🖼️ Chapter 3: Dot Situation</h2><p>A complex non-verbal reasoning task involving intersecting shapes.</p><div class="highlight-box"><strong>Goal:</strong> Find the option where a dot can be placed in the exact same intersecting regions (e.g., inside the circle and triangle, but outside the square) as shown in the question figure. Focus purely on overlapping boundaries.</div></div>`,
            class8: `<div class="note-card"><h2>📊 Chapter 1: Data Sufficiency</h2><p>Determining if given statements possess enough information to answer a question, without actually solving it.</p><div class="highlight-box"><strong>Strategy:</strong><br>Check Statement 1 alone. Is it enough?<br>Check Statement 2 alone. Is it enough?<br>If neither is enough alone, combine 1 + 2. If it's still not enough, the data is insufficient.</div></div><div class="note-card"><h2>🧩 Chapter 2: Complex Puzzles</h2><p>Solving multi-variable grid puzzles (e.g., 5 friends, 5 cars, 5 colors).</p><div class="highlight-box"><strong>Grid Method:</strong> Draw a table with names on the Y-axis and variables (cars/colors) on the X-axis. Put a (✓) for definite true clues and an (X) for definite false clues. Use the process of elimination to fill the rest of the grid.</div></div><div class="note-card"><h2>🖼️ Chapter 3: Cubes & Dice</h2><p>Visualizing folded 3D dice from flat 2D paper nets.</p><div class="highlight-box"><strong>Alternate Face Rule:</strong> In a flat un-folded dice (net), faces that are in a straight line and separated by one square are ALWAYS opposite each other when folded. Opposite faces can never be seen together in a 3D view.</div></div>`,
            class9: `<div class="note-card"><h2>🧠 Chapter 1: Statements & Assumptions</h2><p>Identifying implicit, hidden assumptions behind an author's statement.</p><div class="highlight-box"><strong>Rule:</strong> An assumption is something the author takes for granted. If a notice says, "Do not lean out of the moving train", the hidden assumption is that "Leaning out of a moving train is dangerous" and "Passengers can read the notice".</div></div><div class="note-card"><h2>🔢 Chapter 2: Coded Inequalities</h2><p>Replacing symbols with mathematical inequalities (>, <, =, ≥, ≤).</p><div class="highlight-box"><strong>Example:</strong> A $ B means A is not smaller than B (so A ≥ B). Create a quick decoding table for all symbols before attempting the questions to save time. Chain the inequalities: A ≥ B > C = D to easily see relationships (A > D).</div></div><div class="note-card"><h2>🖼️ Chapter 3: Complex Paper Folding</h2><p>Predicting the hole pattern when a folded piece of paper is cut and unfolded.</p><div class="highlight-box"><strong>Symmetry Trick:</strong> Treat every fold line as a mirror. Work backward from the final cut, drawing the mirror image of the cut across each fold line until the paper is completely "unfolded" on your rough sheet.</div></div>`,
            class10: `<div class="note-card"><h2>🧠 Chapter 1: Advanced Critical Thinking</h2><p>Evaluating assertions and reasons for logical and factual accuracy.</p><div class="highlight-box"><strong>Assertion (A) & Reason (R):</strong> First, check if A is a true fact. Then, check if R is a true fact. Finally, read them together using the word "because". If it makes logical sense, R is the correct explanation of A.</div></div><div class="note-card"><h2>🧩 Chapter 2: Sequential Output Tracing</h2><p>Also known as Machine Input-Output. Analyzing how an algorithm rearranges words and numbers step-by-step.</p><div class="highlight-box"><strong>Strategy:</strong> Look at the raw Input, then immediately jump to the FINAL step. Figure out the final arrangement (e.g., words in alphabetical order, numbers in descending order). Then check Step 1 to see how elements are moved (one at a time from the left, or swapping ends).</div></div><div class="note-card"><h2>🖼️ Chapter 3: Painted Cubes Cutting</h2><p>A large solid cube is painted on all sides, then cut into smaller equal cubes. Calculate how many small cubes have paint on them.</p><div class="formula-box">For an n × n × n cube:<br>3 faces painted (Corners) = Always 8<br>2 faces painted (Edges) = 12 × (n - 2)<br>1 face painted (Centers) = 6 × (n - 2)²<br>0 faces painted (Inner) = (n - 2)³</div></div>`
