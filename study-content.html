<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --subtle: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --brand: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); 
            border-bottom:1px solid var(--border); padding:20px 5%; 
            display:flex; align-items:center; justify-content:space-between; 
            position:sticky; top:0; z-index:1000;
        }
        .brand { font-size:1.5rem; font-weight:800; color:var(--text); text-decoration:none; }
        .nav-links { display:flex; gap:12px; }
        .nav-links a { color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; transition:0.3s; }
        .nav-links a:hover { color:var(--brand); }

        .container { width: 100%; max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; }

        .header-section { margin-bottom: 40px; }
        .breadcrumb { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; }
        .breadcrumb a { color: var(--brand); text-decoration: none; }
        
        h1 { font-size: 2.5rem; font-weight: 800; color: var(--text); margin-bottom: 15px; }
        h1 span { color: var(--brand); text-transform: capitalize; }

        .note-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-top: 5px solid var(--brand);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .note-card h2 { color: var(--brand); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .note-card h3 { color: var(--text); font-size: 1.3rem; margin-top: 30px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .note-card p { color: var(--muted); font-size: 1rem; line-height: 1.8; margin-bottom: 15px; }
        
        .note-card ul { padding-left: 20px; margin-bottom: 20px; color: var(--muted); }
        .note-card li { margin-bottom: 10px; line-height: 1.6; }
        .note-card strong { color: var(--text); font-weight: 700; }

        .highlight-box {
            background: var(--subtle);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            color: var(--text);
        }

        .formula-box {
            background: var(--bg);
            padding: 15px 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            color: var(--brand);
            margin: 10px 0;
            border: 1px dashed var(--border);
        }

        .action-area { text-align: center; margin-top: 50px; }
        .btn-practice {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
            display: inline-block;
        }
        .btn-practice:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }

        @media (max-width: 768px) {
            .note-card { padding: 25px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>

    // --- CONTENT DATABASE ---
    const studyDB = {
        maths: {
            class1: `<div class="note-card"><h2>🔢 Chapter 1: Number Sense</h2><ul><li><strong>Counting:</strong> Forward and backward counting up to 100.</li><li><strong>Comparing:</strong> Greater than (&gt;), Less than (&lt;), Equal to (=).</li><li><strong>Place Value:</strong> Introduction to Tens and Ones.</li></ul></div><div class="note-card"><h2>➕ Chapter 2: Addition & Subtraction</h2><ul><li><strong>Addition:</strong> Adding 1-digit and 2-digit numbers, sum up to 100.</li><li><strong>Subtraction:</strong> Taking away concepts, subtracting 1-digit from 2-digit numbers.</li><li><strong>Word Problems:</strong> Simple real-life scenarios.</li></ul></div><div class="note-card"><h2>📏 Chapter 3: Measurement & Time</h2><ul><li><strong>Measurement:</strong> Longer/shorter, heavier/lighter, taller/shorter.</li><li><strong>Time:</strong> Reading time in hours, days of the week, months of the year.</li></ul></div><div class="note-card"><h2>📐 Chapter 4: Geometry & Patterns</h2><ul><li><strong>Shapes:</strong> Squares, circles, triangles, rectangles.</li><li><strong>Patterns:</strong> Recognizing and completing shape and number patterns.</li></ul></div>`,
            class2: `<div class="note-card"><h2>🔢 Chapter 1: Numbers up to 1000</h2><ul><li><strong>Place Value:</strong> Hundreds, Tens, and Ones.</li><li><strong>Comparing & Ordering:</strong> Ascending and descending order.</li><li><strong>Odd & Even:</strong> Identifying odd and even numbers.</li></ul></div><div class="note-card"><h2>✖️ Chapter 2: Arithmetic Operations</h2><ul><li><strong>Addition & Subtraction:</strong> With and without regrouping (carry/borrow).</li><li><strong>Multiplication:</strong> Repeated addition, multiplication tables up to 10.</li><li><strong>Division:</strong> Introduction to equal grouping and sharing.</li></ul></div><div class="note-card"><h2>⏰ Chapter 3: Time & Money</h2><ul><li><strong>Time:</strong> Reading clock (half-past, quarter-past), calendars.</li><li><strong>Money:</strong> Identifying coins and notes, simple addition of money.</li></ul></div><div class="note-card"><h2>📐 Chapter 4: Lines & Shapes</h2><ul><li><strong>Lines:</strong> Straight, curved, standing, and sleeping lines.</li><li><strong>Solids:</strong> Cube, cuboid, sphere, cylinder, cone properties.</li></ul></div>`,
            class3: `<div class="note-card"><h2>🔢 Chapter 1: 4-Digit Numbers</h2><ul><li><strong>Place Value:</strong> Thousands, Hundreds, Tens, Ones.</li><li><strong>Rounding:</strong> Rounding off to nearest 10 and 100.</li><li><strong>Roman Numerals:</strong> Introduction up to XXXIX (39).</li></ul></div><div class="note-card"><h2>➗ Chapter 2: Multiplication & Division</h2><ul><li><strong>Multiplication:</strong> 2-digit by 1-digit and 2-digit by 2-digit.</li><li><strong>Division:</strong> Division with remainder, checking division.</li><li><strong>Word Problems:</strong> Mixed operations in real life.</li></ul></div><div class="note-card"><h2>🍰 Chapter 3: Fractions</h2><ul><li><strong>Concepts:</strong> Numerator, Denominator, half, one-third, one-fourth.</li><li><strong>Visual Fractions:</strong> Shading parts of a whole and collections.</li></ul></div><div class="note-card"><h2>📊 Chapter 4: Data Handling & Geometry</h2><ul><li><strong>Data:</strong> Reading pictographs and simple bar graphs.</li><li><strong>Geometry:</strong> Point, line segment, ray, symmetry, simple 2D shapes.</li></ul></div>`,
            class4: `<div class="note-card"><h2>🔢 Chapter 1: Large Numbers</h2><ul><li><strong>System:</strong> Indian and International number systems up to millions/crores.</li><li><strong>Roman Numerals:</strong> Extended rules and numbers up to C (100) or D (500).</li></ul></div><div class="note-card"><h2>➗ Chapter 2: Factors & Multiples</h2><ul><li><strong>Concepts:</strong> Prime and composite numbers.</li><li><strong>LCM & HCF:</strong> Finding least common multiple and highest common factor.</li><li><strong>Divisibility Rules:</strong> For 2, 3, 5, 9, 10.</li></ul></div><div class="note-card"><h2>🍰 Chapter 3: Fractions & Decimals</h2><ul><li><strong>Fractions:</strong> Equivalent, like/unlike fractions, addition & subtraction.</li><li><strong>Decimals:</strong> Introduction to tenths and hundredths, basic addition.</li></ul></div><div class="note-card"><h2>📐 Chapter 4: Perimeter & Area</h2><ul><li><strong>Formulas:</strong> Perimeter and Area of rectangles and squares.</li><li><strong>Geometry:</strong> Types of angles, circle parts (radius, diameter, chord).</li></ul></div>`,
            class5: `<div class="note-card"><h2>🔢 Chapter 1: Advanced Arithmetic</h2><ul><li><strong>Operations:</strong> Large number addition, subtraction, multiplication, division.</li><li><strong>BODMAS:</strong> Order of operations rule application.</li><li><strong>Percentage:</strong> Basic concept of percentage (per hundred).</li></ul></div><div class="note-card"><h2>🍰 Chapter 2: Decimals & Fractions</h2><ul><li><strong>Fractions:</strong> Multiplication and division of fractions.</li><li><strong>Decimals:</strong> Multiplication/division of decimals, conversion to fractions.</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Geometry & Angles</h2><ul><li><strong>Angles:</strong> Measuring with protractor, acute, obtuse, right, straight, reflex.</li><li><strong>Triangles:</strong> Classification by sides and angles.</li></ul></div><div class="note-card"><h2>📦 Chapter 4: Volume & Area</h2><ul><li><strong>Volume:</strong> Finding volume of cubes and cuboids.</li><li><strong>Area:</strong> Area of complex rectilinear figures.</li></ul></div>`,
            class6: `<div class="note-card"><h2>🔢 Chapter 1: Knowing Our Numbers</h2><ul><li><strong>Estimation:</strong> Rounding off to nearest 10, 100, 1000.</li><li><strong>Whole Numbers:</strong> Properties of whole numbers, number line.</li><li><strong>Integers:</strong> Introduction to negative numbers, addition/subtraction on number line.</li></ul></div><div class="note-card"><h2>➗ Chapter 2: Fractions & Decimals</h2><ul><li><strong>Fractions:</strong> Proper, improper, mixed fractions, operations.</li><li><strong>Decimals:</strong> Place value, comparison, addition and subtraction.</li></ul></div><div class="note-card"><h2>✖️ Chapter 3: Algebra Basics</h2><ul><li><strong>Variables:</strong> Introduction to variables using matchstick patterns.</li><li><strong>Expressions:</strong> Forming simple algebraic expressions.</li><li><strong>Equations:</strong> Solving basic linear equations.</li></ul></div><div class="note-card"><h2>📐 Chapter 4: Mensuration & Geometry</h2><ul><li><strong>Geometry:</strong> Basic geometrical ideas (curves, polygons, 3D shapes).</li><li><strong>Mensuration:</strong> Perimeter and area of rectangles and squares.</li></ul></div>`,
            class7: `<div class="note-card"><h2>🔢 Chapter 1: Integers & Rational Numbers</h2><ul><li><strong>Integers:</strong> Multiplication and division rules.</li><li><strong>Rational Numbers:</strong> Positive/negative, standard form, operations.</li></ul></div><div class="note-card"><h2>✖️ Chapter 2: Simple Equations</h2><ul><li><strong>Solving:</strong> Transposing method, balancing equations.</li><li><strong>Applications:</strong> Solving real-life word problems using equations.</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Lines, Angles & Triangles</h2><ul><li><strong>Lines & Angles:</strong> Complementary, supplementary, adjacent, vertically opposite, transversal.</li><li><strong>Triangles:</strong> Exterior angle property, angle sum property, Pythagoras theorem.</li></ul></div><div class="note-card"><h2>📊 Chapter 4: Comparing Quantities</h2><ul><li><strong>Ratios & Percentages:</strong> Finding percentage, converting ratio to percentage.</li><li><strong>Profit & Loss:</strong> Cost price, selling price, profit/loss percentage.</li><li><strong>Simple Interest:</strong> Formula: (P × R × T) / 100.</li></ul></div>`,
            class8: `<div class="note-card"><h2>✖️ Chapter 1: Linear Equations & Expressions</h2><ul><li><strong>Equations:</strong> Solving equations having variables on both sides.</li><li><strong>Expressions:</strong> Addition, subtraction, and multiplication of algebraic expressions.</li><li><strong>Identities:</strong> (a+b)², (a-b)², a²-b², (x+a)(x+b).</li></ul></div><div class="note-card"><h2>🔢 Chapter 2: Squares, Cubes & Exponents</h2><ul><li><strong>Squares & Roots:</strong> Finding square roots by division method.</li><li><strong>Cubes & Roots:</strong> Prime factorization method for cube roots.</li><li><strong>Exponents:</strong> Laws of exponents with integral powers, standard form.</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Understanding Quadrilaterals</h2><ul><li><strong>Polygons:</strong> Convex, concave, regular, irregular. Angle sum property of polygons.</li><li><strong>Quadrilaterals:</strong> Parallelogram, rhombus, rectangle, square, kite, trapezium properties.</li></ul></div><div class="note-card"><h2>📊 Chapter 4: Mensuration & Data Handling</h2><ul><li><strong>Mensuration:</strong> Area of trapezium, general quadrilaterals, surface area and volume of cube, cuboid, cylinder.</li><li><strong>Data Handling:</strong> Pie charts, probability basics.</li></ul></div>`,
            class9: `<div class="note-card"><h2>🔢 Chapter 1: Number Systems & Polynomials</h2><ul><li><strong>Number Systems:</strong> Rational/irrational numbers, rationalization of denominator, laws of exponents for real numbers.</li><li><strong>Polynomials:</strong> Remainder and Factor theorems, factorization of cubic polynomials, algebraic identities.</li></ul></div><div class="note-card"><h2>📐 Chapter 2: Geometry (Lines & Triangles)</h2><ul><li><strong>Lines & Angles:</strong> Parallel lines and transversal, angle sum property of a triangle.</li><li><strong>Triangles:</strong> Congruence rules (SAS, ASA, SSS, RHS), inequalities in a triangle.</li></ul></div><div class="note-card"><h2>📦 Chapter 3: Quadrilaterals & Circles</h2><ul><li><strong>Quadrilaterals:</strong> Mid-point theorem, properties of a parallelogram.</li><li><strong>Circles:</strong> Equal chords and their distances from the centre, angle subtended by an arc, cyclic quadrilaterals.</li></ul></div><div class="note-card"><h2>📊 Chapter 4: Surface Areas & Volumes</h2><ul><li><strong>3D Shapes:</strong> Surface area and volume of a sphere, hemisphere, right circular cone, and cylinder.</li><li><strong>Statistics & Probability:</strong> Presentation of data (bar graphs, histograms, frequency polygons), empirical probability.</li></ul></div>`,
            class10: `<div class="note-card"><h2>🔢 Chapter 1: Real Numbers & Polynomials</h2><ul><li><strong>Real Numbers:</strong> Fundamental Theorem of Arithmetic, proof of irrationality (e.g., √2).</li><li><strong>Polynomials:</strong> Relationship between zeroes and coefficients of quadratic polynomials.</li></ul></div><div class="note-card"><h2>✖️ Chapter 2: Equations & Progressions</h2><ul><li><strong>Linear Equations:</strong> Pair of linear equations in two variables, graphical and algebraic methods (substitution, elimination).</li><li><strong>Quadratic Equations:</strong> Solving by factorization and quadratic formula, nature of roots.</li><li><strong>Arithmetic Progressions:</strong> nth term and sum of first n terms of an AP.</li></ul></div><div class="note-card"><h2>📐 Chapter 3: Triangles & Trigonometry</h2><ul><li><strong>Triangles:</strong> Similarity of triangles, Basic Proportionality Theorem (BPT), Pythagoras theorem proofs/applications.</li><li><strong>Trigonometry:</strong> Trigonometric ratios of specific angles, trigonometric identities (sin²θ + cos²θ = 1), Heights and Distances.</li></ul></div><div class="note-card"><h2>📦 Chapter 4: Circles, Areas & Volumes</h2><ul><li><strong>Circles:</strong> Tangent to a circle, length of tangents from an external point.</li><li><strong>Areas Related to Circles:</strong> Area of sectors and segments.</li><li><strong>Surface Areas & Volumes:</strong> Combinations of solids, conversion of solid from one shape to another.</li></ul></div>`
        },
        science: {
            class1: `<div class="note-card"><h2>🌿 Chapter 1: Plant Life</h2><ul><li><strong>Types of Plants:</strong> Big trees, small shrubs, herbs, climbers, creepers.</li><li><strong>Parts of a Plant:</strong> Roots, stem, leaves, flowers, fruits.</li></ul></div><div class="note-card"><h2>🐾 Chapter 2: Animal World</h2><ul><li><strong>Categories:</strong> Wild, domestic, and pet animals.</li><li><strong>Animal Homes:</strong> Dens, nests, hives, burrows.</li><li><strong>Young Ones:</strong> Cow-calf, dog-puppy, cat-kitten.</li></ul></div><div class="note-card"><h2>🧍 Chapter 3: Human Body & Senses</h2><ul><li><strong>Body Parts:</strong> Head, hands, legs, chest.</li><li><strong>Sense Organs:</strong> Eyes (sight), Ears (hearing), Nose (smell), Tongue (taste), Skin (touch).</li></ul></div><div class="note-card"><h2>🌍 Chapter 4: Our Surroundings</h2><ul><li><strong>Living vs Non-Living:</strong> Differentiating things that breathe and grow from things that don't.</li><li><strong>Good Habits:</strong> Keeping surroundings clean, personal hygiene.</li></ul></div>`,
            class2: `<div class="note-card"><h2>🌿 Chapter 1: Uses of Plants</h2><ul><li><strong>Food:</strong> Fruits, vegetables, pulses, cereals from plants.</li><li><strong>Other Uses:</strong> Wood, medicine, cotton, perfumes, paper.</li></ul></div><div class="note-card"><h2>🐾 Chapter 2: Animal Life & Food Habits</h2><ul><li><strong>Food Habits:</strong> Plant-eaters (herbivores), flesh-eaters (carnivores).</li><li><strong>Usefulness:</strong> Milk from cows, wool from sheep, eggs from hens.</li></ul></div><div class="note-card"><h2>🌬️ Chapter 3: Air, Water & Weather</h2><ul><li><strong>Air:</strong> Moving air is wind. Air has weight and takes up space.</li><li><strong>Water:</strong> Sources of water, water cycle basics.</li><li><strong>Weather:</strong> Sunny, rainy, cloudy, windy days. Seasons.</li></ul></div><div class="note-card"><h2>🧍 Chapter 4: Bones & Muscles</h2><ul><li><strong>Framework:</strong> The skeleton gives shape to the body.</li><li><strong>Muscles:</strong> Help bones move. Importance of exercise and posture.</li></ul></div>`,
            class3: `<div class="note-card"><h2>🌿 Chapter 1: Parts of a Plant</h2><ul><li><strong>Root System:</strong> Taproot vs fibrous root. Functions of roots.</li><li><strong>Shoot System:</strong> Stem, leaves (chlorophyll, photosynthesis basics), flowers, fruits, seeds.</li></ul></div><div class="note-card"><h2>🦅 Chapter 2: Birds & Their Features</h2><ul><li><strong>Beaks:</strong> Types of beaks (curved, short, broad) based on eating habits.</li><li><strong>Feet & Claws:</strong> Webbed feet, perching claws, scratching claws.</li><li><strong>Nests:</strong> Different nesting habits of weaver birds, tailorbirds, woodpeckers.</li></ul></div><div class="note-card"><h2>🧍 Chapter 3: Human Body Systems</h2><ul><li><strong>Organs:</strong> Internal vs external organs.</li><li><strong>Systems:</strong> Respiratory system (breathing), Digestive system (breaking down food).</li></ul></div><div class="note-card"><h2>🌍 Chapter 4: Earth & Universe</h2><ul><li><strong>Solar System:</strong> The Sun, 8 planets, Moon as a natural satellite.</li><li><strong>Earth's Movements:</strong> Rotation causes day and night, Revolution causes seasons.</li></ul></div>`,
            class4: `<div class="note-card"><h2>🍃 Chapter 1: Plant Adaptations & Photosynthesis</h2><ul><li><strong>Photosynthesis:</strong> The process of making food using sunlight, water, CO2.</li><li><strong>Adaptations:</strong> Terrestrial plants (deserts, mountains), aquatic plants (floating, submerged).</li></ul></div><div class="note-card"><h2>🐾 Chapter 2: Animal Adaptations</h2><ul><li><strong>Habitats:</strong> Terrestrial, aquatic, amphibious, arboreal, aerial animals.</li><li><strong>Survival:</strong> Camouflage, hibernation, migration.</li><li><strong>Reproduction:</strong> Egg-laying animals vs mammals.</li></ul></div><div class="note-card"><h2>⚙️ Chapter 3: Force, Work & Energy</h2><ul><li><strong>Force:</strong> Push or pull. Friction and gravity.</li><li><strong>Work:</strong> Done when a force moves an object.</li><li><strong>Energy:</strong> Sources of energy (solar, wind, water), renewable vs non-renewable.</li></ul></div><div class="note-card"><h2>🌎 Chapter 4: Matter & The Environment</h2><ul><li><strong>States of Matter:</strong> Solid, liquid, gas properties. Evaporation, condensation.</li><li><strong>Environment:</strong> Pollution (air, water, land, noise) and conservation of resources.</li></ul></div>`,
            class5: `<div class="note-card"><h2>🧬 Chapter 1: Human Body Systems</h2><ul><li><strong>Skeletal System:</strong> Skull, rib cage, spine, limbs. Joints (hinge, ball & socket).</li><li><strong>Nervous System:</strong> Brain (cerebrum, cerebellum, medulla), spinal cord, nerves.</li></ul></div><div class="note-card"><h2>🩺 Chapter 2: Health & Diseases</h2><ul><li><strong>Nutrients:</strong> Carbohydrates, proteins, fats, vitamins, minerals.</li><li><strong>Diseases:</strong> Communicable (viral, bacterial) vs Non-communicable (deficiency diseases like scurvy, rickets).</li></ul></div><div class="note-card"><h2>⚛️ Chapter 3: States of Matter</h2><ul><li><strong>Molecules:</strong> Arrangement in solids, liquids, and gases.</li><li><strong>Changes:</strong> Physical changes (melting, freezing) vs chemical changes (burning, rusting). Solutions (solute + solvent).</li></ul></div><div class="note-card"><h2>🌋 Chapter 4: Natural Disasters & Space</h2><ul><li><strong>Disasters:</strong> Earthquakes, volcanoes, tsunamis, droughts, floods.</li><li><strong>Space:</strong> Artificial satellites, eclipses (solar and lunar), phases of the moon.</li></ul></div>`,
            class6: `<div class="note-card"><h2>🧪 Chapter 1: Food & Components</h2><ul><li><strong>Sources:</strong> Plant and animal sources of food.</li><li><strong>Components:</strong> Testing for starch, protein, fats. Dietary fibre and water. Balanced diet.</li></ul></div><div class="note-card"><h2>🔬 Chapter 2: Materials & Changes</h2><ul><li><strong>Sorting Materials:</strong> Properties like appearance, hardness, solubility, transparency (transparent, opaque, translucent).</li><li><strong>Separation:</strong> Handpicking, winnowing, sieving, filtration, evaporation.</li></ul></div><div class="note-card"><h2>🧬 Chapter 3: The Living World</h2><ul><li><strong>Plants:</strong> Herbs, shrubs, trees, creepers, climbers. Stem, leaf, root structures.</li><li><strong>Body Movements:</strong> Ball and socket joints, pivotal joints, hinge joints. Animal gaits (earthworm, snail, snake, bird, fish).</li></ul></div><div class="note-card"><h2>⚡ Chapter 4: Physics Concepts</h2><ul><li><strong>Motion & Measurement:</strong> Types of motion (rectilinear, circular, periodic). Standard units.</li><li><strong>Light:</strong> Shadows, pinhole camera, reflection.</li><li><strong>Electricity & Magnets:</strong> Electric circuits, conductors, insulators. Magnetic poles, attraction/repulsion.</li></ul></div>`,
            class7: `<div class="note-card"><h2>🌿 Chapter 1: Nutrition in Organisms</h2><ul><li><strong>Plants:</strong> Autotrophic nutrition, photosynthesis, parasitic and saprotrophic plants.</li><li><strong>Animals:</strong> Human digestive system (mouth to anus), digestion in grass-eating animals (ruminants), amoeba.</li></ul></div><div class="note-card"><h2>🔥 Chapter 2: Heat & Acids/Bases</h2><ul><li><strong>Heat:</strong> Thermometers (clinical, laboratory). Transfer of heat: conduction, convection, radiation.</li><li><strong>Acids & Bases:</strong> Natural indicators (litmus, turmeric), neutralization reaction, salts.</li></ul></div><div class="note-card"><h2>🌬️ Chapter 3: Respiration & Transportation</h2><ul><li><strong>Respiration:</strong> Aerobic vs anaerobic. Breathing in humans, insects, fish, earthworms.</li><li><strong>Transportation:</strong> Circulatory system (heart, blood vessels), excretion in animals. Transport of water/food in plants (xylem, phloem).</li></ul></div><div class="note-card"><h2>⚡ Chapter 4: Motion, Time & Light</h2><ul><li><strong>Motion & Time:</strong> Speed formula, simple pendulum, distance-time graphs.</li><li><strong>Light:</strong> Reflection by plane and spherical mirrors (concave/convex), lenses. White light spectrum.</li><li><strong>Electric Current:</strong> Heating and magnetic effects of electric current, electromagnets.</li></ul></div>`,
