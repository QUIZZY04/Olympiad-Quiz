<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter-Wise Study Material | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --muted: #475569;
            --border: #e2e8f0; --brand: #4f46e5; --accent: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.8; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 25px; }
        
        .study-section { background: white; border-radius: 24px; padding: 50px; margin-bottom: 40px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        
        .chapter-tag { display: inline-block; background: var(--accent); color: white; padding: 4px 12px; border-radius: 6px; font-weight: 800; margin-bottom: 10px; font-size: 0.9rem; }
        h1 { font-size: 2.4rem; color: var(--brand); margin-bottom: 30px; font-weight: 800; border-bottom: 4px solid var(--brand); padding-bottom: 10px; }
        h2 { font-size: 1.8rem; color: #1e1b4b; margin: 40px 0 20px 0; display: flex; align-items: center; gap: 10px; }
        h2::before { content: ''; width: 6px; height: 30px; background: var(--brand); border-radius: 3px; display: inline-block; }
        
        p { margin-bottom: 20px; font-size: 1.1rem; color: #334155; text-align: justify; }

        .formula-card { background: #fdf2f8; border: 1px solid #fbcfe8; padding: 25px; border-radius: 15px; color: #be185d; font-family: 'Courier New', monospace; font-weight: 700; margin: 25px 0; text-align: center; font-size: 1.3rem; }
        
        .method-box { background: #f0f9ff; border-left: 6px solid #0ea5e9; padding: 25px; border-radius: 0 15px 15px 0; margin: 20px 0; }
        .method-box b { color: #0369a1; display: block; margin-bottom: 5px; }

        .science-fact { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 12px; margin: 20px 0; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <div id="contentInjection"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = (urlParams.get('subject') || 'maths').toLowerCase();
    const classStr = (urlParams.get('class') || 'class5').toLowerCase();

    const studyDB = {
        maths: {
            class5: `
                <h1>Mathematics - Class 5</h1>
                <div class="study-section">
                    <span class="chapter-tag">M01</span>
                    <h2>Number Sense & Computation</h2>
                    <p>In Class 5, we master numbers up to 8 digits. This involves understanding the <b>Indian vs. International Systems</b>. The Indian system uses Lakhs/Crores, while the International system uses Millions/Billions.</p>
                    <div class="method-box"><b>BODMAS Rule:</b> Always prioritize Brackets (B) and 'Of' (O) before basic arithmetic like Division (D) or Addition (A).</div>
                </div>

                <div class="study-section">
                    <span class="chapter-tag">M05</span>
                    <h2>Perimeter & Area</h2>
                    <p>Perimeter is the total boundary of a figure, while Area is the space inside. For a square, we multiply the side by 4 for perimeter and by itself for area.</p>
                    <div class="formula-card">Perimeter (Rect) = 2(L+B) | Area (Rect) = L × B</div>
                </div>`,

            class6: `
                <h1>Mathematics - Class 6</h1>
                <div class="study-section">
                    <span class="chapter-tag">M01 - M03</span>
                    <h2>Knowing Our Numbers & Integers</h2>
                    <p>Integers introduce <b>negative values</b>. On a number line, zero acts as the center. Numbers to the right are positive, and numbers to the left are negative. Adding a negative number is equivalent to moving left.</p>
                    <div class="method-box"><b>Rule of Signs:</b> (-) × (-) = (+) | (+) × (-) = (-)</div>
                </div>

                <div class="study-section">
                    <span class="chapter-tag">M05 - M06</span>
                    <h2>Algebra & Ratio/Proportion</h2>
                    <p>Algebra uses <b>Variables</b> (letters like x) to represent unknowns. Ratio is a comparison of two quantities by division, expressed as a:b.</p>
                    <div class="formula-box">Proportion: Product of Extremes = Product of Means</div>
                </div>`,

            class7: `
                <h1>Mathematics - Class 7</h1>
                <div class="study-section">
                    <span class="chapter-tag">M01 - M02</span>
                    <h2>Integers, Fractions & Decimals</h2>
                    <p>Fractions are parts of a whole. To add <b>Unlike Fractions</b>, you must first find the Least Common Multiple (LCM) of the denominators to make them equivalent.</p>
                    <div class="method-box"><b>Decimal Multiplication:</b> Multiply the numbers as whole numbers first, then count the total decimal places from the right.</div>
                </div>`
        },
        science: {
            class5: `
                <h1>Science - Class 5</h1>
                <div class="study-section">
                    <span class="chapter-tag">S01 - S02</span>
                    <h2>Animals & Plants</h2>
                    <p>Animals are classified by their breathing organs: Mammals use lungs, insects use spiracles, and fish use gills. Plants produce food through <b>Photosynthesis</b> using chlorophyll in their leaves.</p>
                    <div class="science-fact"><b>Seed Dispersal:</b> Seeds can travel by Wind (Dandelion), Water (Coconut), or Animals (Xanthium).</div>
                </div>

                <div class="study-section">
                    <span class="chapter-tag">S03</span>
                    <h2>Human Body & Health</h2>
                    <p>The <b>Nervous System</b> is the body's command center. The brain has three parts: The Cerebrum (thinking), Cerebellum (balance), and Medulla (involuntary actions like breathing).</p>
                </div>`,

            class6: `
                <h1>Science - Class 6</h1>
                <div class="study-section">
                    <span class="chapter-tag">S01 - S04</span>
                    <h2>Food & Body Movements</h2>
                    <p>Nutrients include Carbohydrates, Proteins, and Vitamins. Deficiency of Vitamin A causes Night Blindness. Body movement is enabled by <b>Joints</b> like Ball-and-Socket (Shoulder) and Hinge (Elbow).</p>
                </div>

                <div class="study-section">
                    <span class="chapter-tag">S06 - S08</span>
                    <h2>Light, Shadows & Electricity</h2>
                    <p>Light travels in a straight line (Rectilinear Propagation). A <b>Shadow</b> is formed when an opaque object blocks light. Electricity flows in a <b>Closed Circuit</b>.</p>
                </div>`
        }
    };

    function loadContent() {
        const sub = studyDB[subject] || studyDB.maths;
        let content = sub[classStr] || "<h1>Content for this Class</h1><div class='study-section'><p>Detailed chapter-wise notes are being finalized by our experts. Please check back shortly!</p></div>";
        document.getElementById('contentInjection').innerHTML = content;
    }
    loadContent();
</script>

</body>
</html>
