<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Study Material | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #64748b;
            --border: #e2e8f0; --brand: #4f46e5; --accent: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.8; }
        
        nav { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .brand { font-weight: 800; color: var(--brand); text-decoration: none; font-size: 1.4rem; }
        .nav-links a { text-decoration: none; color: var(--text); font-weight: 600; margin-left: 20px; font-size: 0.9rem; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .page-header { margin-bottom: 40px; }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
        .page-header span { color: var(--brand); text-transform: capitalize; }

        .note-card { background: white; border-radius: 20px; padding: 45px; margin-bottom: 35px; border: 1px solid var(--border); border-top: 8px solid var(--brand); box-shadow: 0 15px 30px -5px rgba(0,0,0,0.05); }
        .chapter-tag { background: #eef2ff; color: var(--brand); padding: 5px 15px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; margin-bottom: 15px; display: inline-block; border: 1px solid #c7d2fe; }
        
        h2 { font-size: 2rem; color: #1e293b; margin-bottom: 25px; font-weight: 700; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        h3 { font-size: 1.4rem; color: var(--brand); margin-top: 30px; margin-bottom: 15px; font-weight: 700; }
        
        p { margin-bottom: 20px; color: #334155; text-align: justify; font-size: 1.1rem; }
        ul { margin-bottom: 20px; padding-left: 25px; }
        li { margin-bottom: 12px; color: #475569; }

        .formula-box { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 30px; border-radius: 15px; font-family: 'Courier New', monospace; font-weight: 700; margin: 30px 0; text-align: center; font-size: 1.4rem; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); }
        .method-step { background: #f0fdf4; border-left: 6px solid #22c55e; padding: 25px; border-radius: 0 15px 15px 0; margin: 25px 0; }
        .method-step b { color: #166534; font-size: 1.2rem; display: block; margin-bottom: 5px; }
        .important-note { background: #fff7ed; border: 1px solid #ffedd5; padding: 20px; border-radius: 12px; color: #9a3412; margin: 20px 0; font-style: italic; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-links">
        <a href="study.html">Subjects</a>
        <a href="index.html">Home</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1><span id="displaySubject">Subject</span> - <span id="displayClass" style="color:var(--text)">Class</span></h1>
        <p style="color:var(--muted)">Deep-dive conceptual notes for advanced Olympiad preparation.</p>
    </div>

    <div id="contentInjection"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = (urlParams.get('subject') || 'maths').toLowerCase();
    const classStr = (urlParams.get('class') || 'class5').toLowerCase();
    const classNum = parseInt(classStr.replace('class', ''));

    document.getElementById('displaySubject').innerText = subject;
    document.getElementById('displayClass').innerText = `Class ${classNum}`;

    const studyDB = {
        maths: {
            primary: `
                <div class="note-card">
                    <span class="chapter-tag">M01 - Number Systems</span>
                    <h2>Understanding Large Numbers</h2>
                    <p>In the primary years, we transition from basic counting to mastering 5, 6, and 7-digit numbers. The <b>Indian Place Value System</b> uses periods like Crores, Lakhs, Thousands, and Ones to help us read numbers like 75,42,301.</p>
                    <div class="formula-box">Place Value = Face Value × Position Value</div>
                    <h3>Successor and Predecessor</h3>
                    <p>Every number has a successor (the number that comes immediately after, found by adding 1) and a predecessor (the number that comes before, found by subtracting 1).</p>
                </div>
                <div class="note-card">
                    <span class="chapter-tag">M05 - Mensuration</span>
                    <h2>Perimeter and Area</h2>
                    <p><b>Perimeter</b> is the total length of the boundary of a closed figure. Imagine walking around the edge of a park—that distance is the perimeter. <b>Area</b> is the amount of surface covered by that park.</p>
                    <div class="method-step"><b>Rectangle Formula:</b> To find the perimeter, add the length and breadth and multiply by 2. To find the area, simply multiply length by breadth.</div>
                    <div class="formula-box">Area = L × B | Perimeter = 2 × (L + B)</div>
                </div>`,
            middle: `
                <div class="note-card">
                    <span class="chapter-tag">M01 - Integers</span>
                    <h2>Positive and Negative Numbers</h2>
                    <p>Integers expand our number world to include values below zero. On a number line, zero is the neutral point. Positive integers are to the right, and negative integers are to the left.</p>
                    <div class="important-note">Remember: The further a negative number is from zero, the smaller its value is (e.g., -10 is smaller than -2).</div>
                    <div class="method-step"><b>Multiplication Rule:</b> Two negatives multiplied together always result in a positive answer. (-5 × -4 = +20).</div>
                </div>`,
            secondary: `
                <div class="note-card">
                    <span class="chapter-tag">M08 - Trigonometry</span>
                    <h2>Introduction to Trigonometric Ratios</h2>
                    <p>Trigonometry is the study of the relationship between the sides and angles of a right-angled triangle. We use three primary ratios: <b>Sine, Cosine, and Tangent</b>.</p>
                    <div class="formula-box">sin²θ + cos²θ = 1</div>
                    <p>These ratios are essential for calculating heights and distances that cannot be measured directly, such as the height of a mountain or the distance of a ship from a lighthouse.</p>
                </div>`
        },
        science: {
            class5: `
                <div class="note-card">
                    <span class="chapter-tag">S01 - Animals</span>
                    <h2>Breathing and Movement</h2>
                    <p>Animals must take in oxygen to survive. Different animals have evolved different organs based on where they live. For instance, fish use <b>Gills</b> to take oxygen from water, while mammals use <b>Lungs</b> to breathe air.</p>
                </div>
                <div class="note-card">
                    <span class="chapter-tag">S03 - Human Body</span>
                    <h2>The Nervous System</h2>
                    <p>The nervous system is the most complex system in the body, acting as a high-speed communication network. It consists of the brain, spinal cord, and millions of nerves.</p>
                    <h3>The Human Brain</h3>
                    <ul>
                        <li><b>Cerebrum:</b> The thinking part. It controls memory, intelligence, and the five senses.</li>
                        <li><b>Cerebellum:</b> The balancing part. It coordinates muscle movements.</li>
                        <li><b>Medulla:</b> The life-support part. It controls involuntary actions like breathing and heartbeat.</li>
                    </ul>
                </div>`,
            middle: `
                <div class="note-card">
                    <span class="chapter-tag">S01 - Food</span>
                    <h2>Components of Food</h2>
                    <p>Our body requires five main nutrients to stay healthy: Carbohydrates, Fats, Proteins, Vitamins, and Minerals. A <b>Balanced Diet</b> contains all these in the right proportions.</p>
                </div>`
        }
    };

    function loadContent() {
        const subData = studyDB[subject] || studyDB.maths;
        let content = "";

        if (subData[`class${classNum}`]) {
            content = subData[`class${classNum}`];
        } else if (classNum <= 5) {
            content = subData.primary;
        } else if (classNum <= 8) {
            content = subData.middle;
        } else {
            content = subData.secondary;
        }

        document.getElementById('contentInjection').innerHTML = content;
    }
    loadContent();
</script>

</body>
</html>
