<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Olympiad Study Material | Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>

<style>
:root{
    --bg:#f8fafc;
    --surface:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --brand:#4f46e5;
    --accent:#8b5cf6;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* NAVBAR */
nav{
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.brand{
    font-size:1.5rem;
    font-weight:800;
    color:var(--brand);
    text-decoration:none;
}

.nav-links{
    display:flex;
gap:15px;
flex-wrap: wrap;
}

.nav-links a{
    text-decoration:none;
font-weight:700;
color:var(--text);
font-size: 0.85rem;
text-transform: uppercase;
    transition:0.3s;
padding: 8px 12px;
border-radius: 8px;
}

.nav-links a:hover{
color:var(--brand);
background: rgba(79, 70, 229, 0.05);
}

/* MAIN CONTAINER */
.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

/* HEADER */
.header-section{
    margin-bottom:25px;
}

.breadcrumb{
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:8px;
}

.breadcrumb a{
    color:var(--brand);
    text-decoration:none;
}

h1{
    font-size:2.2rem;
    font-weight:800;
}

h1 span{
    color:var(--brand);
}

/* NOTE CARD */
.note-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
    margin-top:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
    line-height:1.8;
}

/* 🔥 FIXED HEADING ISSUE */
.note-card h2{
    font-size:1.6rem;
    font-weight:700;
    color:var(--brand);
    margin-bottom:15px;
}

.note-card h3{
    font-size:1.25rem;
    font-weight:600;
    margin-top:25px;
    margin-bottom:10px;
}

/* TEXT */
.note-card p{
    font-size:1.02rem;
    margin-bottom:15px;
    color:#1e293b;
}

.note-card ul{
    padding-left:20px;
}

.note-card li{
    margin-bottom:8px;
}

/* IMAGE */
.note-card img{
    max-width:50%;
    display:block;
    margin:20px auto;
    border-radius:10px;
}

/* BUTTON */
.action-area{
    text-align:center;
    margin-top:40px;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    background:linear-gradient(135deg,#4f46e5,#2563eb);
    color:white;
    border-radius:40px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

/* FOOTER */
footer{
    margin-top:50px;
    text-align:center;
    padding:25px;
    border-top:1px solid var(--border);
    color:var(--muted);
}

/* MOBILE */
@media(max-width:768px){
    h1{font-size:1.8rem;}
    .note-card{padding:25px;}
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-important">
        <a href="dashboard.html">Dash</a>
        <a onclick="logout()" style="cursor:pointer;">Logout</a>
    </div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="mock.html">Mock Tests</a>
        <a href="chapterwise.html">Chapterwise</a>
        <a href="live.html">Live Arena</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="study.html" class="active">Study Material</a>
        <div class="nav-actions">
            <a onclick="logout()" class="login-link" style="color: var(--danger); cursor: pointer;">Logout</a>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div class="container">

<div class="header-section">
    <div class="breadcrumb">
        <a href="study.html">Study Material</a> > 
        <span id="breadSubject">Subject</span>
    </div>

    <h1>
        <span id="pageTitle">Mathematics</span> - 
        <span id="pageClass" style="color:var(--text)">Class 6</span>
    </h1>

    <p style="color:var(--muted)">
        Curated high-performance notes for Olympiad aspirants.
    </p>
</div>

<div id="contentInjection"></div>

<div class="action-area">
    <a href="chapterwise.html" class="btn">Start Practice Quiz 🚀</a>
</div>

</div>

<footer>
© 2026 Olympiad Portal
</footer>

<!-- FIREBASE SCRIPT (UNCHANGED LOGIC) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
    authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
    projectId: "olympiad-portal-d2a5e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get('subject') || 'maths';
const classStr = urlParams.get('class') || 'class6';
const classNum = parseInt(classStr.replace('class',''));

/* PAGE TITLE UPDATE */
document.getElementById('breadSubject').innerText = subject;
document.getElementById('pageTitle').innerText = subject;
document.getElementById('pageClass').innerText = "Class " + classNum;

/* LOAD CONTENT */
async function loadStudyContent(){
    const div = document.getElementById('contentInjection');
    div.innerHTML = "<div class='note-card'>Loading content...</div>";

    try{
        const docRef = doc(db,"study_content",`${classStr}_${subject}`);
        const snap = await getDoc(docRef);

        if(snap.exists() && snap.data().htmlContent){
            div.innerHTML = `<div class="note-card">${snap.data().htmlContent}</div>`;

            /* IMAGE ERROR FIX */
            const imgs = div.querySelectorAll("img");
            imgs.forEach(img=>{
                img.onerror = ()=> img.style.display="none";
            });

        }else{
            div.innerHTML = `<div class='note-card'>
                <h3>Content updating soon...</h3>
                <p>Notes for Class ${classNum} ${subject} will be available shortly.</p>
            </div>`;
        }

    }catch(err){
        div.innerHTML = `<div class='note-card'>
            <h3>Error loading content</h3>
            <p>Please try again later.</p>
        </div>`;
    }
}

loadStudyContent();

/* Mobile Menu Toggle */
window.toggleMenu = function() {
    document.querySelector('.nav-links').classList.toggle('active');
}

window.logout = function() {
    if(confirm("Logout?")) {
        window.location.href = "login.html";
    }
}
</script>

</body>
</html>
