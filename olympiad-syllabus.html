<header>

<p>Select Class and Subject to view detailed syllabus</p>

<div class="container">

<div class="selector">

<select id="classSelect" onchange="showSyllabus()">
<option value="">Select Class</option>
<option value="1">Class 1</option>

<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>

<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
</select>

<select id="subjectSelect" onchange="showSyllabus()">
<option value="">Select Subject</option>
<option value="math">Mathematics</option>
<option value="science">Science</option>
<option value="english">English</option>
<option value="reasoning">Logical Reasoning</option>
<option value="gk">General Knowledge</option>
</select>

</div>

<div id="syllabusResult" class="result">
<h2>Select Class and Subject</h2>
</div>

</div>

6:["Components of food","Motion and measurement","Electricity and circuits","Light and magnetism","Air around us"],
7:["Nutrition in plants and animals","Heat","Acids bases and salts","Physical and chemical changes","Light"],

function showSyllabus(){

let c=document.getElementById("classSelect").value
let s=document.getElementById("subjectSelect").value

if(!c || !s) return

let topics=syllabus[s][c]

let html="<h2>Class "+c+" "+s.toUpperCase()+" Syllabus</h2><ul>"

topics.forEach(topic=>{
html+="<li>"+topic+"</li>"
})

html+="</ul>"

document.getElementById("syllabusResult").innerHTML=html

}
