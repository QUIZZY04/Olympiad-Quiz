<header>

<h1>Olympiad Syllabus Explorer</h1>
<p>Select Class and Subject</p>

</header>


<div class="container">

<div class="selector">

<select id="classSelect" onchange="showSyllabus()">

<option value="">Select Class</option>
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>
<option value="6">Class 6</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>

</select>

<select id="subjectSelect" onchange="showSyllabus()">

<option value="">Select Subject</option>
<option value="math">Mathematics</option>

</select>

</div>

<div id="syllabusResult" class="result">

<h2>Select Class and Subject</h2>

</div>

</div>


<script>

const syllabus = {

math:{

1:{
reasoning:["Odd One Out","Analogy","Pattern Completion","Picture Series"],
math:[
"Counting numbers up to 100",
"Number names and number comparison",
"Addition and subtraction",
"Basic number patterns",
"Shapes and spatial understanding"
],
everyday:[
"Time concepts",
"Money identification",
"Measurement comparison"
],
achievers:[
"Advanced addition problems",
"Complex pattern problems"
]
},

2:{
reasoning:["Analogy","Series completion","Classification","Mirror images"],
math:[
"Two digit numbers",
"Place value",
"Addition and subtraction",
"Multiplication introduction",
"Number patterns"
],
everyday:[
"Time calculation",
"Money problems",
"Measurement units"
],
achievers:[
"Mixed arithmetic problems",
"Advanced number patterns"
]
},

3:{
reasoning:["Alphabet series","Coding decoding","Direction sense","Logical classification"],
math:[
"Place value up to 4 digits",
"Addition and subtraction of larger numbers",
"Multiplication and division",
"Fractions introduction",
"Basic geometry"
],
everyday:[
"Time intervals",
"Money calculations",
"Measurement conversions",
"Data interpretation"
],
achievers:[
"Multi-step word problems",
"Advanced fraction questions"
]
},

4:{
reasoning:["Figure series","Coding decoding","Mirror images","Logical puzzles"],
math:[
"Large numbers",
"Multiplication and division",
"Factors and multiples",
"Fractions",
"Decimals",
"Geometry basics"
],
everyday:[
"Perimeter and area",
"Measurement units",
"Data handling"
],
achievers:[
"Complex arithmetic problems",
"Advanced fractions"
]
},

5:{
reasoning:["Number series","Alphabet series","Venn diagrams","Logical puzzles"],
math:[
"Factors and multiples",
"Fractions",
"Decimals",
"Geometry",
"Perimeter and area"
],
everyday:[
"Measurement conversions",
"Time and calendar",
"Data handling"
],
achievers:[
"Advanced arithmetic puzzles"
]
},

6:{
reasoning:["Analogy","Series","Coding decoding","Logical puzzles"],
math:[
"Integers",
"Fractions and decimals",
"Ratio and proportion",
"Algebra basics",
"Geometry"
],
everyday:[
"Mensuration",
"Data handling",
"Speed distance time"
],
achievers:[
"Advanced algebra problems"
]
},

7:{
reasoning:["Coding decoding","Series","Logical puzzles","Venn diagrams"],
math:[
"Rational numbers",
"Algebraic expressions",
"Linear equations",
"Geometry",
"Mensuration"
],
everyday:[
"Data handling",
"Simple interest"
],
achievers:[
"Advanced algebra problems"
]
},

8:{
reasoning:["Logical puzzles","Analogy","Series","Data interpretation"],
math:[
"Exponents",
"Squares and cubes",
"Algebra",
"Linear equations",
"Mensuration"
],
everyday:[
"Graphs",
"Probability basics"
],
achievers:[
"Advanced algebra and graph problems"
]
},

9:{
reasoning:["Analytical reasoning","Series","Coding decoding"],
math:[
"Polynomials",
"Coordinate geometry",
"Linear equations",
"Triangles",
"Surface areas"
],
everyday:[
"Statistics",
"Probability"
],
achievers:[
"Advanced polynomial problems"
]
},

10:{
reasoning:["Advanced logical reasoning","Analytical puzzles"],
math:[
"Quadratic equations",
"Trigonometry",
"Coordinate geometry",
"Arithmetic progression"
],
everyday:[
"Probability",
"Statistics",
"Surface areas and volumes"
],
achievers:[
"Advanced trigonometry problems"
]
}

}

}

function showSyllabus(){

let c=document.getElementById("classSelect").value
let s=document.getElementById("subjectSelect").value

if(!c || !s) return

let data=syllabus[s][c]

let html=`<h2>Class ${c} ${s.toUpperCase()} Syllabus</h2>

<h3>Logical Reasoning</h3>
<ul>${data.reasoning.map(x=>`<li>${x}</li>`).join("")}</ul>

<h3>Mathematical Reasoning</h3>
<ul>${data.math.map(x=>`<li>${x}</li>`).join("")}</ul>

<h3>Everyday Mathematics</h3>
<ul>${data.everyday.map(x=>`<li>${x}</li>`).join("")}</ul>

<h3>Achievers Section</h3>
<ul>${data.achievers.map(x=>`<li>${x}</li>`).join("")}</ul>
`

document.getElementById("syllabusResult").innerHTML=html

}

</script>

</body>
