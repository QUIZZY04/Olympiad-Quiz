<select id="classSelect" onchange="showSyllabus()">

<option value="">Select Subject</option>

<option value="science">Science</option>

<option value="reasoning">Logical Reasoning</option>

<script>

const syllabus={

math:{
1:["Counting Numbers","Number Names","Addition","Subtraction","Shapes","Patterns"],
2:["Two Digit Numbers","Place Value","Addition and Subtraction","Multiplication Basics","Patterns"],
3:["Multiplication","Division","Fractions","Measurement","Geometry Basics","Data Handling"],
4:["Large Numbers","Multiplication","Division","Fractions","Decimals","Factors and Multiples","Geometry"],
5:["Factors and Multiples","Fractions","Decimals","Geometry","Perimeter and Area","Data Handling"],
6:["Integers","Fractions","Decimals","Ratio and Proportion","Algebra Basics","Geometry","Data Handling"],
7:["Rational Numbers","Linear Equations","Algebraic Expressions","Geometry","Mensuration"],
8:["Exponents and Powers","Algebra","Squares and Cubes","Mensuration","Graphs","Probability"],
9:["Polynomials","Coordinate Geometry","Linear Equations","Triangles","Statistics"],
10:["Quadratic Equations","Trigonometry","Coordinate Geometry","Probability","Surface Areas and Volumes"]
},

science:{
1:["Living and Non Living","Plants","Animals","Human Body","Air and Water"],
2:["Plants","Animals","Food","Human Body","Environment"],
3:["Food and Digestion","Human Body","Plants","Animals","Earth and Universe"],
4:["Animals","Human Body Systems","Matter","Energy","Environment"],
5:["Food and Health","Force","Energy","Matter","Earth Science"],
6:["Components of Food","Motion","Electricity","Light","Magnetism","Air Around Us"],
7:["Nutrition","Heat","Acids Bases and Salts","Physical and Chemical Changes","Light"],
8:["Force and Pressure","Sound","Chemical Effects","Friction","Cell Structure"],
9:["Matter in Our Surroundings","Atoms and Molecules","Motion","Energy","Cell Biology"],
10:["Chemical Reactions","Acids Bases and Salts","Life Processes","Electricity","Light"]
},

english:{
1:["Alphabet","Vocabulary","Simple Sentences","Spellings"],
2:["Vocabulary","Sentence Formation","Grammar Basics"],
3:["Nouns","Verbs","Adjectives","Articles","Comprehension"],
4:["Tenses","Pronouns","Adverbs","Vocabulary","Reading"],
5:["Synonyms","Antonyms","Sentence Structure","Comprehension"],
6:["Grammar Rules","Vocabulary","Tenses","Reading Skills"],
7:["Parts of Speech","Idioms","Vocabulary","Reading"],
8:["Advanced Grammar","Vocabulary","Comprehension"],
9:["Grammar","Vocabulary","Reading Comprehension"],
10:["Advanced Grammar","Vocabulary","Comprehension"]
},

reasoning:{
1:["Patterns","Odd One Out","Picture Series"],
2:["Analogies","Patterns","Classification"],
3:["Coding Decoding","Series","Direction Sense"],
4:["Classification","Coding","Series","Mirror Images"],
5:["Number Series","Venn Diagrams","Patterns"],
6:["Analogy","Series","Logical Puzzles"],
7:["Coding Decoding","Series","Venn Diagrams"],
8:["Logical Puzzles","Analogy","Series"],
9:["Analytical Reasoning","Coding","Series"],
10:["Advanced Logical Reasoning","Puzzles"]
},

gk:{
1:["Animals","Plants","Environment"],
2:["Nature","Basic Science Facts"],
3:["Countries","Animals","Famous Places"],
4:["History Basics","Geography Basics"],
5:["Science Facts","World Knowledge"],
6:["Current Affairs","Science Discoveries"],
7:["Geography","History","Science"],
8:["World Geography","Current Affairs"],
9:["International Events","Science and Technology"],
10:["Global Affairs","Science Innovations"]
}

}

function showSyllabus(){

let c=document.getElementById("classSelect").value
let s=document.getElementById("subjectSelect").value
let result=document.getElementById("syllabusResult")

if(!c || !s){
result.innerHTML="<h2>Select Class and Subject</h2>"
return
}

let topics=syllabus[s][c]

let html="<h2>Class "+c+" "+s.toUpperCase()+" Syllabus</h2><ul>"

topics.forEach(t=>{
html+="<li>"+t+"</li>"
})

html+="</ul>"

result.innerHTML=html

}

</script>
