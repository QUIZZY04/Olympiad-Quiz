<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOF Previous Year Papers (PYQs) | Olympiad Portal</title>
    <meta name="description" content="Download official SOF Previous Year Question Papers (PYQs) in PDF format.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #111827; --muted: #475569; --border: #e2e8f0;
            --brand: #ff6b00; --accent: #ff8c1a; --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 0% 0%, rgba(255, 107, 0, 0.05) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(255, 140, 26, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        .container { flex: 1; max-width: 900px; margin: 40px auto; padding: 0 20px; width: 100%; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.8rem; color: var(--text); font-weight: 800; margin-bottom: 10px; }
        .header h1 span { color: var(--brand); }
        .header p { color: var(--muted); font-size: 1.1rem; max-width: 700px; margin: 0 auto; }

        .filter-bar { background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--brand); align-items: center; }
        .filter-label { display: block; font-size: 1.1rem; font-weight: 700; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        .filter-bar select { width: 100%; max-width: 400px; padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border); outline: none; font-size: 16px; font-weight: 600; background: var(--bg); color: var(--text); cursor: pointer; transition: 0.2s; }
        .filter-bar select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1); }

        #downloadContainer { text-align: center; margin-top: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; width: 100%; }
        .btn-download { display: inline-block; background: var(--brand); color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3); border: none; cursor: pointer; }
        .btn-download:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 107, 0, 0.4); }
        .msg-info { color: var(--muted); font-weight: 600; font-size: 1.1rem; padding: 20px; border: 2px dashed var(--border); border-radius: 12px; width: 100%; max-width: 400px; background: var(--surface); }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            .filter-bar { padding: 25px 20px; }
        }
    </style>
</head>
<body>
<nav style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom:1px solid var(--border); padding:20px 5%; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:1000; flex-wrap: wrap; gap: 10px;">
    <a href="index.html" style="font-size: 1.5rem; font-weight: 800; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px;"><img src="favicon.png" alt="Logo" style="height: 32px; width: auto;" onerror="this.style.display='none'"> Olympiad Portal</a>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap: wrap; justify-content: center;">
        <a href="dashboard.html" style="color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; text-transform:uppercase;">Dashboard</a>
        <a href="mock.html" style="color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; text-transform:uppercase;">Mock Tests</a>
        <a href="chapterwise.html" style="color:var(--text); text-decoration:none; font-size:0.9rem; font-weight:700; text-transform:uppercase;">Chapterwise</a>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>SOF Previous Year <span>Papers</span></h1>
        <p>Select your class below to download the official SOF Previous Year Question papers (PYQs) and strengthen your preparation.</p>
    </div>

    <div class="filter-bar">
        <div style="display: flex; gap: 20px; width: 100%; max-width: 700px; flex-wrap: wrap; justify-content: center;">
            <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; align-items: center;">
                <label for="classSelect" class="filter-label">🎓 Select Grade</label>
                <select id="classSelect" onchange="fetchPaper()">
                    <option value="" disabled selected>Choose your class...</option>
                    <option value="class1">Class 1</option>
                    <option value="class2">Class 2</option>
                    <option value="class3">Class 3</option>
                    <option value="class4">Class 4</option>
                    <option value="class5">Class 5</option>
                    <option value="class6">Class 6</option>
                    <option value="class7">Class 7</option>
                    <option value="class8">Class 8</option>
                    <option value="class9">Class 9</option>
                    <option value="class10">Class 10</option>
                    <option value="class11">Class 11</option>
                    <option value="class12">Class 12</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; align-items: center;">
                <label for="subjectSelect" class="filter-label">📚 Select Subject</label>
                <select id="subjectSelect" onchange="fetchPaper()">
                    <option value="" disabled selected>Choose your subject...</option>
                    <option value="IMO">IMO (Mathematics)</option>
                    <option value="NSO">NSO (Science)</option>
                    <option value="IEO">IEO (English)</option>
                    <option value="NCO">NCO (Cyber)</option>
                    <option value="IGKO">IGKO (General Knowledge)</option>
                    <option value="ISSO">ISSO (Social Studies)</option>
                    <option value="IHO">IHO (Hindi)</option>
                </select>
            </div>
        </div>

        <div id="downloadContainer" style="display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center;">
            <div class="msg-info">Please select a class and subject to view papers.</div>
        </div>
    </div>
</div>

<footer style="text-align:center;padding:30px;background:var(--surface);border-top:1px solid var(--border);color:var(--muted);margin-top:auto;">
    <p style="margin-top:15px;font-size:14px;">© 2026 Olympiad Portal. All rights reserved.</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.fetchPaper = async function() {
        const cls = document.getElementById('classSelect').value;
        const sub = document.getElementById('subjectSelect').value;
        const container = document.getElementById('downloadContainer');
        
        if(!cls || !sub) return;
        
        container.innerHTML = `<div class="msg-info">Loading...</div>`;
        
        try {
            let html = "";
            const years = [];
            for (let y = 2025; y >= 2010; y--) years.push(y.toString());
            
            const promises = years.map(year => getDoc(doc(db, "sof_pyqs", `${cls}_${sub}_${year}`)));
            const snaps = await Promise.all(promises);
            
            snaps.forEach((snap, index) => {
                if (snap.exists() && snap.data().pdfUrl) {
                    const url = snap.data().pdfUrl;
                    const year = years[index];
                    html += `<a href="${url}" target="_blank" class="btn-download" style="margin: 5px; width: 100%; max-width: 400px;">⬇️ Download ${year} ${sub} Paper (Class ${cls.replace('class', '')})</a>`;
                }
            });

            if (html !== "") {
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="msg-info">No previous year papers are currently available for this selection.</div>`;
            }
        } catch (error) {
            console.error("Error fetching PYQ:", error);
            container.innerHTML = `<div class="msg-info" style="color: #ef4444; border-color: #ef4444;">Error loading paper. Please try again.</div>`;
        }
    };
</script>
</body>
</html>
