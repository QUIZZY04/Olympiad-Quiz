<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET | Live Exam Environment</title>
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true") {
          sessionStorage.setItem("redirectAfterLogin", window.location.href);
          window.location.replace("login.html");
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; width: 100%; }
        
        .header { background: #047857; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .header-title { font-size: 1.1rem; font-weight: bold; }
        .header-info { display: flex; align-items: center; gap: 20px; }
        .timer-box { font-size: 1.1rem; font-weight: bold; font-family: monospace; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .left-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ccc; overflow: hidden; min-width: 0; }
        .question-header { background: #f1f3f4; padding: 10px 20px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; color: #333; }
        .question-body { flex: 1; padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.6; color: #000; }
        
        .options-container { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .option-row { display: flex; align-items: flex-start; gap: 15px; cursor: pointer; padding: 12px 15px; border-radius: 6px; transition: 0.2s; border: 1px solid #d1d5db; width: 100%; background: #fff; }
        .option-row:hover { background: #ecfdf5; border-color: #10b981; }
        .option-row input { margin-top: 3px; cursor: pointer; transform: scale(1.2); flex-shrink: 0; }
        .option-row span { font-size: 15px; color: #111; line-height: 1.5; }
        
        .footer { background: #f1f3f4; padding: 12px 20px; border-top: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .footer-left { display: flex; gap: 10px; }
        .footer-right { display: flex; gap: 10px; }
        
        .btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; color: #333; transition: 0.2s; }
        .btn:hover { background: #e0e0e0; }
        .btn-primary { background: #047857; color: #fff; border-color: #047857; }
        .btn-primary:hover { background: #064e3b; }
        .btn-success { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-success:hover { background: #1d4ed8; }
        
        .right-panel { width: 320px; display: flex; flex-direction: column; background: #eef2f5; overflow: hidden; flex-shrink: 0; }
        .profile-section { display: flex; align-items: center; gap: 15px; padding: 15px; background: #fff; border-bottom: 1px solid #ccc; }
        .profile-img { width: 60px; height: 60px; background: #ecfdf5; color: #047857; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid #a7f3d0; }
        .profile-name { font-weight: bold; font-size: 14px; color: #333; }
        
        .legend-section { padding: 10px 15px; font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-bottom: 1px solid #ccc; background: #fff; color: #333; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        
        .palette-section { padding: 15px; flex: 1; overflow-y: auto; background: #eef2f5; }
        .palette-title { font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #333; }
        .palette-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .p-btn { width: 38px; height: 32px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; cursor: pointer; color: #333; position: relative; transition: 0.1s; }
        .p-btn:active { transform: scale(0.95); }
        
        .p-unseen { background: #f0f0f0; border-color: #ccc; }
        .p-not-answered { background: #b91c1c; color: #fff; border-color: #7f1d1d; border-radius: 4px 4px 15px 15px; }
        .p-answered { background: #047857; color: #fff; border-color: #064e3b; border-radius: 15px 15px 4px 4px; }
        .p-review { background: #6d28d9; color: #fff; border-color: #5b21b6; border-radius: 50%; width: 35px; height: 35px; }
        .p-answered-review { background: #6d28d9; color: #fff; border-color: #5b21b6; border-radius: 50%; width: 35px; height: 35px; position: relative; }
        .p-answered-review::after { content: ''; position: absolute; bottom: 0px; right: 0px; width: 10px; height: 10px; background: #047857; border-radius: 50%; border: 1px solid #fff; }

        .submit-section { padding: 15px; background: #fff; border-top: 1px solid #ccc; text-align: center; }

        @media (max-width: 768px) {
            body { height: auto; overflow-y: auto; display: block; }
            .main-container { flex-direction: column; height: auto; display: flex; }
            .left-panel { min-height: 50vh; }
            .right-panel { width: 100%; border-top: 2px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title" id="testTitle">NEET Mock Test</div>
    <div class="header-info">
        <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="window.location.href='neet.html'">Exit</button>
        <div>Time Left:</div>
        <div class="timer-box" id="timer">--:--:--</div>
    </div>
</div>

<div class="main-container">
    <div class="left-panel">
        <div class="question-header">
            <span id="qNumber">Question No. 1</span>
            <span style="color:#047857; font-weight:800;">Single Correct (+4, -1)</span>
        </div>
        <div class="question-body">
            <div id="qText">Loading question...</div>
            <div id="qImage" style="display:none; margin: 15px 0; text-align: center;"></div>
            <div id="optionsContainer" class="options-container"></div>
        </div>
        
        <div class="footer">
            <div class="footer-left">
                <button class="btn" onclick="markForReview()">Mark for Review & Next</button>
                <button class="btn" onclick="clearResponse()">Clear Response</button>
            </div>
            <div class="footer-right">
                <button class="btn" onclick="prevQuestion()"><< Back</button>
                <button class="btn btn-success" onclick="saveAndNext()">Save & Next</button>
            </div>
        </div>
    </div>
    
    <div class="right-panel">
        <div class="profile-section">
            <div class="profile-img">👤</div>
            <div class="profile-name" id="studentName">Candidate</div>
        </div>
        <div class="legend-section">
            <div class="legend-item"><div class="p-btn p-unseen" style="width:22px;height:22px;font-size:11px;" id="cntUnseen">0</div> Not Visited</div>
            <div class="legend-item"><div class="p-btn p-not-answered" style="width:22px;height:22px;font-size:11px;" id="cntNotAnswered">0</div> Not Answered</div>
            <div class="legend-item"><div class="p-btn p-answered" style="width:22px;height:22px;font-size:11px;" id="cntAnswered">0</div> Answered</div>
            <div class="legend-item"><div class="p-btn p-review" style="width:22px;height:22px;font-size:11px;" id="cntReview">0</div> Marked for Review</div>
            <div class="legend-item" style="grid-column: 1 / -1;"><div class="p-btn p-answered-review" style="width:22px;height:22px;font-size:11px;" id="cntAnsweredReview">0</div> Answered & Marked for Review</div>
        </div>
        <div class="palette-section">
            <div class="palette-title">Question Palette:</div>
            <div class="palette-grid" id="paletteGrid"></div>
        </div>
        <div class="submit-section">
            <button class="btn btn-primary" style="width: 100%; padding: 10px;" onclick="submitTest()">Submit Test</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({ apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", authDomain: "olympiad-portal-d2a5e.firebaseapp.com", projectId: "olympiad-portal-d2a5e" });
    const auth = getAuth(app);
    const db = getFirestore(app);

    let testData = null, currentQ = 0, selectedAnswers = [], visited = [], markedForReview = [], timeLeft = 0, timerInterval;

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            sessionStorage.setItem("redirectAfterLogin", window.location.href);
            window.location.replace("login.html");
            return;
        }
        
        const providerIds = user.providerData.map(p => p.providerId);
        const hasEmailOrGoogle = providerIds.includes("password") || providerIds.includes("google.com");
        const hasPhone = providerIds.includes("phone") || !!user.phoneNumber;
        const isAdmin = user.email && user.email.trim().toLowerCase() === "madhhu52@gmail.com";
        
        if ((!hasEmailOrGoogle || !hasPhone) && !isAdmin) {
            window.location.replace("signup.html?mode=completion");
            return;
        }
        document.getElementById("studentName").innerText = user.displayName || user.email.split('@')[0];
    });

    async function initTest() {
        const testId = new URLSearchParams(window.location.search).get('id');
        if (!testId) { alert("Invalid Test ID"); window.location.href = "neet.html"; return; }

        try {
            const docSnap = await getDoc(doc(db, "exam_tests", testId));
            if (!docSnap.exists()) throw new Error("Test not found");
            
            testData = docSnap.data();
            document.getElementById("testTitle").innerText = testData.title;
            
            selectedAnswers = new Array(testData.questions.length).fill(null);
            visited = new Array(testData.questions.length).fill(false);
            markedForReview = new Array(testData.questions.length).fill(false);
            timeLeft = testData.duration * 60;
            
            buildPalette();
            renderQuestion();
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(true); return; }
                timeLeft--;
                const h = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
                const m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById("timer").innerText = `${h}:${m}:${s}`;
            }, 1000);
        } catch(e) { alert("Failed to load test data: " + e.message); window.location.href = "neet.html"; }
    }

    function renderQuestion() {
        if (!testData || !testData.questions.length) return;
        visited[currentQ] = true;
        
        const q = testData.questions[currentQ];
        document.getElementById("qNumber").innerHTML = `Question No. ${currentQ + 1}`;
        document.getElementById("qText").innerHTML = q.question;
        
        const imgDiv = document.getElementById("qImage");
        imgDiv.innerHTML = "";
        if (q.image_url || q.image_name) {
            let imgData = (q.image_url || q.image_name).trim();
            if (imgData.toLowerCase().startsWith("<svg")) {
                try { imgData = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(imgData))); } catch(e) {}
            }
            const img = document.createElement("img");
            img.src = imgData;
            img.style.maxWidth = "100%";
            img.style.maxHeight = "300px";
            img.style.borderRadius = "8px";
            img.style.border = "1px solid #ccc";
            img.style.objectFit = "contain";
            imgDiv.appendChild(img);
            imgDiv.style.display = "block";
        } else {
            imgDiv.style.display = "none";
        }

        const container = document.getElementById("optionsContainer");
        container.innerHTML = "";
        
        (q.options || []).forEach((opt) => {
            if (!opt) return;
            const isChecked = selectedAnswers[currentQ] === opt;
            const label = document.createElement("label");
            label.className = "option-row";
            label.innerHTML = `<input type="radio" name="q_opt" value="${opt}" ${isChecked ? 'checked' : ''}><span>${opt}</span>`;
            
            label.querySelector("input").addEventListener("change", () => {
                selectedAnswers[currentQ] = opt;
                updatePalette();
            });
            container.appendChild(label);
        });
        updatePalette();
    }

    function buildPalette() {
        const grid = document.getElementById("paletteGrid");
        grid.innerHTML = "";
        testData.questions.forEach((_, i) => {
            const cell = document.createElement("div");
            cell.id = "pcell-" + i; cell.innerText = i + 1;
            cell.onclick = () => { currentQ = i; renderQuestion(); };
            grid.appendChild(cell);
        });
        updatePalette();
    }

    function updatePalette() {
        let u = 0, na = 0, a = 0, r = 0, ar = 0;
        testData.questions.forEach((_, i) => {
            const cell = document.getElementById("pcell-" + i);
            if (!cell) return;
            let cls = "p-btn ";
            const isAns = selectedAnswers[i] !== null, isMark = markedForReview[i];
            if (!visited[i]) { cls += "p-unseen"; u++; }
            else if (isAns && isMark) { cls += "p-answered-review"; ar++; }
            else if (isAns) { cls += "p-answered"; a++; }
            else if (isMark) { cls += "p-review"; r++; }
            else { cls += "p-not-answered"; na++; }
            cell.className = cls;
        });
        document.getElementById("cntUnseen").innerText = u; document.getElementById("cntNotAnswered").innerText = na;
        document.getElementById("cntAnswered").innerText = a; document.getElementById("cntReview").innerText = r; document.getElementById("cntAnsweredReview").innerText = ar;
    }

    window.saveAndNext = () => { markedForReview[currentQ] = false; if (currentQ < testData.questions.length - 1) { currentQ++; renderQuestion(); } else { updatePalette(); } };
    window.clearResponse = () => { selectedAnswers[currentQ] = null; renderQuestion(); };
    window.markForReview = () => { markedForReview[currentQ] = true; if (currentQ < testData.questions.length - 1) { currentQ++; renderQuestion(); } else { updatePalette(); } };
    window.prevQuestion = () => { if (currentQ > 0) { currentQ--; renderQuestion(); } };
    
    window.submitTest = (auto = false) => {
        if (!auto && !confirm(`You have answered ${selectedAnswers.filter(a => a !== null).length} out of ${testData.questions.length} questions.\n\nSubmit the test?`)) return;
        clearInterval(timerInterval);
        
        const mappedQuestions = testData.questions.map(q => ({
            questionText: q.question, options: q.options, correctAnswers: [q.answer], explanation: q.explanation || "Correct answer marked above.", type: "single"
        }));
        
        const resultObj = {
            testTitle: testData.title, subject: testData.subject || "Full Syllabus", totalMarks: mappedQuestions.length * 4,
            questions: mappedQuestions, userAnswers: selectedAnswers.map(ans => ans ? [ans] : [])
        };
        localStorage.setItem("jeeQuizResult", JSON.stringify(resultObj));
        window.location.replace("jee-result.html");
    };

    initTest();
</script>
</body>
</html>
