<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; --bg-accent: #1e293b; --gold: #fbbf24;
            --text-white: #f8fafc; --text-gray: #94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-accent) 100%);
            color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        #particles-js { position:fixed; width:100%; height:100%; top:0; left:0; z-index:-1; }
        nav { display:flex; padding:20px 8%; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); }
        .logo { font-size: 26px; font-weight: 700; color: var(--text-white); text-decoration: none; }
        .logo span { color: var(--gold); }
        .wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 20px; width: 100%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-gray); }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-dark); color: white; outline: none;
        }
        .btn {
            width: 100%; padding: 14px; background: var(--gold); color: var(--bg-dark);
            border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .google-btn {
            background: white; color: #444; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .links { margin-top: 20px; font-size: 13px; color: var(--text-gray); }
        .links a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

<div id="particles-js"></div>
<nav><a href="index.html" class="logo">Olympiad<span>Portal</span></a></nav>

<div class="wrapper">
    <div class="card">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-gray); font-size: 14px; margin-bottom: 25px;">Sign in to access your dashboard.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginBtn" class="btn">Sign In</button>
        </form>

        <button id="googleBtn" class="btn google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18">
            Sign in with Google
        </button>

        <div class="links">
            <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            <p style="margin-top: 10px;"><a href="forgot-password.html">Forgot Password?</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
        messagingSenderId: "341855557503",
        appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Ensures session stays active on refresh
    setPersistence(auth, browserLocalPersistence);

    // NORMAL REDIRECTION: Everyone goes to index.html
    const handleRedirection = () => {
        alert("Login Successful! Redirecting to Dashboard...");
        window.location.href = "index.html";
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        signInWithEmailAndPassword(auth, email, password)
            .then(() => handleRedirection())
            .catch((err) => alert("Login Error: " + err.message));
    });

    document.getElementById('googleBtn').addEventListener('click', () => {
        signInWithPopup(auth, provider)
            .then(() => handleRedirection())
            .catch((err) => alert("Google Sign-In Error: " + err.message));
    });

    particlesJS("particles-js", {
        particles: {
            number: { value: 60 }, color: { value: "#fbbf24" },
            opacity: { value: 0.3 }, size: { value: 2 },
            line_linked: { enable: true, distance: 150, color: "#fbbf24", opacity: 0.15, width: 1 },
            move: { enable: true, speed: 1.2 }
        }
    });
</script>
</body>
</html>
