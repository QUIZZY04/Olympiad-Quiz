<body>

<!-- ONLY SCRIPT BELOW IS UPDATED -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth,onAuthStateChanged,signInWithEmailAndPassword,
    sendPasswordResetEmail,updatePassword,reauthenticateWithCredential,
    EmailAuthProvider,signOut,RecaptchaVerifier,
    signInWithPhoneNumber,linkWithPhoneNumber,
    signInWithPopup,GoogleAuthProvider 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const redirectUrl = sessionStorage.getItem("redirectAfterLogin") || "dashboard.html";

/* =========================
   AUTH STATE FIXED
========================= */
onAuthStateChanged(auth, async (user) => {
    if (!user) return;

    try {
        const userDoc = await getDoc(doc(db, "users", user.uid));

        if (userDoc.exists() && userDoc.data().phone) {
            localStorage.setItem("isLoggedIn", "true");
            window.location.replace(redirectUrl);
        } else {
            document.getElementById('linkPhoneModal').style.display = 'flex';

            if (!window.linkRecaptchaVerifier) {
                window.linkRecaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-link', {
                    size: 'invisible'
                });
                await window.linkRecaptchaVerifier.render();
            }
        }

    } catch (e) {
        console.error(e);
    }
});

/* =========================
   EMAIL LOGIN
========================= */
loginForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    try {
        await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
    } catch(err) {
        alert(err.message);
    }
});

/* =========================
   GOOGLE LOGIN
========================= */
googleSignInBtn.onclick = async () => {
    try {
        const res = await signInWithPopup(auth, provider);
        const user = res.user;

        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
            await setDoc(doc(db, "users", user.uid), {
                email: user.email,
                createdAt: new Date()
            });
        }

    } catch (err) {
        alert(err.message);
    }
};

/* =========================
   PHONE LOGIN
========================= */
let confirmationResult;

phoneForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    let phone = phoneNumber.value.trim();
    if (!phone.startsWith('+')) phone = "+91" + phone;

    if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            size: 'invisible'
        });
        await window.recaptchaVerifier.render();
    }

    try {
        confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);

        phoneForm.classList.add("hidden");
        otpForm.classList.remove("hidden");

    } catch (err) {
        alert("OTP Error: " + err.message);
    }
});

/* VERIFY OTP */
otpForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
        const result = await confirmationResult.confirm(otpCode.value);
        const user = result.user;

        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
            await setDoc(doc(db, "users", user.uid), {
                phone: user.phoneNumber,
                createdAt: new Date()
            });
        }

        window.location.href = redirectUrl;

    } catch {
        alert("Invalid OTP");
    }
});

/* =========================
   LINK PHONE
========================= */
let linkConfirmationResult;

linkPhoneForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    let phone = linkPhoneNumber.value.trim();
    if (!phone.startsWith('+')) phone = "+91" + phone;

    if (!window.linkRecaptchaVerifier) {
        window.linkRecaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-link', {
            size: 'invisible'
        });
        await window.linkRecaptchaVerifier.render();
    }

    try {
        linkConfirmationResult = await linkWithPhoneNumber(auth.currentUser, phone, window.linkRecaptchaVerifier);

        linkPhoneForm.classList.add("hidden");
        linkOtpForm.classList.remove("hidden");

    } catch (err) {
        alert(err.message);
    }
});

/* VERIFY LINK OTP */
linkOtpForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
        const result = await linkConfirmationResult.confirm(linkOtpCode.value);

        await setDoc(doc(db, "users", auth.currentUser.uid), {
            phone: result.user.phoneNumber
        }, { merge: true });

        window.location.href = redirectUrl;

    } catch {
        alert("Invalid OTP");
    }
});
</script>

</body>
</html>
