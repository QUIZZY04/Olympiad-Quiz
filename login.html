<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Olympiad Portal | Student Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #FFD700;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --brand: #4f46e5;
      --accent: #8b5cf6;
      --danger: #ef4444;
      --success: #10b981;
    }
    body { background: var(--bg); font-family: 'Inter', sans-serif; }
    .hidden { display:none; }
    #recaptcha-container,#link-recaptcha-container { display:none; }
  </style>
</head>

<body>

<div class="container">
<div class="login-box">

<div id="loginSection">
<h1>Welcome in Olympiad portal</h1>

<form id="loginForm">
<input type="email" id="loginEmail" placeholder="Email Address" required>
<input type="password" id="loginPassword" placeholder="Password" required>
<button type="submit" class="main-btn">Sign In</button>
</form>

<button id="googleSignInBtn" class="google-btn">Sign in with Google</button>

<button onclick="toggleView('otpSection')" class="google-btn">
📱 Sign in with Phone (OTP)
</button>
</div>

<div id="otpSection" class="hidden">
<h2>Phone Login</h2>
<div id="recaptcha-container"></div>

<form id="phoneForm">
<input type="tel" id="phoneNumber" placeholder="+91..." required>
<button type="submit" class="main-btn">Send OTP</button>
</form>

<form id="verifyOtpForm" class="hidden">
<input type="text" id="otpCode" placeholder="Enter OTP">
<button type="submit" class="main-btn">Verify</button>
</form>

<button onclick="toggleView('loginSection')">Back</button>
</div>

<div id="linkPhoneSection" class="hidden">
<h2>Verify Mobile</h2>
<div id="link-recaptcha-container"></div>

<form id="linkPhoneForm">
<input type="tel" id="linkPhoneNumber" placeholder="+91..." required>
<button type="submit" class="main-btn">Send OTP</button>
</form>

<form id="verifyLinkOtpForm" class="hidden">
<input type="text" id="linkOtpCode" placeholder="Enter OTP">
<button type="submit" class="main-btn">Verify</button>
</form>
</div>

</div>
</div>

<script>
function toggleView(id){
document.querySelectorAll('.login-box > div').forEach(d=>d.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,onAuthStateChanged,signInWithEmailAndPassword,
signInWithPopup,GoogleAuthProvider,
RecaptchaVerifier,signInWithPhoneNumber,
linkWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore,doc,getDoc,setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const redirectUrl="dashboard.html";
let isHandlingLogin=false;

/* AUTH STATE */
onAuthStateChanged(auth, (user)=>{
if(user && !isHandlingLogin){
if(!user.phoneNumber){
alert("Please verify mobile (one-time)");
toggleView("linkPhoneSection");
}else{
window.location=redirectUrl;
}
}
});

/* EMAIL LOGIN */
loginForm.addEventListener("submit", async(e)=>{
e.preventDefault();
isHandlingLogin=true;

try{
const cred=await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value);

if(!cred.user.phoneNumber){
alert("Verify mobile to continue");
toggleView("linkPhoneSection");
}else{
window.location=redirectUrl;
}

}catch(err){
alert(err.code+"\n"+err.message);
}

isHandlingLogin=false;
});

/* GOOGLE LOGIN */
googleSignInBtn.onclick=async ()=>{
isHandlingLogin=true;

try{
const res=await signInWithPopup(auth,provider);
const user=res.user;

const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()){
await setDoc(doc(db,"users",user.uid),{email:user.email});
}

if(!user.phoneNumber){
alert("Verify mobile to continue");
toggleView("linkPhoneSection");
}else{
window.location=redirectUrl;
}

}catch(e){alert(e.message);}

isHandlingLogin=false;
};

/* PHONE LOGIN */
phoneForm.addEventListener("submit", async(e)=>{
e.preventDefault();

let phone=phoneNumber.value;
if(!phone.startsWith("+")) phone="+91"+phone;

if(!window.recaptchaVerifier){
window.recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"invisible"});
}

try{
const res=await signInWithPhoneNumber(auth,phone,window.recaptchaVerifier);
window.confirmationResult=res;

phoneForm.classList.add("hidden");
verifyOtpForm.classList.remove("hidden");

}catch(err){
alert(err.message);
}
});

/* VERIFY OTP LOGIN */
verifyOtpForm.addEventListener("submit", async(e)=>{
e.preventDefault();
try{
await window.confirmationResult.confirm(otpCode.value);
window.location=redirectUrl;
}catch(err){
alert("Invalid OTP");
}
});

/* LINK PHONE */
linkPhoneForm.addEventListener("submit", async(e)=>{
e.preventDefault();

let phone=linkPhoneNumber.value;
if(!phone.startsWith("+")) phone="+91"+phone;

if(!window.linkRecaptchaVerifier){
window.linkRecaptchaVerifier=new RecaptchaVerifier(auth,"link-recaptcha-container",{size:"invisible"});
}

try{
const res=await linkWithPhoneNumber(auth.currentUser,phone,window.linkRecaptchaVerifier);
window.linkConfirmationResult=res;

linkPhoneForm.classList.add("hidden");
verifyLinkOtpForm.classList.remove("hidden");

}catch(err){
alert(err.message);
}
});

/* VERIFY LINK OTP */
verifyLinkOtpForm.addEventListener("submit", async(e)=>{
e.preventDefault();

try{
const res=await window.linkConfirmationResult.confirm(linkOtpCode.value);

await setDoc(doc(db,"users",res.user.uid),{
phoneNumber:res.user.phoneNumber
},{merge:true});

alert("Mobile verified successfully!");
window.location=redirectUrl;

}catch(err){
alert("Invalid OTP");
}
});
</script>

</body>
</html>
