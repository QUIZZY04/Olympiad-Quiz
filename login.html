<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: Inter; background:#FFD700; display:flex; justify-content:center; align-items:center; height:100vh;}
.box { background:#fff; padding:30px; border-radius:12px; width:320px; text-align:center;}
input,button { width:100%; padding:10px; margin:8px 0;}
.hidden{display:none;}
#recaptcha-container,#link-recaptcha-container{display:none;}
</style>
</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="loginSection">
<h2>Login</h2>
<form id="loginForm">
<input type="email" id="loginEmail" placeholder="Email" required>
<input type="password" id="loginPassword" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<button id="googleSignInBtn">Google Login</button>
<button onclick="show('otpSection')">Login with OTP</button>
</div>

<!-- OTP LOGIN -->
<div id="otpSection" class="hidden">
<h3>Phone Login</h3>
<div id="recaptcha-container"></div>

<form id="phoneForm">
<input type="text" id="phoneNumber" placeholder="+91..." required>
<button>Send OTP</button>
</form>

<form id="verifyOtpForm" class="hidden">
<input type="text" id="otpCode" placeholder="OTP">
<button>Verify</button>
</form>

<button onclick="show('loginSection')">Back</button>
</div>

<!-- LINK PHONE -->
<div id="linkPhoneSection" class="hidden">
<h3>Verify Mobile</h3>
<div id="link-recaptcha-container"></div>

<form id="linkPhoneForm">
<input type="text" id="linkPhoneNumber" placeholder="+91..." required>
<button>Send OTP</button>
</form>

<form id="verifyLinkOtpForm" class="hidden">
<input type="text" id="linkOtpCode" placeholder="OTP">
<button>Verify</button>
</form>
</div>

</div>

<script>
function show(id){
document.querySelectorAll(".box > div").forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,onAuthStateChanged,signInWithEmailAndPassword,
signInWithPopup,GoogleAuthProvider,
RecaptchaVerifier,signInWithPhoneNumber,
linkWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore,doc,getDoc,setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 YOUR CONFIG */
const firebaseConfig = {
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const redirectUrl="dashboard.html";
let lastOtpTime = 0;

/* ===============================
   AUTH STATE
================================ */
onAuthStateChanged(auth, async (user)=>{
if(user){
if(!user.phoneNumber){
alert("Mobile verification required (one-time)");
show("linkPhoneSection");
}else{
window.location=redirectUrl;
}
}
});

/* ===============================
   EMAIL LOGIN
================================ */
loginForm.addEventListener("submit", async(e)=>{
e.preventDefault();
try{
const cred=await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value);

if(!cred.user.phoneNumber){
alert("Verify mobile to continue");
show("linkPhoneSection");
}else{
window.location=redirectUrl;
}

}catch(err){
alert(err.code+"\n"+err.message);
}
});

/* ===============================
   GOOGLE LOGIN
================================ */
googleSignInBtn.onclick=async ()=>{
try{
const res=await signInWithPopup(auth,provider);
const user=res.user;

const snap=await getDoc(doc(db,"users",user.uid));
if(!snap.exists()){
await setDoc(doc(db,"users",user.uid),{email:user.email});
}

if(!user.phoneNumber){
alert("Verify mobile to continue");
show("linkPhoneSection");
}else{
window.location=redirectUrl;
}

}catch(e){alert(e.message);}
};

/* ===============================
   PHONE LOGIN (INVISIBLE CAPTCHA)
================================ */
phoneForm.addEventListener("submit", async(e)=>{
e.preventDefault();

if(Date.now()-lastOtpTime<30000){
alert("Wait before requesting another OTP");
return;
}
lastOtpTime=Date.now();

let phone=phoneNumber.value;
if(!phone.startsWith("+")) phone="+91"+phone;

if(!window.recaptchaVerifier){
window.recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha-container",{
size:"invisible"
});
}

try{
const res=await signInWithPhoneNumber(auth,phone,window.recaptchaVerifier);
window.confirmationResult=res;

phoneForm.classList.add("hidden");
verifyOtpForm.classList.remove("hidden");

}catch(err){
alert(err.message);
}
});

/* VERIFY OTP LOGIN */
verifyOtpForm.addEventListener("submit", async(e)=>{
e.preventDefault();
try{
await window.confirmationResult.confirm(otpCode.value);
window.location=redirectUrl;
}catch(err){
alert("Invalid OTP");
}
});

/* ===============================
   LINK PHONE (INVISIBLE CAPTCHA)
================================ */
linkPhoneForm.addEventListener("submit", async(e)=>{
e.preventDefault();

let phone=linkPhoneNumber.value;
if(!phone.startsWith("+")) phone="+91"+phone;

if(!window.linkRecaptchaVerifier){
window.linkRecaptchaVerifier=new RecaptchaVerifier(auth,"link-recaptcha-container",{
size:"invisible"
});
}

try{
const res=await linkWithPhoneNumber(auth.currentUser,phone,window.linkRecaptchaVerifier);
window.linkConfirmationResult=res;

linkPhoneForm.classList.add("hidden");
verifyLinkOtpForm.classList.remove("hidden");

}catch(err){
alert(err.message);
}
});

/* VERIFY LINK OTP */
verifyLinkOtpForm.addEventListener("submit", async(e)=>{
e.preventDefault();

try{
const res=await window.linkConfirmationResult.confirm(linkOtpCode.value);

await setDoc(doc(db,"users",res.user.uid),{
phoneNumber:res.user.phoneNumber
},{merge:true});

alert("Mobile verified successfully!");
window.location=redirectUrl;

}catch(err){
alert("Invalid OTP");
}
});

</script>

</body>
</html>
