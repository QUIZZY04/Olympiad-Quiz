<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<title>Dashboard - Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root {
--bg:#0f172a;
--surface:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--border:#334155;
--amber:#f59e0b;
--danger:#ef4444;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
flex-direction:column;
min-height:100vh;
}

/* NAVIGATION */

nav{
background:var(--surface);
border-bottom:2px solid var(--border);
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000;
flex-wrap:wrap;
}

.brand{
font-size:22px;
font-weight:800;
color:var(--amber);
text-decoration:none;
}

.nav-links{
display:flex;
gap:12px;
align-items:center;
}

.nav-links a{
color:#ffffff;
text-decoration:none;
font-size:11px;
font-weight:800;
text-transform:uppercase;
letter-spacing:0.5px;
}

.nav-links a.active{
color:var(--amber);
}

/* MAIN CONTENT */

.container{
width:95%;
max-width:1200px;
margin:20px auto;
padding:0 10px;
flex:1;
}

/* GRADE SELECTOR */

.class-selector-wrap{
background:rgba(245,158,11,0.05);
border:1px dashed var(--amber);
padding:15px;
border-radius:12px;
margin-bottom:25px;
display:flex;
align-items:center;
gap:15px;
}

label{
font-weight:700;
color:var(--amber);
font-size:12px;
}

select{
background:var(--bg);
color:white;
border:1px solid var(--border);
padding:10px;
border-radius:8px;
flex:1;
outline:none;
cursor:pointer;
}

/* SUBJECT CARDS */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:16px;
padding:25px;
cursor:pointer;
transition:0.2s;
}

.card:hover{
border-color:var(--amber);
transform:translateY(-3px);
}

.card h3{
color:var(--amber);
margin-bottom:10px;
font-size:18px;
}

.card p{
color:var(--muted);
font-size:13px;
margin-bottom:20px;
line-height:1.4;
}

.btn-start{
background:var(--amber);
color:#000;
border:none;
padding:12px;
border-radius:8px;
font-weight:800;
width:100%;
cursor:pointer;
text-transform:uppercase;
font-size:12px;
}

/* INSTRUCTIONS */

.instructions-section{
background:var(--surface);
border:1px solid var(--border);
border-radius:16px;
padding:25px;
margin:20px 0 60px 0;
display:block !important;
}

.instructions-section h2{
color:var(--amber);
margin-bottom:25px;
font-size:20px;
font-weight:800;
border-bottom:1px solid var(--border);
padding-bottom:10px;
}

.ins-grid{
display:grid;
grid-template-columns:1fr;
gap:25px;
}

.ins-item{
display:flex;
gap:15px;
align-items:flex-start;
}

.ins-icon{
background:rgba(245,158,11,0.1);
color:var(--amber);
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
flex-shrink:0;
font-weight:800;
font-size:14px;
}

.ins-text{
font-size:14px;
color:var(--muted);
line-height:1.6;
}

.ins-text strong{
color:var(--text);
display:block;
margin-bottom:4px;
font-size:15px;
}

footer{
text-align:center;
padding:25px;
background:#020617;
border-top:1px solid var(--border);
color:var(--muted);
font-size:12px;
}
</style>
</head>

<body>

<nav>

<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>

<main class="container">

<div class="class-selector-wrap">

<option value="class7">Grade 7</option>
<option value="class8">Grade 8</option>

</div>

</main>

</body>
</html>
