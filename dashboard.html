<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dashboard - Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
:root {
--bg:#020617;
--surface-champ:#1e293b;
--surface-practice:#0f172a;
--card-bg:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--border:#334155;
--amber:#f59e0b;
--danger:#ef4444;
--green:#22c55e;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
flex-direction:column;
min-height:100vh
}

nav{
background:var(--surface-champ);
border-bottom:2px solid var(--border);
padding:12px 5%;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000
}

.brand{
font-size:20px;
font-weight:800;
color:var(--amber);
text-decoration:none
}

.nav-links{
display:flex;
gap:12px;
align-items:center
}

.nav-links a{
color:#fff;
text-decoration:none;
font-size:11px;
font-weight:800;
text-transform:uppercase
}

.container{
width:98%;
max-width:1400px;
margin:20px auto;
padding:0 10px;
flex:1
}

/* CHAMPIONSHIP */

.championship-section{
background:var(--surface-champ);
border:3px solid var(--amber);
border-radius:12px;
margin:0 auto 40px auto;
width:60%;
min-width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
display:flex;
overflow:hidden
}

.champ-left{
flex:1.2;
padding:25px;
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
align-items:center;
text-align:center
}

.champ-right{
flex:1.5;
padding:25px;
background:rgba(15,23,42,0.4)
}

.timer-clock{
font-size:22px;
font-weight:800;
color:var(--amber);
font-family:monospace
}

.btn-action{
width:100%;
max-width:250px;
padding:15px;
border-radius:10px;
font-weight:800;
text-transform:uppercase;
font-size:13px;
border:none;
cursor:pointer
}

.btn-buy{
background:var(--amber);
color:#000
}

/* PRACTICE */

.practice-container{
background:var(--surface-practice);
padding:30px;
border-radius:16px;
border:1px solid var(--border);
margin-top:20px
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:40px
}

.card{
background:var(--card-bg);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
cursor:pointer;
display:flex;
flex-direction:column;
justify-content:space-between
}

.btn-start{
background:var(--amber);
color:#000;
border:none;
padding:10px;
border-radius:6px;
font-weight:800;
width:100%;
text-transform:uppercase;
font-size:11px
}

@media(max-width:768px){
.championship-section{width:95%;flex-direction:column}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<nav>
<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="dashboard.html" style="color:var(--amber)">Dashboard</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="quiz.html">Take Quiz</a>
<a id="adminTab" href="admin.html" style="display:none;color:var(--green)">Admin</a>
<a onclick="logout()" style="color:var(--danger);cursor:pointer">Logout</a>
</div>
</nav>

<main class="container">

<div class="championship-section">

<div class="champ-left">

<h2>Science Weekly Quiz 2</h2>

<div style="margin:10px 0">
<label style="font-size:10px;font-weight:800;color:var(--muted)">GRADE:</label>

<select id="champGradeSelect" style="background:#0f172a;color:var(--amber);border:1px solid var(--amber);padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700">
<option value="class5">Grade 5</option>
<option value="class6" selected>Grade 6</option>
<option value="class7">Grade 7</option>
<option value="class8">Grade 8</option>
<option value="class9">Grade 9</option>
<option value="class10">Grade 10</option>
</select>
</div>

<span id="champClassMention">For Class 6th</span>

<div style="background:#020617;padding:12px 20px;border-radius:10px;border:1px solid var(--border);margin:15px 0">
<p id="champTimer" class="timer-clock">00:00:00</p>
</div>

<button id="btnChamp" class="btn-action btn-buy" onclick="redirectToPayment()">
Unlock Test (₹69)
</button>

</div>

<div class="champ-right">

<b style="color:var(--amber)">Schedule & Info</b>

<ul style="font-size:12px;margin-top:10px">
<li>📅 Date: March 15th 2026</li>
<li>⏰ Time: 10:00 AM IST</li>
<li>💰 Price: ₹69</li>
</ul>

</div>

</div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let activeSession=null;

onAuthStateChanged(auth,async(user)=>{

if(!user){
window.location.href="login.html";
return;
}

fetchSession();

});

async function fetchSession(){

const sessId="2026_03_15_C6_SCI";

const snap=await getDoc(doc(db,"test_sessions",sessId));

if(!snap.exists())return;

activeSession={...snap.data(),id:snap.id};

checkPurchase();

}

async function checkPurchase(){

const uid=auth.currentUser.uid;

const purchaseRef=doc(db,"users",uid,"purchases",activeSession.id);

const purchaseSnap=await getDoc(purchaseRef);

const btn=document.getElementById("btnChamp");

if(purchaseSnap.exists()){
btn.innerText="Test Unlocked";
btn.disabled=true;
btn.style.opacity="0.7";
}

}

window.redirectToPayment=async function(){

const uid=auth.currentUser.uid;

const purchaseRef=doc(db,"users",uid,"purchases",activeSession.id);

const purchaseSnap=await getDoc(purchaseRef);

if(purchaseSnap.exists()){
alert("You already unlocked this quiz.");
return;
}

localStorage.setItem("activeSessionId",activeSession.id);

window.open("https://rzp.io/rzp/7taxCnr","_blank");

};

window.logout=()=>{
signOut(auth).then(()=>window.location.href="login.html");
};

</script>

</body>
</html>
