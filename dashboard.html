<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --brand: #38bdf8;
      --amber: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    /* Fix: Remove height: 100% to allow natural scrolling */
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .utility-nav {
      background: #020617; padding: 12px 60px; display: flex;
      justify-content: flex-end; gap: 40px; border-bottom: 1px solid var(--border);
    }
    .utility-nav a { 
        color: #ffffff; text-decoration: none; font-size: 13px; 
        font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    }
    .utility-nav a.active { color: var(--amber) !important; }

    header.top-bar {
      background: var(--surface); border-bottom: 2px solid var(--border);
      padding: 15px 60px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 1000;
    }
    .brand { font-size: 20px; font-weight: 800; color: var(--amber); text-decoration: none; }
    #userWelcome { font-size: 14px; font-weight: 700; color: var(--brand); }

    /* Fix: Ensure container doesn't get squashed */
    .container { max-width: 1200px; width: 95%; margin: 30px auto; padding: 0 20px; }
    
    .class-selector-wrap { background: rgba(56, 189, 248, 0.05); border: 1px dashed var(--brand); padding: 15px 20px; border-radius: 12px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
    select { background: var(--bg); color: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; transition: 0.2s; cursor: pointer; }
    .card:hover { border-color: var(--brand); transform: translateY(-3px); }
    .btn-start { background: var(--brand); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 800; text-transform: uppercase; width: 100%; cursor: pointer; }

    .instructions-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-top: 40px; }
    footer { text-align: center; padding: 20px; background: #020617; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <nav class="utility-nav">
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
  </nav>
  <header class="top-bar">
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div id="userWelcome">Welcome, Student</div>
  </header>
  <main class="container">
    <h1>Student Dashboard</h1>
    <div class="class-selector-wrap">
      <label style="font-weight:700; color:var(--brand);">SELECT GRADE:</label>
      <select id="classSelect">
        <option value="class6">Grade 6</option>
        <option value="class8">Grade 8</option>
      </select>
    </div>
    <div class="grid">
      <div class="card" onclick="startQuiz('maths')"><h3>Mathematics</h3><p style="color:var(--muted); font-size:13px; margin: 10px 0;">Advanced logic problems.</p><button class="btn-start">Start Quiz</button></div>
      <div class="card" onclick="startQuiz('science')"><h3>Science</h3><p style="color:var(--muted); font-size:13px; margin: 10px 0;">Physics and Biology.</p><button class="btn-start">Start Quiz</button></div>
    </div>
    <div class="instructions-section">
        <h2 style="color:var(--amber);">📝 Quiz Instructions</h2>
        <p style="color:var(--muted); font-size:14px; margin-top:10px;">Each quiz lasts 30 minutes and auto-submits. Use "Save & Next" to record answers.</p>
    </div>
  </main>
  <footer>&copy; 2026 Olympiad Portal</footer>
  <script>
    function startQuiz(s){localStorage.setItem("selectedClass",document.getElementById("classSelect").value);localStorage.setItem("selectedSubject",s);window.location.href="quiz.html"}
    function logout(){if(confirm("Logout?"))window.location.href="login.html"}
  </script>
</body>
</html>
