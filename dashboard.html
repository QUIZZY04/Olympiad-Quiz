<style>
/* ... Keep existing CSS ... */

/* NEW: HIGH-VISIBILITY WEEKLY CHAMPIONSHIP AREA */
.championship-section {
    background: #1e293b; /* Distinct from the main page background */
    border: 2px solid var(--amber);
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 40px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    display: none; /* Shown by JS if session exists */
}

.champ-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 20px;
}

.champ-title-area h2 {
    font-size: 26px;
    color: #fff;
    margin-bottom: 8px;
    font-weight: 800;
}

.champ-details-bar {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.detail-tag {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}

.timer-container {
    background: #020617;
    padding: 15px 25px;
    border-radius: 12px;
    border: 1px solid var(--border);
    text-align: center;
}

.timer-clock {
    font-size: 24px;
    font-weight: 800;
    color: var(--amber);
    font-family: monospace;
}

/* DYNAMIC BUTTONS */
.btn-action {
    width: 100%;
    padding: 20px;
    border-radius: 12px;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 15px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 1px;
}

.btn-buy { background: var(--amber); color: #000; }
.btn-buy:hover { background: #fbbf24; transform: scale(1.01); }
.btn-locked { background: var(--surface); color: var(--muted); cursor: not-allowed; }
.btn-live { background: var(--green); color: #fff; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }

</style>

<main class="container">

    <div id="champSection" class="championship-section">
        <div class="champ-header">
            <div class="champ-title-area">
                <h2 id="champTitle">Weekly Championship</h2>
                <div class="champ-details-bar">
                    <span class="detail-tag">📅 Date: March 15, 2026</span>
                    <span class="detail-tag">⏰ Time: 10:00 AM</span>
                    <span id="champPriceTag" class="detail-tag">💰 Fee: ₹99</span>
                    <span id="regStatus" style="color:var(--green); font-size:11px; display:none; align-self:center;">✔ REGISTERED</span>
                </div>
            </div>
            
            <div class="timer-container">
                <p style="font-size:10px; color:var(--muted); margin-bottom:5px; font-weight:700;">STARTS IN</p>
                <p id="champTimer" class="timer-clock">00:00:00</p>
            </div>
        </div>

        <div id="actionArea">
            <button id="btnChamp" class="btn-action btn-buy" onclick="handleEventClick()">
                UNLOCK & REGISTER NOW
            </button>
        </div>
    </div>

    </main>

<script type="module">
// ... Firebase Imports (Ensure getFirestore, doc, getDoc are present) ...

async function fetchSession(grade) {
    const classNum = grade.replace('class', '');
    const sessId = `2026_03_15_C${classNum}_SCI`; // Match Admin Panel IDs
    
    const docRef = doc(db, "test_sessions", sessId);
    const snap = await getDoc(docRef);

    if (snap.exists()) {
        const data = snap.data();
        activeSession = { ...data, id: snap.id };
        
        document.getElementById("champSection").style.display = "block";
        document.getElementById("champTitle").innerText = data.title;
        document.getElementById("champPriceTag").innerText = `💰 Fee: ₹${data.price}`;
        
        // Mock payment check - normally you'd check a "purchases" collection
        const isBought = localStorage.getItem(`paid_${sessId}`) === "true";
        refreshButton(data.startTime.toDate(), isBought);
    } else {
        document.getElementById("champSection").style.display = "none";
    }
}

function refreshButton(startTime, isBought) {
    const btn = document.getElementById("btnChamp");
    const regLabel = document.getElementById("regStatus");
    const now = new Date().getTime();
    const diff = startTime - now;

    if (!isBought) {
        btn.innerText = `UNLOCK TEST (₹${activeSession.price})`;
        btn.className = "btn-action btn-buy";
    } else {
        regLabel.style.display = "block";
        if (diff > 0) {
            btn.innerText = "YOU ARE REGISTERED - WAITING FOR START TIME";
            btn.className = "btn-action btn-locked";
            btn.disabled = true;
        } else {
            btn.innerText = "JOIN CHAMPIONSHIP NOW";
            btn.className = "btn-action btn-live";
            btn.disabled = false;
        }
    }
    startLiveTimer(startTime);
}

window.handleEventClick = function() {
    if (localStorage.getItem(`paid_${activeSession.id}`) !== "true") {
        if (confirm(`Register for this championship for ₹${activeSession.price}?`)) {
            localStorage.setItem(`paid_${activeSession.id}`, "true");
            alert("Registration Successful!");
            location.reload();
        }
    } else {
        localStorage.setItem("activeSessionId", activeSession.id);
        localStorage.setItem("isChampionship", "true");
        window.location.href = "quiz.html";
    }
};

// ... Rest of the script logic ...
</script>
