<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7631964396609524"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Performance Analytics & Dashboard | Olympiad Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.container { width: 95%; max-width: 1200px; margin: 30px auto; }

/* --- Analytics Header --- */
.header-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card {
  background: var(--surface);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--border);
  text-align: center;
  transition: transform 0.3s ease;
  box-shadow: var(--shadow-sm);
}
.stat-card:hover { transform: translateY(-5px); border-color: var(--brand); }
.stat-val { display: block; font-size: 28px; font-weight: 800; color: var(--brand); }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

/* --- Main Content Grid --- */
.main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

.chart-panel {
  background: var(--surface);
  padding: 25px;
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
}

.topic-list { list-style: none; padding: 0; margin-top: 20px; }
.topic-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 15px;
  background: var(--bg);
  border-radius: 12px;
  margin-bottom: 10px;
  border: 1px solid transparent;
}
.topic-item:hover { border-color: var(--border); background: rgba(255,255,255,0.05); }

.progress-bar { height: 8px; background: var(--border); border-radius: 10px; width: 100px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--brand); border-radius: 10px; }

@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
  <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div class="nav-important">
        <a href="dashboard.html">Dash</a>
        <a onclick="logout()" style="cursor:pointer;">Logout</a>
    </div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="mock.html">Mock Tests</a>
    <a href="chapterwise.html">Chapterwise</a>
    <a href="live.html">Live Arena</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="study.html">Study Material</a>
    <a href="analytics.html" class="active">Analytics</a>
    <div class="nav-actions">
        <a id="adminTab" href="admin.html" class="login-link" style="display:none; color:var(--success);">Admin</a>
        <a onclick="logout()" class="login-link" style="color: var(--danger); cursor: pointer;">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="header-grid">
    <div class="stat-card">
      <span class="stat-val" id="avgScore">0%</span>
      <span class="stat-label">Average Score</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="testsTaken">0</span>
      <span class="stat-label">Tests Completed</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" style="color: var(--success);" id="highestScore">0%</span>
      <span class="stat-label">Best Performance</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" style="color: var(--warning);" id="totalTime">0h</span>
      <span class="stat-label">Time Invested</span>
    </div>
  </div>

  <div class="main-grid">
    <div class="chart-panel">
      <h3 style="margin-top: 0; color: var(--accent);">📈 Score Trend</h3>
      <p style="color: var(--muted); font-size: 13px;">Tracking your last 10 test results</p>
      <canvas id="trendChart" style="max-height: 350px;"></canvas>
    </div>

    <div class="chart-panel">
      <h3 style="margin-top: 0; color: var(--success);">🎯 Subject Mastery</h3>
      <canvas id="subjectChart" style="max-height: 250px;"></canvas>
      
      <div class="topic-list" id="subjectDetails">
        </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
    authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
    projectId: "olympiad-portal-d2a5e",
    storageBucket: "olympiad-portal-d2a5e.firebasestorage.app" 
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    // Admin Access
    if(user.email === "madhhu52@gmail.com") {
        const adminTab = document.getElementById("adminTab");
        if(adminTab) adminTab.style.display = "inline";
    }
    await fetchPerformanceData(user.uid);
  } else {
    window.location.href = "login.html";
  }
});

async function fetchPerformanceData(uid) {
  const resultsRef = collection(db, "leaderboard");
  const q = query(resultsRef, where("uid", "==", uid), orderBy("timestamp", "desc"));
  const snap = await getDocs(q);

  if (snap.empty) return;

  let scores = [];
  let labels = [];
  let subjectData = { maths: 0, science: 0, english: 0, reasoning: 0 };
  let subjectCounts = { maths: 0, science: 0, english: 0, reasoning: 0 };

  snap.forEach(doc => {
    const data = doc.data();
    const scoreVal = parseFloat(data.score) || 0;
    scores.unshift(scoreVal);
    labels.unshift(new Date(data.timestamp.toDate()).toLocaleDateString());

    // Group by Subject (Assuming subject is stored in leaderboard entry)
    const sub = data.subject || 'maths';
    if (subjectData[sub] !== undefined) {
      subjectData[sub] += scoreVal;
      subjectCounts[sub]++;
    }
  });

  // Calculate Averages for Summary
  const avg = (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1);
  document.getElementById("avgScore").innerText = avg + "%";
  document.getElementById("testsTaken").innerText = snap.size;
  document.getElementById("highestScore").innerText = Math.max(...scores) + "%";
  document.getElementById("totalTime").innerText = (snap.size * 0.8).toFixed(1) + "h";

  renderTrendChart(labels, scores);
  renderSubjectProficiency(subjectData, subjectCounts);
}

function renderTrendChart(labels, scores) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Quiz Score (%)',
        data: scores,
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56, 189, 248, 0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 6,
        pointHoverRadius: 8
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
      }
    }
  });
}

function renderSubjectProficiency(data, counts) {
  const ctx = document.getElementById('subjectChart').getContext('2d');
  const subjects = Object.keys(data);
  const averages = subjects.map(s => counts[s] > 0 ? (data[s] / counts[s]).toFixed(0) : 0);

  new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['Maths', 'Science', 'English', 'Reasoning'],
      datasets: [{
        label: 'Proficiency level',
        data: averages,
        backgroundColor: 'rgba(129, 140, 248, 0.2)',
        borderColor: '#818cf8',
        borderWidth: 2
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        r: {
          angleLines: { color: '#334155' },
          grid: { color: '#334155' },
          pointLabels: { color: '#f8fafc', font: { size: 12 } },
          ticks: { display: false, stepSize: 20 },
          suggestedMin: 0, suggestedMax: 100
        }
      }
    }
  });

  // Populate List
  let html = "";
  subjects.forEach((s, i) => {
    html += `
      <div class="topic-item">
        <span style="text-transform: capitalize;">${s}</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 12px; font-weight: 800;">${averages[i]}%</span>
          <div class="progress-bar"><div class="progress-fill" style="width: ${averages[i]}%; background: ${averages[i] > 70 ? 'var(--success)' : 'var(--brand)'}"></div></div>
        </div>
      </div>`;
  });
  document.getElementById("subjectDetails").innerHTML = html;
}
</script>
<script>
/* Mobile Menu Toggle */
function toggleMenu() {
    document.querySelector('.nav-links').classList.toggle('active');
}
</script>
</body>
</html>
