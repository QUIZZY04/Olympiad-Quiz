<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Portal - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;                  
      --surface: #1e293b;            
      --text: #f8fafc;                
      --muted: #94a3b8;              
      --border: #334155;             
      --brand: #38bdf8;              
      --amber: #f59e0b;              
      --success: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); min-height: 100vh; color: var(--text); display: flex; flex-direction: column; }
    nav { background: var(--surface); height: 70px; display: flex; align-items: center; padding: 0 5%; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; justify-content: space-between; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--brand); letter-spacing: -0.025em; text-decoration: none; }
    .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .signup-card { background: var(--surface); width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.subtitle { color: var(--muted); text-align: center; margin-bottom: 32px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    input, select { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; transition: all 0.2s; outline: none; }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
    .btn-primary { width: 100%; padding: 14px; background: var(--brand); color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .divider { display: flex; align-items: center; margin: 24px 0; color: var(--border); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .divider span { padding: 0 12px; color: var(--muted); }
    .google-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
    .google-btn:hover { background: rgba(255,255,255,0.05); border-color: var(--muted); }
    footer { text-align: center; padding: 30px; background: var(--surface); color: var(--muted); border-top: 1px solid var(--border); font-size: 0.9rem; }
    footer a { color: var(--brand); text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Olympiad Portal</a>
  </nav>

  <div class="main-container">
    <div class="signup-card">
      <h1>Create Account</h1>
      <p class="subtitle">Start your preparation journey today</p>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Select Your Class</label>
          <select id="classSelect">
            <option value="class9">Class 9</option>
            <option value="class10">Class 10</option>
            <option value="class11">Class 11</option>
            <option value="class12">Class 12</option>
            <option value="dropper">Dropper / Repeater</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button class="google-btn" id="googleBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
        Continue with Google
      </button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Olympiad Portal. Dedicated to Excellence.</p>
    <div style="margin-top: 10px;">
      <a href="about.html">About Us</a> | 
      <a href="contact.html">Contact Us</a> | 
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
      authDomain: "olympiadquiz.org",
      projectId: "olympiad-portal-d2a5e",
      storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
      messagingSenderId: "341855557503",
      appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Standard Email Signup
    document.getElementById("signupForm").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const classSelect = document.getElementById("classSelect").value;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, "users", userCredential.user.uid), {
                name, email, class: classSelect, createdAt: new Date()
            });
            alert("Registration Successful! Please login.");
            window.location.href = "index.html";
        } catch(error) { 
            alert("Error: " + error.message); 
        }
    });

    // Google Sign-In Logic
    document.getElementById("googleBtn").addEventListener("click", async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (!userDoc.exists()) {
                let userClass = prompt("Welcome! Please enter your grade (e.g., class10):");
                if (!userClass) userClass = "class10"; 
                
                await setDoc(doc(db, "users", user.uid), {
                    name: user.displayName,
                    email: user.email,
                    class: userClass,
                    createdAt: new Date()
                });
            }
            window.location.href = "dashboard.html";
        } catch (error) {
            console.error("Auth Error:", error);
            alert("Authentication failed: " + error.message);
        }
    });
  </script>
</body>
</html>
