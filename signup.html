<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
  authDomain: "olympiadquiz.org", 
  projectId: "olympiad-portal-d2a5e",
  storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
  messagingSenderId: "341855557503",
  appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// Standard Email Signup
document.getElementById("signupForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const name=document.getElementById("name").value.trim();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const classSelect=document.getElementById("classSelect").value;

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        await setDoc(doc(db, "users", userCredential.user.uid), {
            name, email, class: classSelect, createdAt: new Date()
        });

        await signOut(auth);

        // This triggers YOUR thematic modal
        document.getElementById("customModal").style.display = "flex";

    } catch(error) { 
        alert("Registration Issue: " + error.message); 
    }
});

// Google Sign-In Logic
document.getElementById("googleBtn").addEventListener("click", async () => {
    try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        const userDoc = await getDoc(doc(db, "users", user.uid));
        
        if (!userDoc.exists()) {
            let userClass = prompt("Welcome! Please enter your grade (e.g., class5):");
            if (!userClass) userClass = "class10";
            
            await setDoc(doc(db, "users", user.uid), {
                name: user.displayName,
                email: user.email,
                class: userClass,
                createdAt: new Date()
            });
        }
        
        window.location.href = "dashboard.html";
    } catch (error) {
        alert("Authentication failed: " + error.message);
    }
});
</script>
