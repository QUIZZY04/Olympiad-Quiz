<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Olympiad Practice Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-accent: #1e293b;
            --gold: #fbbf24;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-accent) 100%);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #particles-js { position:fixed; width:100%; height:100%; top:0; left:0; z-index:-1; }

        nav {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 8%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(10px);
        }

        .logo { font-size: 26px; font-weight: 700; color: var(--text-white); text-decoration: none; }
        .logo span { color: var(--gold); }

        .wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card h2 { font-size: 28px; margin-bottom: 15px; }
        .card p { color: var(--text-gray); margin-bottom: 30px; font-size: 14px; line-height: 1.6; }

        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-gray); }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-dark);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus { border-color: var(--gold); }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4); }
        .reset-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .back-link { margin-top: 25px; font-size: 14px; }
        .back-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    </style>
</head>

<body>

<div id="particles-js"></div>

<nav>
    <a href="index.html" class="logo">Olympiad<span>Portal</span></a>
</nav>

<div class="wrapper">
    <div class="card">
        <h2>Password Recovery</h2>
        <p>Enter your email and we'll send a secure link to reset your password via your EmailJS service.</p>

        <form id="recoveryForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="user_email" placeholder="name@example.com" required>
            </div>
            <button type="submit" id="submitBtn" class="reset-btn">Send Recovery Link</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
    // Initialize Particles
    particlesJS("particles-js", {
        particles: {
            number: { value: 60 },
            color: { value: "#fbbf24" },
            shape: { type: "circle" },
            opacity: { value: 0.3 },
            size: { value: 2 },
            line_linked: { enable: true, distance: 150, color: "#fbbf24", opacity: 0.15, width: 1 },
            move: { enable: true, speed: 1.2 }
        }
    });

    // Initialize EmailJS with your Public Key
    (function(){
        emailjs.init("hSiAdsy9_jOQatCHY");
    })();

    const recoveryForm = document.getElementById('recoveryForm');
    const submitBtn = document.getElementById('submitBtn');

    recoveryForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const emailValue = document.getElementById('user_email').value;
        
        // Show loading state
        submitBtn.innerText = "Sending...";
        submitBtn.disabled = true;

        // Make sure these parameter names match your EmailJS Template exactly
        const templateParams = {
            user_email: emailValue,
            recovery_link: window.location.origin + "/change-password.html" 
        };

        emailjs.send('service_wsc0zrn', 'template_j24yn0f', templateParams)
            .then(function(response) {
                console.log('SUCCESS!', response.status, response.text);
                alert("Success! A recovery link has been sent to " + emailValue);
                window.location.href = "login.html";
            }, function(error) {
                console.log('FAILED...', error);
                alert("Failed to send email. Please check your GitHub Pages connection or EmailJS quota.");
                submitBtn.innerText = "Send Recovery Link";
                submitBtn.disabled = false;
            });
    });
</script>

</body>
</html>
