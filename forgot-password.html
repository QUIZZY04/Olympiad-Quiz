<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Olympiad Portal</title>
    <meta name="description" content="Reset your Olympiad Portal account password securely.">
    <link rel="canonical" href="https://olympiadquiz.org/forgot-password.html">
    <meta property="og:title" content="Forgot Password | Olympiad Portal">
    <meta property="og:description" content="Reset your access to the Olympiad Portal platform.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --subtle: #fff7ed;
            --text: #111827;
            --muted: #64748b;
            --border: #e2e8f0;
            --brand: #ff6b00;
            --accent: #ff8c1a;
            --brand-text: #c2410c;
            --brand-contrast: #111827;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; 
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(255, 107, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(255, 140, 26, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(255, 107, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(255, 140, 26, 0.05) 0%, transparent 50%); 
            background-attachment: fixed; }
        
        
        .wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--brand); padding: 45px; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: var(--shadow-lg); }
        .card h1 { font-size: 28px; margin-bottom: 15px; font-weight: 800; color: var(--text); }
        .card p { color: var(--muted); margin-bottom: 25px; line-height: 1.6; }
        .form-group input { width: 100%; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--subtle); color: var(--text); outline: none; font-size: 15px; transition: 0.2s; }
        .form-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }
        .reset-btn { width: 100%; padding: 14px; background: var(--brand); color: var(--brand-contrast); border: none; border-radius: 10px; font-weight: 800; font-size: 15px; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .reset-btn:hover { transform: translateY(-2px); background: var(--accent); }
        .back-link { margin-top: 25px; font-size: 14px; }
        .back-link a { color: var(--brand-text); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>Reset Access</h1>
        <p>Enter your email address and we'll send a secure Firebase reset link to your inbox.</p>
        <form id="recoveryForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <button type="submit" id="submitBtn" class="reset-btn">Send Recovery Link</button>
        </form>
        <div class="back-link"><a href="login.html">← Back to Login</a></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script type="module">
    // Firebase SDK Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your unique Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
        messagingSenderId: "341855557503",
        appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    // Initialize Firebase and Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const recoveryForm = document.getElementById('recoveryForm');
    const submitBtn = document.getElementById('submitBtn');

    recoveryForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const emailValue = document.getElementById('email').value;

        submitBtn.innerText = "Sending...";
        submitBtn.disabled = true;

        // Firebase built-in password reset function
        sendPasswordResetEmail(auth, emailValue)
            .then(() => {
                alert("Success! Check your email inbox for the reset link.");
                window.location.href = "login.html";
            })
            .catch((error) => {
                alert("Error: " + error.message);
                submitBtn.innerText = "Send Recovery Link";
                submitBtn.disabled = false;
            });
    });

    // Particle background configuration
    particlesJS("particles-js", {
        particles: {
            number: { value: 80, density: { enable: true, value_area: 800 } },
            color: { value: "#38bdf8" }, shape: { type: "circle" },
            opacity: { value: 0.3, random: false }, size: { value: 3, random: true },
            line_linked: { enable: true, distance: 150, color: "#38bdf8", opacity: 0.2, width: 1 },
            move: { enable: true, speed: 2, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
        }, interactivity: { detect_on: "canvas", events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" }, resize: true } }, retina_detect: true
    });
</script>

</script>
</body>
</html>
