    <style>
        :root {
            --bg: #FFD700;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --brand: #4f46e5;
            --accent: #8b5cf6;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(244, 63, 94, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
        }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
        .summary-card { background: var(--surface); padding: 40px; border-radius: 20px; text-align: center; box-shadow: var(--shadow-lg); border-top: 5px solid var(--brand); margin-bottom: 40px; }
        .summary-card h1 { font-size: 2.5rem; color: var(--brand); margin-bottom: 10px; }
        .summary-card p { font-size: 1.1rem; color: var(--muted); }
        
        .solution-block { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow-sm); }
        .q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        .q-meta { font-size: 0.8rem; background: var(--bg); padding: 4px 10px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; display: inline-block; color: var(--muted); border: 1px solid var(--border); }
        
        .opt-box { padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; background: var(--bg); color: var(--muted); }
        .opt-correct-selected { background: #dcfce3; border-color: #10b981; color: #059669; font-weight: bold; }
        .opt-wrong-selected { background: #fee2e2; border-color: #ef4444; color: #dc2626; text-decoration: line-through; }
        .opt-missed-correct { background: #eff6ff; border-color: #3b82f6; color: #2563eb; text-decoration: underline; font-weight: bold; }
        
        .exp-box { margin-top: 20px; padding: 15px; background: #fffbeb; border-left: 4px solid #f59e0b; border-radius: 8px; font-size: 0.95rem; }
        .exp-box b { color: #d97706; display: block; margin-bottom: 5px; }
        
        .nav-btn { display: inline-block; background: var(--brand); color: white; padding: 12px 30px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 20px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-btn:hover { background: var(--accent); transform: translateY(-2px); }
    </style>
</head>

    <div class="container">
        <div class="summary-card">
            <h1 id="scoreDisplay">Loading...</h1>
            <p id="testTitleDisplay">Calculating your performance</p>
            <a href="jee-list.html" class="nav-btn">Back to JEE Dashboard</a>
        </div>
        
        <h2>Detailed Solutions</h2>
        <div id="solutionsContainer"></div>
    </div>

    <footer style="text-align:center;padding:30px;background:var(--surface);border-top:1px solid var(--border);color:var(--muted);margin-top:auto;">
        <p style="margin-top:15px;font-size:14px;">© 2026 Olympiad Portal. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", authDomain: "olympiad-portal-d2a5e.firebaseapp.com", projectId: "olympiad-portal-d2a5e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            document.body.style.visibility = 'visible';
            if (!user) {
                window.location.replace("login.html");
                return;
            }
            if (user.email === "madhhu52@gmail.com") {
                document.getElementById("adminTab").style.display = "inline";
            }

            const resultData = JSON.parse(localStorage.getItem("jeeQuizResult"));
            if (!resultData) {
                alert("No result data found!");
                window.location.href = "jee-list.html";
                return;
            }

            document.getElementById("testTitleDisplay").innerText = resultData.testTitle;
            
            let totalScoreEarned = 0;
            let maxScorePossible = 0;
            let html = "";

            resultData.questions.forEach((q, idx) => {
                const userAns = resultData.userAnswers[idx] || [];
                const correctAns = q.correctAnswers || [];
                
                let isAllCorrect = true;
                let hasWrong = false;
                
                userAns.forEach(ua => {
                    if (!correctAns.includes(ua)) hasWrong = true;
                });
                correctAns.forEach(ca => {
                    if (!userAns.includes(ca)) isAllCorrect = false;
                });
                
                let earned = 0;
                let statusTag = "";
                let markClass = "";
                
                const qMaxMarks = q.type === 'multi' ? 4 : 3;
                maxScorePossible += qMaxMarks;
                
                if (userAns.length === 0) {
                    earned = 0;
                    statusTag = "⚪ Unattempted";
                    markClass = "var(--muted)";
                } else if (hasWrong) {
                    earned = q.type === 'multi' ? -2 : -1;
                    statusTag = "❌ Incorrect";
                    markClass = "var(--danger)";
                } else if (isAllCorrect) {
                    earned = q.type === 'multi' ? 4 : 3;
                    statusTag = "✅ Fully Correct";
                    markClass = "var(--success)";
                } else {
                    earned = userAns.length; // Partial marking: +1 per correct option chosen
                    statusTag = "⚠️ Partially Correct";
                    markClass = "#d97706";
                }
                
                totalScoreEarned += earned;

                let optionsHtml = "";
                q.options.forEach(opt => {
                    if(!opt) return;
                    let styleClass = "opt-box";
                    const isUserSelected = userAns.includes(opt);
                    const isTrueCorrect = correctAns.includes(opt);
                    
                    if (isUserSelected && isTrueCorrect) styleClass += " opt-correct-selected";
                    else if (isUserSelected && !isTrueCorrect) styleClass += " opt-wrong-selected";
                    else if (!isUserSelected && isTrueCorrect) styleClass += " opt-missed-correct";
                    
                    optionsHtml += `<div class="${styleClass}">${opt}</div>`;
                });
                
                let qIdText = q.id ? ` | ID: ${q.id}` : "";
                html += `
                <div class="solution-block">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                        <div class="q-meta" style="margin-bottom:0;">Q${idx + 1}${qIdText} | ${q.type === 'multi' ? 'Multi-Correct (+4, -2)' : 'Single Correct (+3, -1)'} | ${statusTag}</div>
                        <div style="font-size: 1.1rem; font-weight: 800; color: ${markClass}; background: var(--bg); padding: 4px 12px; border-radius: 8px; border: 1px solid var(--border);">Marks: ${earned > 0 ? '+' : ''}${earned}</div>
                    </div>
                    <div class="q-text">${q.questionText}</div>
                    <div style="margin-bottom: 15px;">
                        <p style="font-size: 13px; color: var(--muted); margin-bottom: 5px;"><strong>Your Answer:</strong> ${userAns.length > 0 ? userAns.join(", ") : "None"}</p>
                        <p style="font-size: 13px; color: var(--success); margin-bottom: 10px;"><strong>Correct Answer:</strong> ${correctAns.join(", ")}</p>
                    </div>
                    <div>${optionsHtml}</div>
                    <div class="exp-box">
                        <b>Explanation:</b> ${q.explanation ? q.explanation : "Self-explanatory based on the correct options."}
                    </div>
                </div>`;
            });

            document.getElementById("scoreDisplay").innerHTML = `<span style="color: ${totalScoreEarned >= 0 ? 'var(--brand)' : 'var(--danger)'}">${totalScoreEarned}</span> / ${maxScorePossible}`;
            document.getElementById("solutionsContainer").innerHTML = html;
        });

        window.logout = async () => {
            if (confirm("Logout?")) {
                await signOut(auth);
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace("login.html");
            }
        };
    </script>
    <script>
    /* Mobile Menu Toggle */
    function toggleMenu() {
        document.querySelector('.nav-links').classList.toggle('active');
    }
    </script>
