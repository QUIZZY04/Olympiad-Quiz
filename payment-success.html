<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    background:#1e293b;
    padding:40px 50px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    border:2px solid gold;
}

.check{
    font-size:70px;
    color:#4ade80;
}

h1{
    margin-top:10px;
    font-size:32px;
}

p{
    margin-top:10px;
    color:#d1d5db;
}

.button{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:gold;
    color:black;
    text-decoration:none;
    font-weight:bold;
    border-radius:8px;
}

.timer{
    margin-top:15px;
    font-size:14px;
    color:#9ca3af;
}

</style>
</head>

<body>

<div class="container">

<div class="check">✔</div>

<h1>Payment Successful</h1>

<p>Your Olympiad Quiz registration is confirmed.</p>

<p>You will be redirected to the quiz shortly.</p>

<a class="button" href="index.html">Start Quiz Now</a>

<div class="timer">
Redirecting automatically in <span id="count">5</span> seconds...
</div>

</div>

<script>

let time = 5;

let timer = setInterval(function(){

time--;

document.getElementById("count").innerText = time;

if(time <= 0){

window.location.href = "index.html";

}

},1000);

</script>

</body>
</html>
