<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success - Olympiad Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#020617; --card:#1e293b; --text:#f8fafc; --amber:#f59e0b; --green:#22c55e; }
    body { font-family:'Inter', sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .status-card { background:var(--card); padding:40px; border-radius:16px; border:2px solid var(--amber); text-align:center; max-width:400px; width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .icon { font-size:50px; color:var(--green); margin-bottom:20px; }
    h1 { color:var(--amber); margin-bottom:10px; font-weight:800; }
    p { color:#94a3b8; line-height:1.6; margin-bottom:25px; }
    .loader { border:4px solid #334155; border-top:4px solid var(--amber); border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <div class="status-card">
    <div id="statusIcon" class="icon">⌛</div>
    <h1 id="statusTitle">Verifying...</h1>
    <p id="statusMsg">Please wait while we unlock your test. Do not refresh this page.</p>
    <div id="loader" class="loader"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
      authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
      projectId: "olympiad-portal-d2a5e",
      storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
      messagingSenderId: "341855557503",
      appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // 1. Get Payment ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const paymentId = urlParams.get('razorpay_payment_id');
      
      // 2. Get the specific Test Session ID from storage
      // Make sure your dashboard saves this before redirecting!
      const sessionId = localStorage.getItem("activeSessionId");

      if (paymentId && sessionId) {
        try {
          // 3. Update Firebase to unlock the test
          await setDoc(doc(db, "users", user.uid, "purchases", sessionId), {
            paid: true,
            paymentId: paymentId,
            amount: 69,
            registeredAt: serverTimestamp()
          });

          // 4. Update UI Success
          document.getElementById("statusIcon").innerText = "✅";
          document.getElementById("statusIcon").style.color = "#22c55e";
          document.getElementById("statusTitle").innerText = "Success!";
          document.getElementById("statusMsg").innerText = "Payment verified. You are being redirected to your dashboard.";
          document.getElementById("loader").style.display = "none";

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 3000);

        } catch (error) {
          console.error("Firebase Error:", error);
          showError("Database error. Please contact support.");
        }
      } else {
        showError("Invalid payment session or ID missing.");
      }
    });

    function showError(msg) {
      document.getElementById("statusIcon").innerText = "❌";
      document.getElementById("statusIcon").style.color = "#ef4444";
      document.getElementById("statusTitle").innerText = "Error";
      document.getElementById("statusMsg").innerText = msg;
      document.getElementById("loader").style.display = "none";
    }
  </script>
</body>
</html>
