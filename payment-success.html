<!DOCTYPE html>
<html>
<head>
<title>Payment Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
}

.box{
background:#1e293b;
padding:40px;
border-radius:12px;
text-align:center;
border:2px solid #22c55e;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#f59e0b;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>✅ Payment Successful</h2>
<p>Your quiz has been unlocked.</p>

<button onclick="goDashboard()">Go to Dashboard</button>
</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e",
storageBucket:"olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId:"341855557503",
appId:"1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

async function savePurchase(){

const sessionId=localStorage.getItem("activeSessionId");

if(!auth.currentUser || !sessionId) return;

await setDoc(
doc(db,"users",auth.currentUser.uid,"purchases",sessionId),
{
paid:true,
time:serverTimestamp()
}
);

}

savePurchase();

window.goDashboard=function(){
window.location.href="dashboard.html";
}

</script>

</body>
</html>
