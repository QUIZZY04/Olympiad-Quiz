<!DOCTYPE html>
<html>
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7631964396609524"
     crossorigin="anonymous"></script>
<title>Payment Successful</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family: 'Poppins', sans-serif;
background:#FFD700;
color:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
background-image: 
    radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 0% 100%, rgba(244, 63, 94, 0.12) 0%, transparent 50%);
background-attachment: fixed;
}

.box{
background:#ffffff;
padding:50px;
border-radius:24px;
text-align:center;
border:1px solid #e2e8f0;
border-top: 2px solid #10b981;
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
}

#statusMsg {
margin-top: 10px;
font-size: 14px;
color: #94a3b8;
}

button{
margin-top:20px;
padding:14px 25px;
border:none;
border-radius:10px;
background: linear-gradient(135deg, #10b981, #059669);
color: white;
font-weight:bold;
cursor:pointer;
text-transform: uppercase;
transition: 0.3s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
</style>
</head>

<body>

<div class="box">
<h1 id="statusTitle">Processing Payment...</h1>
<p id="statusMessage">Your payment is being processed. Please do not refresh or press back.</p>
<p id="statusMsg" style="display:none;">Updating your account details...</p>

<a id="fallbackLink" href="live.html" style="display: none; margin-top: 25px; color: #2563eb; text-decoration: none; font-weight: bold; background: rgba(37, 99, 235, 0.1); padding: 10px 15px; border-radius: 8px;">If not redirected within 1 minute, click here</a>
<button id="dashboardBtn" onclick="goDashboard()" style="display:none;">Go to Dashboard</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e",
storageBucket:"olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId:"341855557503",
appId:"1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const functions = getFunctions(app);
const verifyPaymentEndpoint = httpsCallable(functions, 'verifyRazorpayPayment');

// Wait for Firebase to confirm the user is logged in
onAuthStateChanged(auth, async (user) => {
    const statusMsg = document.getElementById("statusMsg");
    const sessionId = localStorage.getItem("activeSessionId");
    const sessionPrice = localStorage.getItem("activeSessionPrice");
    const appliedCoupon = localStorage.getItem("appliedCoupon");
    const paymentDataStr = localStorage.getItem("paymentData");

    if (!user) {
        document.getElementById("statusTitle").innerText = "Error";
        document.getElementById("statusMessage").innerText = "Error: User not logged in.";
        return;
    }

    if (!paymentDataStr && sessionPrice > 0) {
        document.getElementById("statusTitle").innerText = "Error";
        document.getElementById("statusMessage").innerText = "No payment data found.";
        return;
    }

    const safetyTimeout = setTimeout(() => {
        document.getElementById("statusMessage").innerText = "Payment is still being processed. Please wait or use the link below.";
        document.getElementById("fallbackLink").style.display = "inline-block";
    }, 60000);

    let verified = false;
    let attempts = 0;
    const maxAttempts = 20; // 60 seconds (20 * 3s)
    
    let paymentData = {};
    if (paymentDataStr) paymentData = JSON.parse(paymentDataStr);

    while (!verified && attempts < maxAttempts) {
        attempts++;
        try {
            let isSuccess = false;
            if (sessionPrice == 0) {
                isSuccess = true; // Skip Razorpay verify for free unlocked quizzes
            } else {
                const result = await verifyPaymentEndpoint({
                    razorpay_order_id: paymentData.razorpay_order_id,
                    razorpay_payment_id: paymentData.razorpay_payment_id,
                    razorpay_signature: paymentData.razorpay_signature,
                    sessionId: sessionId,
                    amount: parseInt(sessionPrice)
                });
                isSuccess = result.data && result.data.success;
            }

            if (isSuccess) {
                verified = true;
                clearTimeout(safetyTimeout);

                // Original Firestore updates
                if (sessionId) {
                    try {
                        await setDoc(doc(db, "users", user.uid), {
                            name: user.displayName || "Student",
                            email: user.email,
                            lastPurchaseAt: serverTimestamp()
                        }, { merge: true });

                        await setDoc(
                            doc(db, "users", user.uid, "purchases", sessionId),
                            {
                                paid: true,
                                time: serverTimestamp(),
                                amount: Number(sessionPrice), 
                                sessionId: sessionId,
                                couponUsed: appliedCoupon || null
                            },
                            { merge: true }
                        );
                        localStorage.removeItem("appliedCoupon");
                    } catch (error) {
                        console.error("Error saving data:", error);
                    }
                }

                // Dynamic UI Update
                document.getElementById("statusTitle").innerText = "✅ Payment Successful";
                document.getElementById("statusTitle").style.color = "#10b981";
                document.getElementById("statusMessage").innerText = "You are being redirected to Live Test page...";
                document.getElementById("fallbackLink").style.display = "inline-block";
                document.getElementById("fallbackLink").innerText = "Click here if not redirected automatically";
                
                setTimeout(() => {
                    window.location.href = "live.html"; 
                }, 4000);
                break;
            }
        } catch (error) {
            console.log(`Verification attempt ${attempts} failed, retrying in 3 seconds...`, error);
        }

        if (!verified) {
            await new Promise(resolve => setTimeout(resolve, 3000));
        }
    }

    if (!verified) {
        document.getElementById("statusTitle").innerText = "Verification Delayed";
        document.getElementById("statusTitle").style.color = "#f59e0b";
        document.getElementById("statusMessage").innerText = "We are taking longer than expected to verify the payment. Please proceed to the Live Arena and check your status.";
        document.getElementById("fallbackLink").style.display = "inline-block";
    }
});

window.goDashboard=function(){
    window.location.href="dashboard.html";
}
</script>

</body>
</html>
