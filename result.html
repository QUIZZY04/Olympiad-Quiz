<!DOCTYPE html>
<html lang="en">
<head>
<script>
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olympiad Performance Report</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
:root{
--bg:#0f172a;
--surface:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--border:#334155;
--brand:#38bdf8;
--accent:#22c55e;
--amber:#f59e0b;
--danger:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);}

.utility-nav{
background:#020617;
padding:12px 40px;
display:flex;
justify-content:flex-end;
gap:30px;
border-bottom:1px solid var(--border);
}

.utility-nav a{
color:var(--amber);
text-decoration:none;
font-size:16px;
font-weight:800;
text-transform:uppercase;
cursor:pointer;
}

header.top-bar{
position:sticky;
top:0;
z-index:1000;
background:#1e293b;
border-bottom:2px solid var(--border);
padding:12px 40px;
display:flex;
align-items:center; justify-content:space-between;
}

.brand{
font-size:24px;
font-weight:800;
color:var(--amber);
text-decoration:none;
}

.container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.summary-card{
background:var(--surface);
padding:30px;
border-radius:20px;
text-align:center;
margin-bottom:30px;
border:1px solid var(--border);
}

table{
width:100%;
border-collapse:collapse;
margin-top:25px;
font-size:14px;
background:var(--surface);
border-radius:12px;
overflow:hidden;
}

th,td{
padding:15px;
border-bottom:1px solid var(--border);
vertical-align:top;
text-align:left;
}

th{
background:rgba(0,0,0,0.2);
color:var(--muted);
text-transform:uppercase;
font-weight:700;
font-size:12px;
}

.correct-row{background:rgba(34,197,94,0.05);}
.wrong-row{background:rgba(239,68,68,0.05);}

.status-badge{
font-weight:800;
text-transform:uppercase;
font-size:11px;
padding:6px 10px;
border-radius:6px;
white-space: nowrap;
}

.status-correct{color:var(--accent); background: rgba(34, 197, 94, 0.1);}
.status-wrong{color:var(--danger); background: rgba(239, 68, 68, 0.1);}

.sol-box {
    background: rgba(0, 0, 0, 0.25);
    padding: 12px;
    border-radius: 10px;
    border-left: 4px solid var(--brand);
}

.sol-item {
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
}

.sol-label {
    color: var(--brand);
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
}

.report-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    text-decoration: none;
    transition: 0.3s;
    cursor: pointer;
    white-space: nowrap;
}

.report-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(245, 158, 11, 0.15);
    transform: translateY(-2px);
}

.action-btn{
padding:16px 32px;
border:none;
border-radius:10px;
margin:20px 5px;
cursor:pointer;
font-weight:800;
text-transform:uppercase;
transition:0.2s;
}

.quiz-btn{background:var(--amber);color:#000;}

.modal-overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
z-index:2000;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:var(--surface);
padding:30px;
border-radius:20px;
width:100%;
max-width:500px;
border:1px solid var(--border);
text-align:center;
}

.modal-input{
width:100%;
padding:12px;
background:#020617;
color:white;
border:1px solid var(--border);
border-radius:10px;
margin:10px 0 20px 0;
font-size:14px;
}
</style>
</head>

<body>

<div class="utility-nav">
<a href="dashboard.html">Dashboard</a>
<a href="leaderboard.html">Leaderboard</a>
<a onclick="logout()" style="color:var(--danger);cursor:pointer;">Logout</a>
</div>

<header class="top-bar">
<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
<div style="font-weight:600;color:var(--muted);">Performance Report</div>
</header>

<div class="container">
<h1 style="text-align:center;margin-bottom:30px;">🏆 Performance Summary</h1>
<div class="summary-card" id="summary"></div>
<div style="text-align:center;">
<button class="action-btn quiz-btn" onclick="location.href='quiz.html'">TAKE ANOTHER QUIZ</button>
<button class="action-btn" style="background:var(--brand);color:#000;" onclick="location.href='leaderboard.html'">VIEW RANKINGS</button>
<button class="action-btn" style="background:var(--accent);color:#000;" onclick="openFeedback()">GIVE YOUR FEEDBACK</button>
</div>
<div id="details"></div>
</div>

<div id="feedbackModal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="color:var(--amber); margin-bottom:20px;">Share Feedback</h2>
        <div style="text-align:left;">
            <label style="color:var(--muted); font-size:12px; font-weight:700;">RATING</label>
            <select id="fbRating" class="modal-input">
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Average">Average</option>
                <option value="Poor">Poor</option>
            </select>
            <label style="color:var(--muted); font-size:12px; font-weight:700;">SUGGESTIONS</label>
            <textarea id="fbText" class="modal-input" rows="4" style="height:100px; resize:none;" placeholder="How can we improve?"></textarea>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="action-btn" style="flex:1; margin:0; background:var(--accent); color:#000;" onclick="submitFeedback()">SUBMIT</button>
            <button class="action-btn" style="flex:1; margin:0; background:var(--danger); color:white;" onclick="closeFeedback()">CANCEL</button>
        </div>
    </div>
</div>

<div id="reportModal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="color:var(--amber); margin-bottom:10px;">Report Question</h2>
        <p id="reportQIdDisplay" style="font-size: 11px; color: var(--brand); margin-bottom: 20px;"></p>
        <div style="text-align:left;">
            <input type="hidden" id="reportQId">
            <input type="hidden" id="reportQClass">
            <input type="hidden" id="reportQSub">
            <label style="color:var(--muted); font-size:12px; font-weight:700;">DESCRIBE THE ISSUE</label>
            <textarea id="reportMsg" class="modal-input" rows="4" style="height:120px; resize:none;" placeholder="E.g., Wrong answer, Typo in question..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="action-btn" style="flex:1; margin:0; background:var(--accent); color:#000;" onclick="submitReport()">SUBMIT REPORT</button>
            <button class="action-btn" style="flex:1; margin:0; background:var(--danger); color:white;" onclick="closeReport()">CANCEL</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore,collection,addDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth,signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

window.logout=async()=>{
    if(confirm("Logout?")){
        await signOut(auth);
        window.location.href="login.html";
    }
};

window.openFeedback = () => document.getElementById("feedbackModal").style.display = "flex";
window.closeFeedback = () => document.getElementById("feedbackModal").style.display = "none";

window.submitFeedback = async () => {
    const rating = document.getElementById("fbRating").value;
    const comment = document.getElementById("fbText").value;
    const resultData = JSON.parse(localStorage.getItem("quizResult"));
    const currentUser = auth.currentUser;

    if(!comment.trim()) { alert("Please write a suggestion."); return; }

    try {
        await addDoc(collection(db, "feedbacks"), {
            name: currentUser?.displayName || "Guest",
            email: currentUser?.email || "N/A",
            rating: rating,
            suggestion: comment,
            score: resultData ? `${resultData.score}/${resultData.total}` : "N/A",
            date: new Date().toLocaleString(),
            timestamp: serverTimestamp()
        });
        alert("Thank you for your feedback!");
        window.closeFeedback();
    } catch (e) {
        alert("Error: " + e.message);
    }
};

window.openReport = (qId, qClass, qSub) => {
    document.getElementById("reportQId").value = qId;
    document.getElementById("reportQClass").value = qClass;
    document.getElementById("reportQSub").value = qSub;
    document.getElementById("reportQIdDisplay").innerText = "Question ID: " + qId;
    document.getElementById("reportModal").style.display = "flex";
};

window.closeReport = () => {
    document.getElementById("reportModal").style.display = "none";
    document.getElementById("reportMsg").value = "";
};

window.submitReport = async () => {
    const qId = document.getElementById("reportQId").value;
    const qClass = document.getElementById("reportQClass").value;
    const qSub = document.getElementById("reportQSub").value;
    const msg = document.getElementById("reportMsg").value;

    if (!msg.trim()) { alert("Please describe the issue."); return; }

    try {
        await addDoc(collection(db, "feedback"), {
            questionId: qId,
            message: msg,
            class: qClass,
            subject: qSub,
            timestamp: serverTimestamp(),
            status: "pending"
        });
        alert("Report submitted successfully.");
        window.closeReport();
    } catch (e) {
        alert("Report failed: " + e.message);
    }
};

document.addEventListener("DOMContentLoaded",function(){
    const data=localStorage.getItem("quizResult");
    if(!data){
        document.getElementById("summary").innerHTML="<h2 style='color:#f59e0b'>Result not found</h2>";
        return;
    }

    const res=JSON.parse(data);
    const answersArray = res.answers || res.userAnswers || [];
    const accuracy=((res.score/res.total)*100).toFixed(2);

    document.getElementById("summary").innerHTML=`
        <h2 style="font-size:36px;color:var(--amber);">${res.score} / ${res.total}</h2>
        <h3 style="color:var(--muted);font-size:14px;">Accuracy: ${accuracy}%</h3>
    `;

    // Updated Header with high-contrast instruction box
    let html=`
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin: 40px 0 20px 0; flex-wrap: wrap; gap: 15px;">
        <h2 style="font-weight: 800; margin: 0;">DETAILED ANALYSIS</h2>
        <div style="background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--brand); padding: 10px 20px; border-radius: 8px; font-size: 13px; color: var(--text); max-width: 600px; line-height: 1.5;">
            💡 If there are any discrepancies in the quiz, report to the admin by clicking on the <strong>Flag</strong> button next to the question.
        </div>
    </div>
    <table><thead><tr><th>#</th><th>Question</th><th>Your Ans</th><th>Correct Ans</th><th>Status</th><th>Solution</th><th style="text-align:center;">Action</th></tr></thead><tbody>`;

    res.questions.forEach((q,i)=>{
        const userAns = answersArray[i] ?? null;
        const isCorrect = userAns == q.a;

        html+=`<tr class="${isCorrect?'correct-row':'wrong-row'}">
            <td>${i+1}</td>
            <td style="min-width: 250px; font-weight: 500;">${q.q}</td>
            <td style="font-weight: 700;">${userAns!==null ? q.o[userAns] : "Not Attempted"}</td>
            <td style="color:var(--accent);font-weight:800;">${q.o[q.a]}</td>
            <td><span class="status-badge ${isCorrect?'status-correct':'status-wrong'}">${isCorrect?'✅ Correct':'❌ Wrong'}</span></td>
            <td>
                <div class="sol-box">
                    <span class="sol-label">Hint</span>
                    <div class="sol-item">${q.hint || "N/A"}</div>
                    <span class="sol-label" style="margin-top:8px;">Solution</span>
                    <div class="sol-item">${q.sol || "N/A"}</div>
                </div>
            </td>
            <td style="text-align: center; vertical-align: middle;">
                <div class="report-btn" onclick="openReport('${q.id}', '${res.class}', '${res.subject}')">
                    <span>Flag</span> 🚩
                </div>
            </td>
        </tr>`;
    });

    document.getElementById("details").innerHTML = html + "</tbody></table>";
});
</script>
</body>
</html>
