<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.go(1); };
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olympiad Performance Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --brand: #38bdf8;
      --accent: #22c55e; --amber: #f59e0b; --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); }
    .utility-nav { background: #020617; padding: 12px 40px; display: flex; justify-content: flex-end; gap: 30px; border-bottom: 1px solid var(--border); }
    .utility-nav a { color: var(--amber); text-decoration: none; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
    header.top-bar { position: sticky; top: 0; z-index: 1000; background: #1e293b; border-bottom: 2px solid var(--border); padding: 12px 40px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 24px; font-weight: 800; color: var(--amber); text-decoration: none; }
    .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .summary-card { background: var(--surface); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 30px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 14px; background: var(--surface); border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
    th { background: rgba(0,0,0,0.2); color: var(--muted); text-transform: uppercase; font-weight: 700; font-size: 12px; }
    .correct-row { background: rgba(34, 197, 94, 0.1); }
    .wrong-row { background: rgba(239, 68, 68, 0.1); }
    .status-badge { font-weight: 800; text-transform: uppercase; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
    .status-correct { color: var(--accent); }
    .status-wrong { color: var(--danger); }
    .action-btn { padding: 16px 32px; border: none; border-radius: 10px; margin: 20px 5px; cursor: pointer; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
    .quiz-btn { background: var(--amber); color: #000; }
    .report-link { color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; display: block; margin-top: 5px; }

    /* Modal Styling */
    #feedbackModal {
        display:none; 
        position:fixed; 
        top:0; left:0; 
        width:100%; height:100%; 
        background:rgba(0,0,0,0.85); 
        z-index:2000; 
        justify-content:center; 
        align-items:center; 
        padding:20px;
        backdrop-filter: blur(5px);
    }
    .modal-content {
        background: var(--surface);
        padding: 35px;
        border-radius: 24px;
        width: 100%;
        max-width: 500px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal-content h2 { margin-bottom: 20px; color: var(--amber); font-weight: 800; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .form-group select, .form-group textarea {
        width: 100%;
        padding: 12px;
        background: var(--bg);
        color: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
    }
    .form-group textarea { resize: none; }
  </style>
</head>
<body>

<div class="utility-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a onclick="logout()" style="color:var(--danger); cursor:pointer;">Logout</a>
</div>

<header class="top-bar">
    <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
    <div style="font-weight:600; color: var(--muted);">Performance Report</div>
</header>

<div class="container">
    <h1 style="text-align:center; margin-bottom:30px;">🏆 Performance Summary</h1>
    <div class="summary-card" id="summary"></div>
    
    <div style="text-align:center;">
        <button class="action-btn quiz-btn" onclick="location.href='quiz.html'">TAKE ANOTHER QUIZ</button>
        <button class="action-btn" style="background:var(--brand); color:#000;" onclick="location.href='leaderboard.html'">VIEW RANKINGS</button>
        <button class="action-btn" style="background:var(--accent); color:#000;" onclick="openFeedback()">GIVE FEEDBACK</button>
    </div>

    <div id="details"></div>
</div>

<div id="feedbackModal">
    <div class="modal-content">
        <h2>Share Feedback</h2>
        <div class="form-group">
            <label>How would you rate the quiz experience?</label>
            <select id="fbRating">
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Good</option>
                <option value="3">⭐⭐⭐ Average</option>
                <option value="2">⭐⭐ Poor</option>
                <option value="1">⭐ Very Bad</option>
            </select>
        </div>
        <div class="form-group">
            <label>Any suggestions or issues encountered?</label>
            <textarea id="fbText" rows="4" placeholder="Your thoughts help us improve..."></textarea>
        </div>
        <div style="display:flex; gap:12px;">
            <button class="action-btn" style="flex:1; margin:0; background:var(--accent); color:#000;" onclick="submitFeedback()">SUBMIT</button>
            <button class="action-btn" style="flex:1; margin:0; background:var(--danger); color:#fff;" onclick="closeFeedback()">CANCEL</button>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
    const data = localStorage.getItem("quizResult");
    if(!data) return;
    const res = JSON.parse(data);
    const accuracy = ((res.score/res.total)*100).toFixed(2);

    document.getElementById("summary").innerHTML = `
        <h2 style="font-size: 36px; color: var(--amber);">${res.score} / ${res.total}</h2>
        <h3 style="color: var(--muted); font-size: 14px;">Accuracy: ${accuracy}%</h3>
    `;

    let html = `<h2 style="margin: 40px 0 20px 0; font-weight: 800;">DETAILED ANALYSIS</h2>
    <table><thead><tr><th>#</th><th>Question</th><th>Your Ans</th><th>Correct Ans</th><th>Status</th><th>Solution</th><th>Report</th></tr></thead><tbody>`;
    
    res.questions.forEach((q, i) => {
        const userAns = res.answers ? res.answers[i] : null;
        const isCorrect = userAns == q.a;
        html += `<tr class="${isCorrect ? 'correct-row' : 'wrong-row'}">
            <td>${i + 1}</td>
            <td style="min-width: 250px;">${q.q}</td>
            <td>${userAns !== null ? q.o[userAns] : "Not Attempted"}</td>
            <td style="color: var(--accent); font-weight:600;">${q.o[q.a]}</td>
            <td><span class="status-badge ${isCorrect ? 'status-correct' : 'status-wrong'}">${isCorrect ? '✅ Correct' : '❌ Wrong'}</span></td>
            <td style="font-size: 13px; color: var(--muted); max-width: 300px;">
                ${!isCorrect ? `<strong>Hint:</strong> ${q.hint || "N/A"}<br><strong>Sol:</strong> ${q.sol || "N/A"}` : "—"}
            </td>
            <td><span class="report-link">Report</span></td>
        </tr>`;
    });
    document.getElementById("details").innerHTML = html + "</tbody></table>";
});

// Feedback Logic
function openFeedback() {
    document.getElementById("feedbackModal").style.display = "flex";
}

function closeFeedback() {
    document.getElementById("feedbackModal").style.display = "none";
}

async function submitFeedback() {
    const rating = document.getElementById("fbRating").value;
    const comment = document.getElementById("fbText").value;
    
    // Attempt to get user info from localStorage (adjust key if your login system uses different naming)
    const user = JSON.parse(localStorage.getItem("user")) || { name: "Guest User", email: "anonymous" };
    const quizData = JSON.parse(localStorage.getItem("quizResult"));

    if(!comment.trim()) {
        alert("Please enter a comment before submitting.");
        return;
    }

    const feedbackPayload = {
        userName: user.name,
        userEmail: user.email,
        stars: rating,
        message: comment,
        score: `${quizData.score}/${quizData.total}`,
        timestamp: new Date() // Firestore uses its own Timestamp object when sent a Date
    };

    try {
        // Ensure 'db' is initialized in your global scripts (e.g., config.js or firebase-init.js)
        await db.collection("feedbacks").add(feedbackPayload);
        alert("Success! Thank you for your feedback.");
        closeFeedback();
    } catch (error) {
        console.error("Submission error:", error);
        alert("Could not submit feedback. Please ensure you are connected to the internet.");
    }
}
</script>
</body>
</html>
