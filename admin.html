<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0f172a;
--surface:#1e293b;
--text:#f8fafc;
--border:#334155;
--amber:#f59e0b;
--danger:#ef4444;
--green:#22c55e;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
margin:0;
}

/* NAVIGATION */

nav{
background:var(--surface);
border-bottom:2px solid var(--border);
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
}

.brand{
font-size:22px;
font-weight:800;
color:var(--amber);
text-decoration:none;
}

.nav-links{
display:flex;
gap:12px;
align-items:center;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:11px;
font-weight:800;
text-transform:uppercase;
}

.nav-links a.active{
color:var(--green);
}

/* ADMIN CONTAINER */

.container{
width:95%;
max-width:1200px;
margin:30px auto;
}

/* PANELS */

.panel{
background:var(--surface);
padding:20px;
border-radius:12px;
margin-bottom:25px;
border:1px solid var(--border);
}

h2{
margin-top:0;
color:var(--amber);
}

/* INPUTS */

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#020617;
color:white;
}

textarea{
height:200px;
}

/* BUTTONS */

button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
font-weight:700;
}

.upload{
background:var(--green);
color:white;
}

.delete{
background:var(--danger);
color:white;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid var(--border);
text-align:left;
}

img{
max-width:80px;
border-radius:6px;
}

footer{
text-align:center;
padding:20px;
background:#020617;
color:#94a3b8;
}

</style>
</head>

<body>

<nav>

<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>

<div class="nav-links">

<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="quiz.html">Take Quiz</a>
<a href="leaderboard.html">Leaderboard</a>

<a href="admin.html" class="active">Admin</a>

<a onclick="logout()" style="color:#ef4444;cursor:pointer;">Logout</a>

</div>

</nav>


<div class="container">

<!-- Upload JSON -->

<div class="panel">

<h2>Upload JSON File</h2>

<input type="file" id="jsonFile">

<button class="upload" onclick="uploadFile()">Upload File</button>

</div>


<!-- Paste JSON -->

<div class="panel">

<h2>Paste JSON Questions</h2>

<textarea id="jsonPaste" placeholder="Paste JSON questions here"></textarea>

<button class="upload" onclick="uploadPaste()">Upload Pasted Questions</button>

</div>


<!-- Filters -->

<div class="panel">

<h2>Filter Questions</h2>

<select id="filterClass">
<option value="">All Classes</option>
<option value="class1">Class 1</option>
<option value="class2">Class 2</option>
<option value="class3">Class 3</option>
<option value="class4">Class 4</option>
<option value="class5">Class 5</option>
<option value="class6">Class 6</option>
<option value="class7">Class 7</option>
<option value="class8">Class 8</option>
<option value="class9">Class 9</option>
<option value="class10">Class 10</option>
</select>

<select id="filterSubject">
<option value="">All Subjects</option>
<option value="maths">Maths</option>
<option value="science">Science</option>
<option value="english">English</option>
<option value="reasoning">Reasoning</option>
</select>

<button class="upload" onclick="loadQuestions()">Apply Filter</button>

</div>


<!-- Delete -->

<div class="panel">

<h2>Delete Questions</h2>

<input placeholder="class1 - class10" id="deleteClass">
<button class="delete" onclick="deleteByClass()">Delete by Class</button>

<br><br>

<input placeholder="maths / science / english / reasoning" id="deleteSubject">
<button class="delete" onclick="deleteBySubject()">Delete by Subject</button>

<br><br>

<button class="delete" onclick="deleteAll()">Delete ALL Questions</button>

</div>


<!-- Table -->

<div class="panel">

<h2>Total Questions: <span id="count">0</span></h2>

<table>

<thead>

<tr>
<th>Class</th>
<th>Subject</th>
<th>Question</th>
<th>Image</th>
<th>Action</th>
</tr>

</thead>

<tbody id="questionsTable"></tbody>

</table>

</div>

</div>


<footer>

© 2026 Olympiad Portal

</footer>


<script>

function logout(){
if(confirm("Are you sure you want to logout?")){
window.location.href="login.html";
}
}

</script>

</body>
</html>
