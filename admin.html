<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - Olympiad Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0f172a;
--surface:#1e293b;
--text:#f8fafc;
--border:#334155;
--amber:#f59e0b;
--danger:#ef4444;
--green:#22c55e;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
margin:0;
}

nav{
background:var(--surface);
border-bottom:2px solid var(--border);
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
font-size:22px;
font-weight:800;
color:var(--amber);
text-decoration:none;
}

.nav-links{
display:flex;
gap:12px;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:11px;
font-weight:800;
text-transform:uppercase;
}

.nav-links a.active{
color:var(--green);
}

.container{
width:95%;
max-width:1200px;
margin:30px auto;
}

.panel{
background:var(--surface);
padding:20px;
border-radius:12px;
margin-bottom:25px;
border:1px solid var(--border);
}

h2{
margin-top:0;
color:var(--amber);
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
background:#020617;
color:white;
}

textarea{
height:200px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
font-weight:700;
}

.upload{
background:var(--green);
color:white;
}

.delete{
background:var(--danger);
color:white;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid var(--border);
text-align:left;
}

img{
max-width:80px;
border-radius:6px;
}

</style>
</head>

<body>

<nav>

<a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="quiz.html">Take Quiz</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="admin.html" class="active">Admin</a>
<a onclick="logout()" style="color:#ef4444;cursor:pointer;">Logout</a>
</div>

</nav>

<div class="container">

<div class="panel">

<h2>Upload JSON File</h2>

<input type="file" id="jsonFile">
<button class="upload" onclick="uploadFile()">Upload File</button>

</div>


<div class="panel">

<h2>Paste JSON Questions</h2>

<textarea id="jsonPaste"></textarea>

<button class="upload" onclick="uploadPaste()">Upload Pasted Questions</button>
<button class="upload" onclick="pasteClipboard()">Paste</button>
<button class="delete" onclick="clearPaste()">Clear</button>

</div>


<div class="panel">

<h2>Delete Questions</h2>

<label>Delete by Class</label>
<input id="deleteClass" placeholder="example: class2">
<button class="delete" onclick="deleteByClass()">Delete by Class</button>

<br><br>

<label>Delete by Subject</label>
<input id="deleteSubject" placeholder="example: maths">
<button class="delete" onclick="deleteBySubject()">Delete by Subject</button>

<br><br>

<button class="delete" onclick="deleteAll()">Delete ALL Questions</button>

</div>


<div class="panel">

<h2>Total Questions: <span id="count">0</span></h2>

<table>

<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Question</th>
<th>Image</th>
<th>Action</th>
</tr>
</thead>

<tbody id="questionsTable"></tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, query, where }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain:"olympiad-portal-d2a5e.firebaseapp.com",
projectId:"olympiad-portal-d2a5e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const questionsRef=collection(db,"questions");

window.deleteByClass=async function(){

const c=document.getElementById("deleteClass").value;

const q=query(questionsRef,where("class","==",c));

const snapshot=await getDocs(q);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Class questions deleted");

loadQuestions();

}

window.deleteBySubject=async function(){

const s=document.getElementById("deleteSubject").value;

const q=query(questionsRef,where("subject","==",s));

const snapshot=await getDocs(q);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Subject questions deleted");

loadQuestions();

}

window.deleteAll=async function(){

if(!confirm("Delete ALL questions?")) return;

const snapshot=await getDocs(questionsRef);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

loadQuestions();

}

window.onload=loadQuestions;

</script>

</body>
</html>
