<!DOCTYPE html>
<html>
<head>
<title>Olympiad Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}

h1{
color:#38bdf8;
}

.panel{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.upload{background:#22c55e;color:white;}
.delete{background:#ef4444;color:white;}

input,textarea{
padding:10px;
margin-top:10px;
width:100%;
border-radius:6px;
border:none;
}

textarea{
height:200px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:left;
}

img{
max-width:80px;
border-radius:6px;
}

</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
projectId: "olympiad-portal-d2a5e",
storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId: "341855557503",
appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const questionsRef = collection(db,"questions");


/* FILE UPLOAD */

window.uploadJSON = async function(){

const file = document.getElementById("jsonFile").files[0];

if(!file){
alert("Select JSON file");
return;
}

const text = await file.text();
const data = JSON.parse(text);

for(const q of data){
await addDoc(questionsRef,q);
}

alert("Questions uploaded successfully");

loadQuestions();

}


/* PASTE JSON */

window.uploadPaste = async function(){

const text = document.getElementById("jsonPaste").value;

if(!text){
alert("Paste JSON questions");
return;
}

const data = JSON.parse(text);

for(const q of data){
await addDoc(questionsRef,q);
}

alert("Questions uploaded");

document.getElementById("jsonPaste").value="";

loadQuestions();

}


/* LOAD QUESTIONS */

window.loadQuestions = async function(){

const snapshot = await getDocs(questionsRef);

let html="";

snapshot.forEach((d)=>{

const q=d.data();

html+=`
<tr>
<td>${q.class}</td>
<td>${q.subject}</td>
<td>${q.q.substring(0,60)}...</td>
<td>${q.image_url?`<img src="${q.image_url}">`:"-"}</td>
<td><button onclick="deleteQuestion('${d.id}')" class="delete">Delete</button></td>
</tr>
`;

});

document.getElementById("questionsTable").innerHTML=html;

document.getElementById("count").innerText=snapshot.size;

}


/* DELETE SINGLE */

window.deleteQuestion = async function(id){

if(!confirm("Delete this question?")) return;

await deleteDoc(doc(db,"questions",id));

loadQuestions();

}


/* DELETE BY CLASS */

window.deleteByClass = async function(){

const c=document.getElementById("classDelete").value;

const q=query(questionsRef,where("class","==",c));

const snapshot=await getDocs(q);

snapshot.forEach(async (d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Deleted");

loadQuestions();

}


/* DELETE BY SUBJECT */

window.deleteBySubject = async function(){

const s=document.getElementById("subjectDelete").value;

const q=query(questionsRef,where("subject","==",s));

const snapshot=await getDocs(q);

snapshot.forEach(async (d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Deleted");

loadQuestions();

}


/* DELETE ALL */

window.deleteAll = async function(){

if(!confirm("Delete ALL questions?")) return;

const snapshot=await getDocs(questionsRef);

snapshot.forEach(async (d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

loadQuestions();

}

window.onload=loadQuestions;

</script>

</head>

<body>

<h1>🎓 Olympiad Admin Dashboard</h1>


<div class="panel">

<h3>Upload Questions (JSON File)</h3>

<input type="file" id="jsonFile">
<button onclick="uploadJSON()" class="upload">Upload File</button>

</div>


<div class="panel">

<h3>Paste JSON Questions</h3>

<textarea id="jsonPaste" placeholder="Paste JSON questions here..."></textarea>

<button onclick="uploadPaste()" class="upload">Upload Pasted Questions</button>

</div>


<div class="panel">

<h3>Delete Questions</h3>

<input placeholder="class2" id="classDelete">
<button onclick="deleteByClass()" class="delete">Delete by Class</button>

<br><br>

<input placeholder="maths" id="subjectDelete">
<button onclick="deleteBySubject()" class="delete">Delete by Subject</button>

<br><br>

<button onclick="deleteAll()" class="delete">Delete ALL Questions</button>

</div>


<div class="panel">

<h3>Questions (<span id="count">0</span>)</h3>

<table>

<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Question</th>
<th>Image</th>
<th>Action</th>
</tr>
</thead>

<tbody id="questionsTable"></tbody>

</table>

</div>

</body>
</html>
