<!DOCTYPE html>
<html>
<head>
<title>Olympiad Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}

h1{color:#38bdf8;}

.panel{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.upload{background:#22c55e;color:white;}
.delete{background:#ef4444;color:white;}

input,textarea,select{
padding:10px;
margin-top:10px;
border-radius:6px;
border:none;
width:100%;
}

textarea{height:200px;}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:left;
}

img{
max-width:80px;
border-radius:6px;
}

.filter{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.filter select{
width:200px;
}

</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
projectId: "olympiad-portal-d2a5e",
storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
messagingSenderId: "341855557503",
appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const questionsRef = collection(db,"questions");

/* Upload JSON File */

window.uploadFile = async function(){

const file = document.getElementById("jsonFile").files[0];

if(!file){
alert("Select JSON file");
return;
}

const text = await file.text();
const data = JSON.parse(text);

for(const q of data){
await addDoc(questionsRef,q);
}

alert("Upload successful");

loadQuestions();
}

/* Upload Pasted JSON */

window.uploadPaste = async function(){

const text = document.getElementById("jsonPaste").value;

if(!text){
alert("Paste JSON questions");
return;
}

const data = JSON.parse(text);

for(const q of data){
await addDoc(questionsRef,q);
}

alert("Questions uploaded");

document.getElementById("jsonPaste").value="";

loadQuestions();
}

/* Load Questions */

window.loadQuestions = async function(){

const classFilter=document.getElementById("filterClass").value;
const subjectFilter=document.getElementById("filterSubject").value;

let q=questionsRef;

if(classFilter){
q=query(q,where("class","==",classFilter));
}

if(subjectFilter){
q=query(q,where("subject","==",subjectFilter));
}

const snapshot=await getDocs(q);

let html="";

snapshot.forEach((d)=>{

const q=d.data();

html+=`
<tr>
<td>${q.class}</td>
<td>${q.subject}</td>
<td>${q.q.substring(0,70)}...</td>
<td>${q.image_url?`<img src="${q.image_url}">`:"-"}</td>
<td>
<button onclick="deleteQuestion('${d.id}')" class="delete">Delete</button>
</td>
</tr>
`;

});

document.getElementById("questionsTable").innerHTML=html;
document.getElementById("count").innerText=snapshot.size;

}

/* Delete Single Question */

window.deleteQuestion = async function(id){

const confirmDelete = confirm("⚠️ WARNING!\n\nDelete this question?\nThis action cannot be undone.");

if(!confirmDelete) return;

await deleteDoc(doc(db,"questions",id));

alert("Question deleted");

loadQuestions();
}

/* Delete by Class */

window.deleteByClass = async function(){

const c=document.getElementById("deleteClass").value;

if(!c){
alert("Enter class");
return;
}

const confirmDelete = confirm("⚠️ WARNING!\n\nDelete ALL questions of "+c+" ?");

if(!confirmDelete) return;

const q=query(questionsRef,where("class","==",c));

const snapshot=await getDocs(q);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Questions deleted");

loadQuestions();
}

/* Delete by Subject */

window.deleteBySubject = async function(){

const s=document.getElementById("deleteSubject").value;

if(!s){
alert("Enter subject");
return;
}

const confirmDelete = confirm("⚠️ WARNING!\n\nDelete ALL "+s+" questions ?");

if(!confirmDelete) return;

const q=query(questionsRef,where("subject","==",s));

const snapshot=await getDocs(q);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("Questions deleted");

loadQuestions();
}

/* Delete All Questions */

window.deleteAll = async function(){

const confirmDelete = confirm("🚨 DANGER!\n\nYou are about to delete ALL questions.\nThis cannot be undone.\n\nContinue?");

if(!confirmDelete) return;

const confirmFinal = confirm("FINAL CONFIRMATION\n\nAre you absolutely sure?");

if(!confirmFinal) return;

const snapshot=await getDocs(questionsRef);

snapshot.forEach(async(d)=>{
await deleteDoc(doc(db,"questions",d.id));
});

alert("All questions deleted");

loadQuestions();
}

window.onload=loadQuestions;

</script>

</head>

<body>

<h1>🎓 Olympiad Admin Dashboard</h1>

<div class="panel">

<h3>Upload JSON File</h3>

<input type="file" id="jsonFile">
<button onclick="uploadFile()" class="upload">Upload File</button>

</div>

<div class="panel">

<h3>Paste JSON Questions</h3>

<textarea id="jsonPaste" placeholder="Paste JSON questions here"></textarea>

<button onclick="uploadPaste()" class="upload">Upload Pasted Questions</button>

</div>

<div class="panel">

<h3>Filter Questions</h3>

<div class="filter">

<select id="filterClass">
<option value="">All Classes</option>
<option value="class1">Class 1</option>
<option value="class2">Class 2</option>
<option value="class3">Class 3</option>
<option value="class4">Class 4</option>
<option value="class5">Class 5</option>
<option value="class6">Class 6</option>
<option value="class7">Class 7</option>
<option value="class8">Class 8</option>
<option value="class9">Class 9</option>
<option value="class10">Class 10</option>
</select>

<select id="filterSubject">
<option value="">All Subjects</option>
<option value="maths">Maths</option>
<option value="science">Science</option>
<option value="english">English</option>
</select>

<button onclick="loadQuestions()" class="upload">Apply Filter</button>

</div>

</div>

<div class="panel">

<h3>Delete Questions</h3>

<input placeholder="class1 - class10" id="deleteClass">
<button onclick="deleteByClass()" class="delete">Delete by Class</button>

<br><br>

<input placeholder="maths / science / english" id="deleteSubject">
<button onclick="deleteBySubject()" class="delete">Delete by Subject</button>

<br><br>

<button onclick="deleteAll()" class="delete">Delete ALL Questions</button>

</div>

<div class="panel">

<h3>Total Questions: <span id="count">0</span></h3>

<table>

<thead>
<tr>
<th>Class</th>
<th>Subject</th>
<th>Question</th>
<th>Image</th>
<th>Action</th>
</tr>
</thead>

<tbody id="questionsTable"></tbody>

</table>

</div>

</body>
</html>
