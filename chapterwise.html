<script>
    // ... sofTopics object remains the same as provided in previous turns ...

    function updateTopics() {
        const cls = document.getElementById("classSelect").value;
        const sub = document.getElementById("subjectSelect").value;
        const ts = document.getElementById("topicSelect");
        ts.innerHTML = "";
        if (sofTopics[cls] && sofTopics[cls][sub]) {
            ts.innerHTML = '<option value="" disabled selected>Choose a Topic...</option>';
            sofTopics[cls][sub].forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.code; // This is the "S15", "M01" code
                opt.textContent = `${t.code} - ${t.name}`;
                opt.dataset.name = t.name; // Clean name without the code
                ts.appendChild(opt);
            });
        } else {
            ts.innerHTML = '<option value="" disabled selected>Coming Soon...</option>';
        }
    }

    function startPractice() {
        const cls = document.getElementById("classSelect").value;
        const sub = document.getElementById("subjectSelect").value;
        const ts = document.getElementById("topicSelect");
        const selectedOpt = ts.options[ts.selectedIndex];

        if (!sub || !ts.value) {
            alert("Please select both a subject and a topic.");
            return;
        }

        // Save everything to localStorage for the quiz page
        localStorage.setItem("selectedClass", cls);
        localStorage.setItem("selectedSubject", sub);
        localStorage.setItem("selectedTopic", ts.value); // This saves "S15"
        localStorage.setItem("selectedTopicName", selectedOpt.dataset.name); // This saves "Light"
        localStorage.setItem("isChampionship", "false");

        window.location.href = "quiz.html";
    }
</script>
