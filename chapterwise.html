        .selection-box {

            border: none;
            border-radius: 14px;

    function updateTopics() {
        const selectedClass = document.getElementById("classSelect").value;
        const selectedSubject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");

        topicSelect.innerHTML = "";

        if (!selectedClass || !selectedSubject || !sofTopics[selectedClass] || !sofTopics[selectedClass][selectedSubject]) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "Select subject first...";
            option.disabled = true;
            option.selected = true;
            topicSelect.appendChild(option);
            return;
        }

        const topicList = sofTopics[selectedClass][selectedSubject];

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Choose a Topic...";
        defaultOption.disabled = true;
        defaultOption.selected = true;
        topicSelect.appendChild(defaultOption);

        topicList.forEach(topic => {
            const option = document.createElement("option");
            option.value = topic.code;
            option.textContent = `${topic.code} - ${topic.name}`;
            option.setAttribute("data-topic-name", topic.name);
            topicSelect.appendChild(option);
        });
    }

    function startPractice() {
        const classSelect = document.getElementById("classSelect");
        const subjectSelect = document.getElementById("subjectSelect");
        const topicSelect = document.getElementById("topicSelect");

        const selectedClass = classSelect.value;
        const selectedSubject = subjectSelect.value;
        const selectedTopic = topicSelect.value;
        const selectedTopicOption = topicSelect.options[topicSelect.selectedIndex];

        if (!selectedSubject || !selectedTopic) {
            alert("Please select both a subject and a topic.");
            return;
        }

        const selectedTopicName =
            selectedTopicOption?.getAttribute("data-topic-name") ||
            (selectedTopicOption?.textContent || "").replace(/^[A-Z]\d+\s*-\s*/i, "").trim();

        localStorage.setItem("selectedClass", selectedClass);
        localStorage.setItem("selectedSubject", selectedSubject);
        localStorage.setItem("selectedTopic", selectedTopic);
        localStorage.setItem("selectedTopicName", selectedTopicName);
        localStorage.setItem("isChampionship", "false");

        window.location.href = "quiz.html";
    }

    window.addEventListener("DOMContentLoaded", () => {
        const savedClass = localStorage.getItem("selectedClass");
        const savedSubject = localStorage.getItem("selectedSubject");

        if (savedClass && document.querySelector(`#classSelect option[value="${savedClass}"]`)) {
            document.getElementById("classSelect").value = savedClass;
        }

        if (savedSubject && document.querySelector(`#subjectSelect option[value="${savedSubject}"]`)) {
            document.getElementById("subjectSelect").value = savedSubject;
        }

        updateTopics();

        const savedTopic = localStorage.getItem("selectedTopic");
        if (savedTopic && document.querySelector(`#topicSelect option[value="${savedTopic}"]`)) {
            document.getElementById("topicSelect").value = savedTopic;
        }
    });
