<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7631964396609524"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter-wise Practice Questions | Science & Math Olympiad</title>
    
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --brand: #38bdf8;
            --accent: #818cf8;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --glass: rgba(15, 23, 42, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg);
            min-height: 100vh; 
            color: var(--text);
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), 
                              radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav {
            background: rgba(2, 6, 23, 0.8); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            padding: 15px 5%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            position: sticky; top: 0; z-index: 1000;
        }
        
        .brand { font-size: 1.4rem; font-weight: 700; color: #ffffff; text-decoration: none; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--brand); }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }

        .selection-box {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-top: 4px solid var(--brand);
            padding: 50px;
            border-radius: 28px;
            width: 100%;
            max-width: 750px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .selection-box h2 { font-size: 2rem; margin-bottom: 8px; font-weight: 800; }
        .selection-box h2 span { color: var(--brand); }
        .selection-box p { color: var(--muted); margin-bottom: 40px; font-size: 1.05rem; }

        .form-group { 
            text-align: left; 
            margin-bottom: 20px; 
            background: rgba(255, 255, 255, 0.02); 
            padding: 24px; 
            border-radius: 18px; 
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .form-group:focus-within {
            border-color: var(--brand);
            background: rgba(56, 189, 248, 0.04);
        }

        .step-label { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--brand); 
            margin-bottom: 14px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .step-number { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 22px; 
            height: 22px; 
            background: var(--brand); 
            color: var(--bg); 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 800;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            background-size: 1.1em;
            transition: 0.2s;
        }

        .btn-start {
            width: 100%;
            margin-top: 10px;
            padding: 18px;
            background: var(--brand);
            color: var(--bg);
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
        }

        .btn-start:disabled {
            background: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div id="main-app-container">
    <nav>
        <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a onclick="logout()" style="color: var(--danger); cursor: pointer;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="selection-box">
            <h2>Chapter-wise <span>Practice</span></h2>
            <p>Select your grade and subject to begin.</p>

            <div class="form-group">
                <div class="step-label"><span class="step-number">1</span> Select Grade</div>
                <select id="classSelect" onchange="updateTopics()">
                    <option value="class1">Grade 1</option>
                    <option value="class2">Grade 2</option>
                    <option value="class3">Grade 3</option>
                    <option value="class4">Grade 4</option>
                    <option value="class5">Grade 5</option>
                    <option value="class6">Grade 6</option>
                    <option value="class7">Grade 7</option>
                    <option value="class8">Grade 8</option>
                    <option value="class9">Grade 9</option>
                </select>
            </div>

            <div class="form-group">
                <div class="step-label"><span class="step-number">2</span> Select Subject</div>
                <select id="subjectSelect" onchange="updateTopics()">
                    <option value="" disabled selected>Choose a Subject...</option>
                    <option value="maths">Mathematics (IMO)</option>
                    <option value="science">Science (NSO)</option>
                </select>
            </div>

            <div class="form-group">
                <div class="step-label"><span class="step-number">3</span> Select Topic</div>
                <select id="topicSelect">
                    <option value="" disabled selected>Select subject first...</option>
                </select>
            </div>

            <button class="btn-start" id="startBtn" onclick="startPractice()">Start Practice</button>
        </div>
    </div>
</div>

<script>
    const sofTopics = {
        class1: { maths: [{code:"M01", name:"Number Sense"}], science: [{code:"S01", name:"Plants"}] },
        class2: { maths: [{code:"M01", name:"Number Sense"}], science: [{code:"S01", name:"Plants"}] },
        class3: { maths: [{code:"M01", name:"Number Sense"}], science: [{code:"S01", name:"Plants"}] },
        class4: { maths: [{code:"M01", name:"Number Sense"}], science: [{code:"S01", name:"Plants"}] },
        class5: { maths: [{code:"M01", name:"Number Sense"}], science: [{code:"S01", name:"Plants"}] },
        class6: { maths: [{code:"M01", name:"Knowing Our Numbers"}], science: [{code:"S01", name:"Food"}] },
        class7: { maths: [{code:"M01", name:"Integers"}], science: [{code:"S01", name:"Nutrition"}] },
        class8: {
            maths: [
                { code: "M01", name: "Rational Numbers" }, { code: "M02", name: "Linear Equations" },
                { code: "M03", name: "Quadrilaterals" }, { code: "M04", name: "Practical Geometry" },
                { code: "M05", name: "Data Handling" }, { code: "M06", name: "Squares and Roots" },
                { code: "M07", name: "Cubes and Roots" }, { code: "M08", name: "Comparing Quantities" },
                { code: "M09", name: "Algebraic Expressions" }, { code: "M10", name: "Solid Shapes" },
                { code: "M11", name: "Mensuration" }, { code: "M12", name: "Exponents" },
                { code: "M13", name: "Proportions" }, { code: "M14", name: "Factorisation" },
                { code: "M15", name: "Graphs" }
            ],
            science: [
                { code: "S01", name: "Crop Production" }, { code: "S02", name: "Microorganisms" },
                { code: "S03", name: "Fibres & Plastics" }, { code: "S04", name: "Metals & Non-Metals" },
                { code: "S05", name: "Coal & Petroleum" }, { code: "S06", name: "Combustion" },
                { code: "S07", name: "Conservation" }, { code: "S08", name: "Cell Structure" },
                { code: "S09", name: "Reproduction" }, { code: "S10", name: "Force & Pressure" },
                { code: "S11", name: "Friction" }, { code: "S12", name: "Sound" },
                { code: "S13", name: "Chemical Effects" }, { code: "S14", name: "Natural Phenomena" },
                { code: "S15", name: "Light" }, { code: "S16", name: "Solar System" }
            ]
        },
        class9: {
            maths: [
                { code: "M01", name: "Number Systems" }, { code: "M02", name: "Polynomials" },
                { code: "M03", name: "Coordinate Geometry" }, { code: "M04", name: "Linear Equations" },
                { code: "M05", name: "Euclid’s Geometry" }, { code: "M06", name: "Lines and Angles" },
                { code: "M07", name: "Triangles" }, { code: "M08", name: "Quadrilaterals" },
                { code: "M09", name: "Areas" }, { code: "M10", name: "Circles" },
                { code: "M11", name: "Heron’s Formula" }, { code: "M12", name: "Surface Areas" },
                { code: "M13", name: "Statistics" }, { code: "M14", name: "Probability" }
            ],
            science: [
                { code: "S01", name: "Matter in Surroundings" }, { code: "S02", name: "Is Matter Pure?" },
                { code: "S03", name: "Atoms & Molecules" }, { code: "S04", name: "Structure of Atom" },
                { code: "S05", name: "Cell: Fundamental Unit" }, { code: "S06", name: "Tissues" },
                { code: "S07", name: "Motion" }, { code: "S08", name: "Force & Motion" },
                { code: "S09", name: "Gravitation" }, { code: "S10", name: "Work & Energy" },
                { code: "S11", name: "Sound" }, { code: "S12", name: "Food Resources" },
                { code: "S13", name: "Diversity" }, { code: "S14", name: "Natural Resources" },
                { code: "S15", name: "Why Do We Fall Ill" }
            ]
        }
    };

    function updateTopics() {
        const subject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");
        const selectedClass = document.getElementById("classSelect").value;

        topicSelect.innerHTML = "";

        if (selectedClass && subject && sofTopics[selectedClass] && sofTopics[selectedClass][subject]) {
            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Choose a Topic...";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            topicSelect.appendChild(defaultOption);

            sofTopics[selectedClass][subject].forEach(topic => {
                const option = document.createElement("option");
                option.value = topic.code;
                option.textContent = topic.code + " - " + topic.name;
                topicSelect.appendChild(option);
            });
        } else {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "Select subject first...";
            option.disabled = true;
            option.selected = true;
            topicSelect.appendChild(option);
        }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.startPractice = async () => {
        const selectedClass = document.getElementById("classSelect").value;
        const selectedSubject = document.getElementById("subjectSelect").value;
        const selectedTopic = document.getElementById("topicSelect").value;
        const startBtn = document.getElementById("startBtn");

        if (!selectedSubject || !selectedTopic) {
            alert("Please select both a subject and a topic.");
            return;
        }

        startBtn.disabled = true;
        startBtn.innerText = "Checking Quiz...";

        try {
            // Check if at least one question exists for this specific combination
            const q = query(
                collection(db, "questions"),
                where("class", "==", selectedClass),
                where("subject", "==", selectedSubject),
                where("topic", "==", selectedTopic),
                limit(1)
            );

            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("Coming Soon! We are currently uploading questions for this specific chapter. Please try another one.");
                startBtn.disabled = false;
                startBtn.innerText = "Start Practice";
            } else {
                // Questions found! Proceed to quiz
                localStorage.setItem("selectedClass", selectedClass);
                localStorage.setItem("selectedSubject", selectedSubject);
                localStorage.setItem("selectedTopic", selectedTopic);
                localStorage.setItem("isChampionship", "false");
                window.location.href = "quiz.html";
            }
        } catch (error) {
            console.error("Error checking questions: ", error);
            alert("Connection error. Please try again.");
            startBtn.disabled = false;
            startBtn.innerText = "Start Practice";
        }
    };

    window.logout = async () => {
        await signOut(auth);
        localStorage.clear();
        window.location.replace("index.html");
    };
</script>
</body>
</html>
