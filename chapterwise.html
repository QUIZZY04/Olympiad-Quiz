<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7631964396609524"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter-wise Practice Questions | Science & Math Olympiad</title>
    
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --brand: #38bdf8;
            --accent: #818cf8;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg);
            min-height: 100vh; 
            color: var(--text);
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav {
            background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            padding: 20px 5%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            position: sticky; top: 0; z-index: 1000;
        }
        
        .brand { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-decoration: none; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a { color: var(--muted); text-decoration: none; font-weight: 600; text-transform: uppercase; }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .selection-box {
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 1px solid var(--border);
            border-top: 2px solid var(--brand);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        .form-group { text-align: left; margin-bottom: 25px; background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 16px; border: 1px solid var(--border); }
        
        .step-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; text-transform: uppercase; }

        .step-number { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--brand); color: white; border-radius: 50%; font-size: 12px; }

        select {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2em;
        }

        .btn-start {
            width: 100%;
            padding: 16px;
            background: var(--brand);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="main-app-container">
    <nav>
        <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a onclick="logout()" style="color: var(--danger); cursor: pointer;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="selection-box">
            <h2>Grade 1 to 8 Chapterwise <span>Quiz</span></h2>
            <p>Select your details to start practicing.</p>

            <div class="form-group">
                <div class="step-label"><span class="step-number">1</span> Select Grade</div>
                <select id="classSelect" onchange="resetSelection()">
                    <option value="class1">Grade 1</option>
                    <option value="class2">Grade 2</option>
                    <option value="class3">Grade 3</option>
                    <option value="class4">Grade 4</option>
                    <option value="class5">Grade 5</option>
                    <option value="class6">Grade 6</option>
                    <option value="class7">Grade 7</option>
                    <option value="class8" selected>Grade 8</option>
                </select>
            </div>

            <div class="form-group">
                <div class="step-label"><span class="step-number">2</span> Select Subject</div>
                <select id="subjectSelect" onchange="updateTopics()">
                    <option value="" disabled selected>Choose a Subject...</option>
                    <option value="maths">Mathematics (IMO)</option>
                    <option value="science">Science (NSO)</option>
                </select>
            </div>

            <div class="form-group">
                <div class="step-label"><span class="step-number">3</span> Select Topic</div>
                <select id="topicSelect">
                    <option value="" disabled selected>Select subject first...</option>
                </select>
            </div>

            <button class="btn-start" onclick="startPractice()">Start Practice</button>
        </div>
    </div>
</div>

<script>
    const sofTopics = {
        class1: { 
            maths: [{code:"M01", name:"Number Sense"}, {code:"M02", name:"Addition"}, {code:"M03", name:"Subtraction"}], 
            science: [{code:"S01", name:"Plants"}, {code:"S02", name:"Animals"}, {code:"S03", name:"Human Body"}] 
        },
        class2: { 
            maths: [{code:"M01", name:"Number Sense"}, {code:"M02", name:"Computation Operations"}], 
            science: [{code:"S01", name:"Plants"}, {code:"S02", name:"Animals"}] 
        },
        class3: { 
            maths: [{code:"M01", name:"Number Sense"}, {code:"M02", name:"Fractions"}], 
            science: [{code:"S01", name:"Plants"}, {code:"S02", name:"Animals"}] 
        },
        class4: { 
            maths: [{code:"M01", name:"Number Sense"}, {code:"M02", name:"Weight and Capacity"}], 
            science: [{code:"S01", name:"Plants"}, {code:"S02", name:"Animals"}] 
        },
        class5: { 
            maths: [{code:"M01", name:"Number Sense"}, {code:"M02", name:"Decimals"}], 
            science: [{code:"S01", name:"Plants"}, {code:"S02", name:"Animals"}] 
        },
        class6: { 
            maths: [{code:"M01", name:"Knowing our Numbers"}, {code:"M02", name:"Whole Numbers"}], 
            science: [{code:"S01", name:"Food"}, {code:"S02", name:"Components of Food"}] 
        },
        class7: { 
            maths: [{code:"M01", name:"Integers"}, {code:"M02", name:"Fractions and Decimals"}], 
            science: [{code:"S01", name:"Nutrition in Plants"}, {code:"S02", name:"Nutrition in Animals"}] 
        },
        class8: {
            maths: [
                { code: "M01", name: "Rational Numbers" },
                { code: "M02", name: "Linear Equations in One Variable" },
                { code: "M03", name: "Understanding Quadrilaterals" },
                { code: "M04", name: "Practical Geometry" },
                { code: "M05", name: "Data Handling" },
                { code: "M06", name: "Squares and Square Roots" },
                { code: "M07", name: "Cubes and Cube Roots" },
                { code: "M08", name: "Comparing Quantities" },
                { code: "M09", name: "Algebraic Expressions and Identities" },
                { code: "M10", name: "Visualising Solid Shapes" },
                { code: "M11", name: "Mensuration" },
                { code: "M12", name: "Exponents and Powers" },
                { code: "M13", name: "Direct and Inverse Proportions" },
                { code: "M14", name: "Factorisation" },
                { code: "M15", name: "Intro to Graphs and Playing with Numbers" }
            ],
            science: [
                { code: "S01", name: "Crop Production and Management" },
                { code: "S02", name: "Microorganisms" },
                { code: "S03", name: "Synthetic Fibres and Plastics" },
                { code: "S04", name: "Materials: Metals and Non-Metals" },
                { code: "S05", name: "Coal and Petroleum" },
                { code: "S06", name: "Combustion and Flame" },
                { code: "S07", name: "Conservation of Plants and Animals" },
                { code: "S08", name: "Cell Structure and Functions" },
                { code: "S09", name: "Reproduction and Adolescence" },
                { code: "S10", name: "Force, Pressure and Friction" },
                { code: "S11", name: "Sound" },
                { code: "S12", name: "Chemical Effects of Electric Current" },
                { code: "S13", name: "Some Natural Phenomena" },
                { code: "S14", name: "Light" },
                { code: "S15", name: "Stars and Solar System" },
                { code: "S16", name: "Pollution of Air and Water" }
            ]
        }
    };

    function resetSelection() {
        // Clear subject and topic when grade changes
        document.getElementById("subjectSelect").value = "";
        const topicSelect = document.getElementById("topicSelect");
        topicSelect.innerHTML = '<option value="" disabled selected>Select subject first...</option>';
    }

    function updateTopics() {
        const subject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");
        const selectedClass = document.getElementById("classSelect").value; 

        // Clear previous options
        topicSelect.innerHTML = ""; 
        
        if (selectedClass && subject && sofTopics[selectedClass] && sofTopics[selectedClass][subject]) {
            // Add initial placeholder
            const placeholder = document.createElement("option");
            placeholder.textContent = "Select a Topic...";
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.selected = true;
            topicSelect.appendChild(placeholder);

            // Populate only the relevant subject topics
            sofTopics[selectedClass][subject].forEach(topic => {
                const option = document.createElement("option");
                option.value = topic.code; 
                option.textContent = topic.code + " - " + topic.name;
                topicSelect.appendChild(option);
            });
        } else {
            const option = document.createElement("option");
            option.textContent = "Select subject first...";
            option.disabled = true;
            option.selected = true;
            topicSelect.appendChild(option);
        }
    }

    function startPractice() {
        const selectedClass = document.getElementById("classSelect").value;
        const selectedSubject = document.getElementById("subjectSelect").value;
        const selectedTopic = document.getElementById("topicSelect").value;

        if(!selectedSubject || !selectedTopic) {
            alert("Please select both a subject and a topic.");
            return;
        }

        localStorage.setItem("selectedClass", selectedClass);
        localStorage.setItem("selectedSubject", selectedSubject);
        localStorage.setItem("selectedTopic", selectedTopic);
        localStorage.setItem("isChampionship", "false"); 
        window.location.href = "quiz.html";
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.logout = async () => {
        await signOut(auth);
        localStorage.clear();
        window.location.replace("index.html");
    };
</script>
</body>
</html>
