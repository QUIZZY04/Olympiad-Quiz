<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7631964396609524"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter-wise Practice Questions | Science & Math Olympiad</title>
    
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --brand: #38bdf8;
            --accent: #818cf8;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); min-height: 100vh; color: var(--text); display: flex; flex-direction: column; background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%); background-attachment: fixed; }
        nav { background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-decoration: none; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a { color: var(--muted); text-decoration: none; font-weight: 600; text-transform: uppercase; }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .selection-box { background: linear-gradient(145deg, #0f172a, #020617); border: 1px solid var(--border); border-top: 2px solid var(--brand); padding: 45px 40px; border-radius: 24px; width: 100%; max-width: 550px; text-align: center; }
        .form-group { text-align: left; margin-bottom: 25px; background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 16px; border: 1px solid var(--border); }
        .step-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; text-transform: uppercase; }
        .step-number { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--brand); color: white; border-radius: 50%; font-size: 12px; }
        select { width: 100%; padding: 14px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); outline: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em; }
        .btn-start { width: 100%; padding: 16px; background: var(--brand); color: #ffffff; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
<div id="main-app-container">
    <nav>
        <a href="dashboard.html" class="brand">🎓 Olympiad Portal</a>
        <div class="nav-links"><a href="dashboard.html">Dashboard</a><a onclick="logout()" style="color: var(--danger); cursor: pointer;">Logout</a></div>
    </nav>
    <div class="container">
        <div class="selection-box">
            <h2>Grade 1 to 9 <span>Practice</span></h2>
            <div class="form-group">
                <div class="step-label"><span class="step-number">1</span> Select Grade</div>
                <select id="classSelect" onchange="updateTopics()">
                    <option value="class1">Grade 1</option><option value="class2">Grade 2</option><option value="class3">Grade 3</option>
                    <option value="class4">Grade 4</option><option value="class5">Grade 5</option><option value="class6">Grade 6</option>
                    <option value="class7">Grade 7</option><option value="class8" selected>Grade 8</option><option value="class9">Grade 9</option>
                </select>
            </div>
            <div class="form-group">
                <div class="step-label"><span class="step-number">2</span> Select Subject</div>
                <select id="subjectSelect" onchange="updateTopics()">
                    <option value="" disabled selected>Choose a Subject...</option>
                    <option value="maths">Mathematics (IMO)</option>
                    <option value="science">Science (NSO)</option>
                </select>
            </div>
            <div class="form-group">
                <div class="step-label"><span class="step-number">3</span> Select Topic</div>
                <select id="topicSelect"><option value="" disabled selected>Select subject first...</option></select>
            </div>
            <button class="btn-start" onclick="startPractice()">Start Practice</button>
        </div>
    </div>
</div>

<script>
    const sofTopics = {
        class1: {
            maths: [{code:"M01",name:"Number Sense"},{code:"M02",name:"Addition"},{code:"M03",name:"Subtraction"},{code:"M04",name:"Measurements"},{code:"M05",name:"Money"},{code:"M06",name:"Time"},{code:"M07",name:"Shapes"}],
            science: [{code:"S01",name:"Plants"},{code:"S02",name:"Animals"},{code:"S03",name:"Human Body"},{code:"S04",name:"Food"},{code:"S05",name:"Housing/Clothing"},{code:"S06",name:"Environment"}]
        },
        class2: {
            maths: [{code:"M01",name:"Numbers"},{code:"M02",name:"Computation"},{code:"M03",name:"Length/Weight"},{code:"M04",name:"Time/Money"},{code:"M05",name:"Geometry"},{code:"M06",name:"Data"}],
            science: [{code:"S01",name:"Plants"},{code:"S02",name:"Animals"},{code:"S03",name:"Body/Health"},{code:"S04",name:"Food"},{code:"S05",name:"Housing"},{code:"S06",name:"Air/Water"}]
        },
        class3: {
            maths: [{code:"M01",name:"Numbers"},{code:"M02",name:"Arithmetic"},{code:"M03",name:"Fractions"},{code:"M04",name:"Money"},{code:"M05",name:"Measurement"},{code:"M06",name:"Geometry"}],
            science: [{code:"S01",name:"Plants/Animals"},{code:"S02",name:"Food"},{code:"S03",name:"Housing"},{code:"S04",name:"Human Body"},{code:"S05",name:"Matter"},{code:"S06",name:"Force"}]
        },
        class4: {
            maths: [{code:"M01",name:"Numbers"},{code:"M02",name:"Operations"},{code:"M03",name:"Fractions"},{code:"M04",name:"Measurement"},{code:"M05",name:"Geometry"},{code:"M06",name:"Data"}],
            science: [{code:"S01",name:"Plants"},{code:"S02",name:"Animals"},{code:"S03",name:"Food"},{code:"S04",name:"Human Needs"},{code:"S05",name:"Matter"},{code:"S06",name:"Force"}]
        },
        class5: {
            maths: [{code:"M01",name:"Numbers"},{code:"M02",name:"Operations"},{code:"M03",name:"Fractions"},{code:"M04",name:"Measurement"},{code:"M05",name:"Geometry"},{code:"M06",name:"Area/Volume"}],
            science: [{code:"S01",name:"Animals"},{code:"S02",name:"Plants"},{code:"S03",name:"Health"},{code:"S04",name:"Matter"},{code:"S05",name:"Energy"},{code:"S06",name:"Environment"}]
        },
        class6: {
            maths: [{code:"M01",name:"Numbers"},{code:"M02",name:"Whole Numbers"},{code:"M03",name:"Geometry"},{code:"M04",name:"Integers"},{code:"M05",name:"Fractions"},{code:"M06",name:"Algebra"},{code:"M07",name:"Ratio"}],
            science: [{code:"S01",name:"Food"},{code:"S02",name:"Materials"},{code:"S03",name:"Substances"},{code:"S04",name:"Plants"},{code:"S05",name:"Body"},{code:"S06",name:"Organisms"}]
        },
        class7: {
            maths: [{code:"M01",name:"Integers"},{code:"M02",name:"Fractions"},{code:"M03",name:"Equations"},{code:"M04",name:"Lines/Angles"},{code:"M05",name:"Triangles"},{code:"M11",name:"Perimeter/Area"}],
            science: [{code:"S01",name:"Nutrition"},{code:"S02",name:"Heat"},{code:"S03",name:"Acids/Bases"},{code:"S04",name:"Changes"},{code:"S05",name:"Respiration"},{code:"S10",name:"Light"}]
        },
        class8: {
            maths: [{code:"M01",name:"Rational Numbers"},{code:"M02",name:"Equations"},{code:"M03",name:"Quadrilaterals"},{code:"M05",name:"Data"},{code:"M06",name:"Squares/Roots"},{code:"M11",name:"Mensuration"}],
            science: [{code:"S01",name:"Crop Production"},{code:"S02",name:"Microorganisms"},{code:"S05",name:"Coal/Petroleum"},{code:"S06",name:"Combustion"},{code:"S11",name:"Force"},{code:"S16",name:"Light"}]
        },
        class9: {
            maths: [{code:"M01",name:"Number Systems"},{code:"M02",name:"Polynomials"},{code:"M03",name:"Geometry"},{code:"M04",name:"Linear Equations"},{code:"M07",name:"Triangles"},{code:"M10",name:"Circles"}],
            science: [{code:"S01",name:"Matter"},{code:"S02",name:"Atoms"},{code:"S03",name:"Cell"},{code:"S04",name:"Tissues"},{code:"S05",name:"Motion"},{code:"S09",name:"Gravitation"}]
        }
    };

    function updateTopics() {
        const cls = document.getElementById("classSelect").value;
        const sub = document.getElementById("subjectSelect").value;
        const ts = document.getElementById("topicSelect");
        ts.innerHTML = "";
        if (sofTopics[cls] && sofTopics[cls][sub]) {
            const defOpt = document.createElement("option");
            defOpt.value = ""; defOpt.textContent = "Choose a Topic..."; defOpt.disabled = true; defOpt.selected = true;
            ts.appendChild(defOpt);
            sofTopics[cls][sub].forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.code;
                opt.textContent = `${t.code} - ${t.name}`;
                opt.dataset.name = t.name;
                ts.appendChild(opt);
            });
        } else {
            const opt = document.createElement("option");
            opt.textContent = "Select subject first..."; opt.disabled = true; opt.selected = true;
            ts.appendChild(opt);
        }
    }

    function startPractice() {
        const cls = document.getElementById("classSelect").value;
        const sub = document.getElementById("subjectSelect").value;
        const ts = document.getElementById("topicSelect");
        const sel = ts.options[ts.selectedIndex];
        if (!sub || !ts.value) { alert("Please select both a subject and a topic."); return; }
        localStorage.setItem("selectedClass", cls);
        localStorage.setItem("selectedSubject", sub);
        localStorage.setItem("selectedTopic", ts.value);
        localStorage.setItem("selectedTopicName", sel.dataset.name);
        localStorage.setItem("isChampionship", "false");
        window.location.href = "quiz.html";
    }

    window.addEventListener("DOMContentLoaded", () => {
        const c = localStorage.getItem("selectedClass");
        const s = localStorage.getItem("selectedSubject");
        if (c) document.getElementById("classSelect").value = c;
        if (s) document.getElementById("subjectSelect").value = s;
        updateTopics();
        const t = localStorage.getItem("selectedTopic");
        if (t) document.getElementById("topicSelect").value = t;
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    const firebaseConfig = { apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", authDomain: "olympiad-portal-d2a5e.firebaseapp.com", projectId: "olympiad-portal-d2a5e", storageBucket: "olympiad-portal-d2a5e.firebasestorage.app" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.logout = async () => { await signOut(auth); localStorage.clear(); window.location.replace("index.html"); };
</script>
</body>
</html>
