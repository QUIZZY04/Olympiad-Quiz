<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapterwise Quiz - Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --brand: #38bdf8;
            --accent: #818cf8;
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg);
            min-height: 100vh; 
            color: var(--text);
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        nav {
            background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            padding: 20px 5%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 10px;
        }
        
        .brand { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-decoration: none; white-space: nowrap; }
        .nav-links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--brand); }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .selection-box {
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 1px solid var(--border);
            border-top: 2px solid var(--brand);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .selection-box h2 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: 800;
        }

        .selection-box h2 span {
            color: var(--brand);
        }

        .selection-box p {
            color: var(--muted);
            margin-bottom: 35px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        
        .form-group:hover {
            border-color: var(--brand);
            background: rgba(56, 189, 248, 0.05);
        }

        .step-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .step-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: var(--brand);
            color: white;
            border-radius: 50%;
            font-size: 12px;
        }

        select {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2em;
            transition: 0.2s;
        }

        select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn-start {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--brand);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-start:hover { 
            background: var(--accent); 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); 
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="brand">🚀 Olympiad Portal</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a onclick="logout()" style="color: var(--danger); cursor: pointer;">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="selection-box">
        <h2>📑 Chapterwise <span>Quiz</span></h2>
        <p>Master every concept by practicing specific topics from your school curriculum.</p>

        <div class="form-group">
            <div class="step-label">
                <span class="step-number">1</span>
                Select Grade
            </div>
            <select id="classSelect" onchange="updateTopics()">
                <option value="class1">Grade 1</option>
                <option value="class2">Grade 2</option>
                <option value="class3">Grade 3</option>
                <option value="class4">Grade 4</option>
                <option value="class5">Grade 5</option>
                <option value="class6" selected>Grade 6</option>
                <option value="class7">Grade 7</option>
                <option value="class8">Grade 8</option>
                <option value="class9">Grade 9</option>
                <option value="class10">Grade 10</option>
            </select>
        </div>

        <div class="form-group">
            <div class="step-label">
                <span class="step-number">2</span>
                Select Subject
            </div>
            <select id="subjectSelect" onchange="updateTopics()">
                <option value="" disabled selected>Choose a Subject...</option>
                <option value="maths">Mathematics (IMO)</option>
                <option value="science">Science (NSO)</option>
            </select>
        </div>

        <div class="form-group">
            <div class="step-label" id="topicStepLabel">
                <span class="step-number">3</span>
                Select Topic
            </div>
            <select id="topicSelect">
                <option value="" disabled selected>Select subject first...</option>
            </select>
        </div>

        <button class="btn-start" onclick="startPractice()">
            Start Practice →
        </button>
    </div>
</div>

<footer style="text-align:center;padding:30px;background:rgba(2, 6, 23, 0.8);border-top:1px solid var(--border);color:var(--muted);margin-top:auto;">
    <p style="font-size:14px;">© 2026 Olympiad Portal. All rights reserved.</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { SOF_CURRICULUM } from './topicMaster.js';

    const firebaseConfig = {
        apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
        authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
        projectId: "olympiad-portal-d2a5e",
        storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
        messagingSenderId: "341855557503",
        appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.updateTopics = function() {
        const selectedClass = document.getElementById("classSelect").value;
        const subject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");
        const topicStepLabel = document.getElementById("topicStepLabel");

        topicSelect.innerHTML = ""; 

        const topicMap = SOF_CURRICULUM[selectedClass]?.[subject];

        if (topicMap) {
            // Loop through the object entries [code, name]
            Object.entries(topicMap).forEach(([code, name]) => {
                const option = document.createElement("option");
                option.value = code; 
                option.textContent = `${code} - ${name}`;
                topicSelect.appendChild(option);
            });
            
            const className = document.getElementById("classSelect").options[document.getElementById("classSelect").selectedIndex].text;
            const subName = document.getElementById("subjectSelect").options[document.getElementById("subjectSelect").selectedIndex].text.split(' ')[0];
            topicStepLabel.innerHTML = `<span class="step-number">3</span> Select topic of ${subName} for ${className}`;
        } else {
            const option = new Option("Select subject first...", "");
            option.disabled = true;
            option.selected = true;
            topicSelect.add(option);
            topicStepLabel.innerHTML = `<span class="step-number">3</span> Select Topic`;
        }
    };

    window.startPractice = function() {
        const selectedClass = document.getElementById("classSelect").value;
        const selectedSubject = document.getElementById("subjectSelect").value;
        const topicSelect = document.getElementById("topicSelect");

        if(!selectedSubject || !topicSelect.value) {
            alert("Please select both a subject and a topic to proceed.");
            return;
        }

        localStorage.setItem("selectedClass", selectedClass);
        localStorage.setItem("selectedSubject", selectedSubject);
        localStorage.setItem("selectedTopic", topicSelect.value);
        localStorage.setItem("selectedTopicName", topicSelect.options[topicSelect.selectedIndex].text);
        localStorage.setItem("isChampionship", "false");

        window.location.href = "quiz.html";
    };

    window.logout = async () => {
        if (confirm("Logout?")) {
            await signOut(auth);
            window.location.href = "login.html";
        }
    };

    window.onload = window.updateTopics;
</script>
</body>
</html>
