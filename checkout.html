<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Olympiad Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .checkout-card { 
            background: linear-gradient(145deg, #0f172a, #020617); 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid #1e293b; 
            border-top: 2px solid #38bdf8;
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h1 { color: #38bdf8; font-weight: 800; font-size: 24px; margin-bottom: 30px; }
        .order-summary { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: left; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #cbd5e1; }
        .summary-row.total { font-weight: 800; font-size: 18px; color: #fff; margin-top: 20px; padding-top: 15px; border-top: 1px dashed #334155; margin-bottom: 0; }
        .pay-btn { background: #10b981; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 16px; width: 100%; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .pay-btn:hover { background: #059669; transform: translateY(-2px); }
        .cancel-link { display: block; margin-top: 20px; color: #ef4444; text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="checkout-card">
        <h1>🔒 Secure Checkout</h1>
        <div class="order-summary">
            <div class="summary-row"><span>Test Session:</span> <span id="itemTitle" style="font-weight:600; color:#fff; text-align:right; max-width:60%;">Loading...</span></div>
            <div class="summary-row"><span>Access:</span> <span>1 Attempt / Unlimited Prep</span></div>
            <div class="summary-row total"><span>Total Payable:</span> <span id="itemPrice">₹0</span></div>
        </div>
        <button id="payButton" class="pay-btn">Proceed to Pay</button>
        <a href="live.html" class="cancel-link">Cancel and return to Arena</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY",
            authDomain: "olympiad-portal-d2a5e.firebaseapp.com",
            projectId: "olympiad-portal-d2a5e",
            storageBucket: "olympiad-portal-d2a5e.firebasestorage.app",
            messagingSenderId: "341855557503",
            appId: "1:341855557503:web:5cb0c3a9ee424a6db0ec4a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const sId = localStorage.getItem("checkoutSessionId");
        const price = localStorage.getItem("checkoutPrice");
        const title = localStorage.getItem("checkoutTitle");

        if(!sId) window.location.href = "live.html";

        document.getElementById("itemTitle").innerText = title;
        document.getElementById("itemPrice").innerText = "₹" + price;

        let userEmail = "";
        let userName = "Student";

        onAuthStateChanged(auth, (user) => {
            if(user) {
                userEmail = user.email;
                userName = user.displayName || "Student";
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById("payButton").addEventListener("click", () => {
            const options = {
                "key": "rzp_live_SSiYcJa8TB4OIC", // Active Razorpay Key
                "amount": parseInt(price) * 100, 
                "currency": "INR",
                "name": "Olympiad Portal",
                "description": "Unlock: " + title,
                "handler": function (response) {
                    // Payment Successful, finalize data and route to success screen
                    localStorage.setItem("activeSessionId", sId);
                    localStorage.setItem("activeSessionPrice", price);
                    window.location.href = "payment-success.html";
                },
                "prefill": { "name": userName, "email": userEmail },
                "theme": { "color": "#38bdf8" }
            };
            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (response) { alert("Payment Failed: " + response.error.description); });
            rzp.open();
        });
    </script>
</body>
</html>
