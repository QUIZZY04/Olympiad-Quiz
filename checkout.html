<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment - Olympiad Portal</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #0f172a;
        }
        .status-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border-top: 5px solid #ff6b00;
            transition: 0.3s;
        }
        .spinner {
            border: 4px solid rgba(255, 107, 0, 0.2);
            border-top: 4px solid #ff6b00;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        p {
            color: #475569;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        a.fallback-btn {
            display: none;
            background: #ff6b00;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            width: 100%;
        }
        a.fallback-btn:hover {
            background: #ff8c1a;
        }
    </style>
</head>
<body>
    <div class="status-card">
        <div id="statusIcon" class="spinner"></div>
        <h1 id="statusTitle">Processing Payment...</h1>
        <p id="statusMessage">Your payment is being processed. Please do not refresh or press back.</p>
        <a id="fallbackLink" href="live.html" class="fallback-btn">If not redirected within 1 minute, click here</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

        const firebaseConfig = { apiKey: "AIzaSyB49W61ggHHJcAJ5WyYTmX13I8NofsggSY", authDomain: "olympiad-portal-d2a5e.firebaseapp.com", projectId: "olympiad-portal-d2a5e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);

        const statusIcon = document.getElementById("statusIcon");
        const statusTitle = document.getElementById("statusTitle");
        const statusMessage = document.getElementById("statusMessage");
        const fallbackLink = document.getElementById("fallbackLink");

        let verificationAttempts = 0;
        const maxAttempts = 20; // up to ~60s
        let isSuccess = false;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace("login.html");
                return;
            }
            
            const paymentDataStr = localStorage.getItem("paymentData");
            if (!paymentDataStr) {
                window.location.replace("live.html");
                return;
            }
            
            const paymentData = JSON.parse(paymentDataStr);

            if (paymentData.isFree) {
                handleSuccess();
                return;
            }

            pollVerification(paymentData);
        });

        async function pollVerification(paymentData) {
            if (isSuccess) return;
            
            verificationAttempts++;
            
            try {
                const verifyRazorpayPayment = httpsCallable(functions, 'verifyRazorpayPayment');
                await verifyRazorpayPayment({
                    razorpay_order_id: paymentData.razorpay_order_id,
                    razorpay_payment_id: paymentData.razorpay_payment_id,
                    razorpay_signature: paymentData.razorpay_signature,
                    sessionId: paymentData.sessionId,
                    amount: paymentData.amount
                });
                
                isSuccess = true;
                handleSuccess();
            } catch (error) {
                console.error("Verification attempt failed:", error);
                
                if (verificationAttempts >= maxAttempts) {
                    statusMessage.innerText = "Payment is still being processed. Please wait or use the link below.";
                    fallbackLink.style.display = "inline-block";
                    fallbackLink.innerText = "Click here to proceed to Live Test";
                    // keep polling slower if it's still taking time
                    setTimeout(() => pollVerification(paymentData), 5000);
                } else {
                    setTimeout(() => pollVerification(paymentData), 3000);
                }
            }
        }

        function handleSuccess() {
            statusIcon.className = "success-icon";
            statusIcon.innerHTML = "✅";
            statusTitle.innerText = "Payment Successful";
            statusMessage.innerText = "You are being redirected to Live Test page";
            
            fallbackLink.style.display = "inline-block";
            fallbackLink.innerText = "If not redirected within 1 minute, click here";
            
            document.querySelector('.status-card').style.borderTopColor = "#10b981";
            
            setTimeout(() => {
                window.location.href = "live.html";
            }, 3000); // 3-5 seconds redirection
        }
    </script>

</body>
</html>
